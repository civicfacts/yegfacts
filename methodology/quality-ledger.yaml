  # --- cycling volumes, run 2026-09-03 -------------------------------------
  - date: "2026-09-03"
    story: cycling-volumes
    run: reviews/cycling-volumes/2026-09-03
    stage: framing
    seat: Framing check (GPT-5.6 Sol via codex exec)
    event: framing-miss
    materiality: blocking
    disposition: >
      The checker's own replacement wording for claim 2's coverage rule
      fixed a real defect and created a worse one. It made a single word,
      "classifiable", carry two unrelated jobs — whether a counter measures
      an on-street lane at all, and whether its device kept running — and
      voided the whole verdict on either. One counter had died mid-July
      2025, so a dead sensor was set to void a verdict over a set whose
      other counters run in the tens and hundreds a day. Recorded against
      the check and the editor: the checker supplied it under the v1.20
      defect rule, which requires a correction verifiable without judgement,
      and the editor adopted it verbatim without testing it against the
      published counter data, which would have shown the counter it
      voided on. The same four framing reports also left the eligible
      set unpinned: two panel seats derived twenty on-street counters and
      seventeen from the same brief, because the locations dataset has no
      facility-type field and the brief left classification to whatever
      each reader made of the counters' names. Both are corrected in the
      revised brief: out of service is separated from unclassifiable, and
      membership is decided by five ordered tests over named dataset
      fields, with the editor's test of the rule against the published
      data recorded before the re-freeze.
    notes: >
      framing/check-3.md defect 3 and framing/check-4-defects.md; the
      corrections and the revision in run-record.md; the superseded brief
      at sha256 b222574225ea300f924240b715a7332398af5d905a2fc2596d6bc067e33ef700
      and its answers under round1-superseded/.
