# Panel quality record (methodology v1.3)
#
# Adjudicated events involving the three panel seats: errors they made, and
# catches they made that held up. One record per event. Collection began
# 2026-09-01 and this file was seeded backwards from the four published runs.
#
# What this is NOT. It is an error record, not a calibration. Nothing here
# measures a model against known truth — only against what a committed artifact
# later showed. Counts over four runs are noise; a public summary ships when the
# pre-registered nine-story launch slate completes, not before.
#
# Admission rule, applied strictly. An event is recorded only if it can be
# traced to a committed artifact: an `errata.md`, a `gate/` report, a
# `state.yaml` stage note, or a `round2_notes` entry that one of those
# corroborates. Suspicions, unadjudicated cross-accusations and anything
# resting on a reviewer's word alone are left out. That biases this file toward
# undercounting, which is the right direction for a record of one's own errors.
#
# denominator:
#   Claims reviewed per seat so far: 6 each (ebus-procurement-failure,
#   ebus-82m-loss, ebus-cold-cities, climate-on-track,
#   districts-travel-restrictions, wc-too-cold), across 4 published runs, all
#   under methodology v1.0. Every rate computed from this file must use that
#   denominator and say so.
#
# Fields:
#   date        — when the event was adjudicated or caught (ISO-8601).
#   story       — story slug.
#   run         — repo path of the review run.
#   stage       — where it was caught: framing | round1 | staging | round2 |
#                 drafting | gate. "framing" is the stage-1 framing check
#                 (methodology v1.7), recorded against the checker seat.
#   seat        — the canonical seat name from the run manifest, never a
#                 model's self-report. Two seats appear together only where the
#                 committed artifact does not separate them.
#   event       — fabricated-citation | false-accusation | unsupported-figure |
#                 valid-catch | self-correction | gate-rejection |
#                 framing-miss (a brief defect the framing check passed and a
#                 later stage caught).
#   materiality — blocking if the defect would have reached published output had
#                 the pipeline not caught it; minor if it could not have.
#   disposition — what was done.
#   notes       — the artifact that establishes it.

events:
  # --- electric buses, run 2026-08-31 -------------------------------------
  - date: "2026-08-31"
    story: electric-buses
    run: reviews/electric-buses/2026-08-31
    stage: staging
    seat: Gemini 3.1 Pro
    event: fabricated-citation
    materiality: blocking
    disposition: >
      Excluded from the evidence registry at staging; no published statement
      rests on it. Recorded in errata.md rather than edited out of the raw file.
    notes: >
      round1/gemini.json cites a CBC URL ending 1.7100000 as an article about
      the Proterra lawsuit; the URL resolves to an unrelated CBC story. Caught
      at evidence staging (status content-mismatch) and independently flagged in
      round 2 by the Claude seat. Sources: errata.md item 1; run.yaml notes;
      gate/release-check.md §5a and §5b.

  - date: "2026-08-31"
    story: electric-buses
    run: reviews/electric-buses/2026-08-31
    stage: round2
    seat: Gemini 3.1 Pro
    event: self-correction
    materiality: minor
    disposition: >
      Recorded as a documented position change, not treated as an error. The
      stated reason is evidentiary, not social — it moved on what the record
      could carry, which is what cross-review is for.
    notes: >
      Downgraded ebus-procurement-failure from Supported to Partially supported,
      because the sharpest shortfall figures rest on the City's untested
      adversarial court filings and the buses continued daily service. Under the
      v1.3 round-1 basis this no longer touches the canonical finding, which is
      Partially supported either way. Source: round2/gemini.json
      round2_notes.verdict_changes[0].

  - date: "2026-08-31"
    story: electric-buses
    run: reviews/electric-buses/2026-08-31
    stage: round2
    seat: Claude Fable 5
    event: valid-catch
    materiality: blocking
    disposition: >
      Upheld. None of the flagged URLs entered the evidence registry, and the
      findings resting on them were downgraded rather than published.
    notes: >
      Identified that every load-bearing citation in the Gemini seat's review
      failed verification — implausibly round article IDs on the CBC and St.
      Albert Gazette URLs, 404s on the Edmonton Journal, Concordia and TTC
      pages. Sources: round2/claude.json round2_notes.errors_in_other_reviews[0];
      gate/release-check.md §5a, which quotes it, and §5b, which lists five
      known-bad citations traced to these round-2 notes.

  - date: "2026-08-31"
    story: electric-buses
    run: reviews/electric-buses/2026-08-31
    stage: round2
    seat: GPT-5.6 Sol
    event: valid-catch
    materiality: blocking
    disposition: >
      Upheld. The affected findings were not published as verified evidence.
    notes: >
      Independently flagged that the Gemini seat's Edmonton Journal URL returned
      404 and its CBC URL was content-mismatched, and that findings resting on
      them (165 km range, fleet unavailability, warranty claims) must not be
      labelled strong verified evidence when a retrievable court filing exists.
      Sources: round2/gpt.json round2_notes.errors_in_other_reviews[0] and [2];
      gate/release-check.md §5b.

  - date: "2026-09-01"
    story: electric-buses
    run: reviews/electric-buses/2026-08-31
    stage: drafting
    seat: GPT-5.6 Sol + Gemini 3.1 Pro
    event: valid-catch
    materiality: blocking
    disposition: >
      All 16 findings fixed in the draft before the gate.
    notes: >
      Stage-6 faithfulness check of the Claude-drafted story and claims against
      the merged evidence. The committed record gives the aggregate only — it
      does not attribute the 16 findings between the two checking seats — so
      this is one record naming both rather than two guessed ones. Source:
      reviews/electric-buses/state.yaml, drafting stage note.

