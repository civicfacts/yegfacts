# Methodology changelog. Every entry bumps the version.
# CI requires an entry here for any change under prompts/, scripts/merge*,
# scripts/synthesize*, or methodology/.
- version: "1.20"
  date: "2026-09-03"
  scope: framing-check-defect-not-framing
  summary: >
    A framing check that has run out of rounds can still leave arithmetic
    behind it. An error inside a verdict ladder is now a defect rather than a
    framing finding: the editor corrects it in the checker's own words and the
    brief gets one confirmation round. Everything about what a brief tests is
    still framing, and still capped at three.
  highlights:
    - "The distinction, written narrowly so it cannot be stretched. A defect finding is one where the checker states the correction and the correction is verifiable without judgement. Three kinds qualify and nothing else does: verdict bands that overlap or leave a gap, a stated rule whose direction contradicts its own arithmetic, and a coverage or completeness rule that lets an unclassified remainder decide a verdict. Internal consistency and arithmetic. That is the whole list, and a defect finding that does not carry the checker's exact replacement wording is not one, because there would be nothing to verify."
    - "Everything else is a framing finding and stays capped at three reports under v1.12: what the claim tests, whose reading of it, the value of a cutoff, whether a source is adequate, whether a verdict is reachable, whether the brief leaks an expectation. If a finding can be argued about, it is a framing finding, because the test for a defect is that there is nothing left to argue about."
    - "What changes. A defect finding still standing after the third report no longer parks the brief. The editor corrects it using the wording the checker supplied, records each correction in the run record against the finding it answers, and the brief goes back for one defect confirmation. That fourth report may do two things: confirm the corrections, or name further defects. Nothing else."
    - "The guard, which is the point of the amendment. If the defect confirmation raises a framing finding, whether new or revived, the brief stays parked and no further round is available. Without that, a framing objection could be relabelled a defect to buy a fourth pass and the cap would be worth nothing. The checker, not the editor, labels each finding framing or defect in its own report, so the distinction is auditable in the committed record rather than asserted afterwards by the person it benefits. prompts/framing-check.md now carries the definition, the labelling requirement and the fourth round."
    - "This does not loosen the v1.8 bound the cap descends from. A cutoff justified from an identified standard, or stated with one reasonable alternative and results required under both, is still sufficient, and the checker still may not ask for an alternative to the alternative. The value of a cutoff is a framing question, capped at three, and not renegotiable in a defect round. What a defect round may fix is whether the bands drawn around that value cover every number once, which is arithmetic and has one right answer."
    - "Why now, and by whom. The rule was amended by the editor it had just blocked, on the brief it had just blocked. That is the least comfortable way for a rule to change and it is stated here for that reason. The site's first register-chosen question, cycling-volumes, went through three framing checks; the third settled the framing and called the contested editorial call defensible. What it left standing was three defects, all arithmetic inside verdict ladders, all introduced by the editor while adopting the checker's own findings, and all with the checker's replacement wording already written down."
    - "The test that justifies it, stated so it can be applied without today's case in front of you. The failure would exist whatever brief hit it. A ladder that assigns two verdicts to the same total is worse if it passes than if it parks, so the cap is protecting nothing by holding it. And v1.12's escape clause, that a parked brief reopens only on new intake evidence, can never be satisfied by an arithmetic typo, because no evidence about the world bears on whether one number falls in two bands. A cap that can never release what it caught is a cap on the wrong thing."
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: About and independence
      href: /about
  note: >
    The obvious objection is that the editor changed the rule that had just
    stopped the editor's own brief, and it is the right objection to make.
    Three things are offered against it and nothing more. The definition names
    three failures and excludes judgement by construction, so a finding anyone
    could argue with is not one of them. The checker labels its own findings,
    so an objection cannot be reclassified after it has been read. And a
    framing finding in the fourth round parks the brief for good, so the extra
    round is worth nothing to anyone trying to use it as a second attempt at
    framing. What would show this was wrong is a defect round that turns into
    a framing argument, or briefs that start needing a fourth report as a
    matter of course; both are visible in the run records, and the founder can
    revert this the way he can revert anything else here.
- version: "1.19"
  date: "2026-09-03"
  scope: claim-dispositions
  summary: >
    Two new dispositions on a published claim. A finding that stands under a
    question nobody was arguing about comes off the board with a dated note
    saying so, and an undisputed premise moves underneath the contested claim it
    supports. Four of the ten published claims left the board. Nothing was
    deleted, corrected or merged, and every page is still at its address.
  highlights:
    - "The founder's complaint is why this version exists: the site had spent panel runs establishing things nobody was arguing about. So all ten published claims went back through the current four tests, as if each had arrived today. Three stand as they are, one stays on the board with its reopening condition recorded, two were already withdrawn under v1.13, and four come off the board here. Three of those four come off for one reason, said plainly: nobody was arguing about them."
    - "board_withdrawn is a finding that stands under a question that was not worth asking. The claim keeps its page, its finding, its evidence and its history, and comes off the findings board, the home page's count, the findings feed and the search index. Its own page and its question's page carry a dated note. That note is written to be read as what it is. The finding was not wrong, nothing was corrected, and what changed is our own judgement about whether the question deserved a panel run. It is a more uncomfortable admission than a correction and the copy does not soften it."
    - "Two of the three are the comparisons on the bike-lane money. at-100m-vs-snow sets four years of capital spending against one year of operating spending, so the ratio does not mean what it appears to mean. at-100m-vs-roads depends on a roads-only category the adopted budget does not itself publish. Both are queued for a re-run on a common, defined basis. Both notes also say the thing the founder said about them: these figures are the arithmetic under an argument the site has not checked, which is whether Edmonton is letting roads, alleys and basic services go while it funds bike lanes. That question is on the register and cleared to check. This version does not answer it and does not re-frame the question the two claims sit under, because re-framing is a fresh brief and a panel run, and doing half of one inside a presentation change would leave the site asserting a framing nobody reviewed."
    - "The third is climate-on-track, and it is the plainest case on the list. The City's own carbon budget states that Edmonton is not on track, so no answer this panel could have reached would have surprised anybody. It was never a contested claim."
    - "context_for is the second disposition and it is not a withdrawal. That Edmonton's Proterra buses substantially failed to deliver what the City contracted for is the undisputed basis of the City's own lawsuit, not something anyone disputes. So it comes off the board like the above, and on the question's page it renders underneath the $82 million claim as established background. This is not a wasted panel run. It is the premise that makes the $82 million question worth asking, and it belongs under that question rather than competing with it."
    - "The two e-bus claims are not merged and will not be. Two assertions under one finding is the compound-claim failure two specialist board reads rejected in v1.16: a single finding over both would state neither, and everybody quoted beneath it would be tagged with a verdict on a claim they did not make. They stay two claims with two findings and only the presentation changes. scripts/validate.ts holds the narrow part of that, checking that a context_for target is a claim on the same question, that no claim carries both dispositions, and that no two claims name each other."
    - "ebus-82m-loss stays on the board, unchanged. Both readers parked it because the bankruptcy has not concluded, and its published answer already says nobody can tell yet, which is the correct answer to give. Its reopening condition goes in the story's changelog, where the schema already has a place for one rather than needing a new field: it reopens when the Proterra estate reports what Edmonton actually recovers."
    - "The two readers agreed on six of the ten, which is published here rather than smoothed over. They were not applying the same test. One asked mostly whether the record can answer the claim, which is test 2 on its own; the other asked the whole set, including whether the comparison is sound and whether anybody disputes it. The founder's own example was caught by one and missed by the other: on the snow comparison one reader named the capital-against-operating mix, and the other read the numbers as sitting in the budget and let it through."
    - "The combining rule inverts for a retro-triage, and that is the editorial call in this version. At intake a claim survives on one GO, because discarding a real claim is the costlier error. On work that is already published the cost runs the other way, because keeping means leaving something live that a reader says should not have been checked, and re-running a claim that turns out to be fine costs one panel run. So on published work a park or a decline from either reader is enough to act. The lean changes direction once the thing being judged is in front of readers."
    - "What this does not touch: no finding changed, no page moved, no evidence was removed, no run was repeated. Every claim that left the board is still reachable from /questions and from its own URL, with the dated note saying why."
  links:
    - label: Edmonton's electric buses
      href: /questions/electric-buses
    - label: The $100 million for bike lanes
      href: /questions/active-transportation
    - label: Every question we've considered
      href: /questions
  note: >
    The uncomfortable part is not that a finding was wrong. None of them was. It
    is that four panel runs went to questions that did not need one, and three of
    those had answers nobody would have argued with. A correction is easier to
    publish than this, because a correction says the method worked and caught
    something. This says the method answered honestly and the site chose the
    wrong question, which is the one fault no amount of reviewer independence
    can catch, since every guard here runs after the question is chosen. That is
    also why the dispositions are not deletions. The claims stay published, at
    their addresses, with their evidence and their notes, because a site that
    quietly removes its weak work is asking to be trusted about what it removed.
- version: "1.18"
  date: "2026-09-03"
  scope: plain-speech-answers
  summary: >
    Every claim now carries its own one-sentence answer, in the words a person
    would use, and a reader from a different vendor has to pass it before it
    publishes. The thirty-word cap that produced the prose this replaces is
    gone, and nothing has been put in its place.
  highlights:
    - "The founder's complaint was that the language on the site is not human, that nobody speaks the way it describes things. The cause turned out to be measurable rather than a matter of taste: five of the six published one-sentence answers were exactly thirty words long, against a thirty-word cap. The limit had become a target. Each answer crammed a whole finding set into one breath with colons and semicolons, because the writer was filling the space rather than answering the question, and the rule meant to keep answers short was producing the densest prose on the site."
    - "So the cap goes and nothing replaces it. What does the work now is punctuation. An answer may not use a colon, a semicolon, an em dash or an en dash, because that punctuation is how a second idea gets into a sentence; hyphens inside ordinary compounds are English and stay. The general rule is written down with it: a limit every instance sits on is generating the failure it was meant to prevent, and if a new limit starts collecting instances at its ceiling it is wrong and it goes."
    - "The answer moves onto the claim, which is the unit of judgement. One sentence used to sit on the story and answer every claim under it, which is exactly why it needed semicolons: three findings in one breath. A claim carries one finding, so it now carries one answer, and it opens with the stance a person would say rather than the finding word. The finding word stays where it was, as the badge beside the answer. The badge does the method's job, the answer does the human one, and both appear on every page that shows either."
    - "The story keeps a standfirst where a question has several claims and may drop it where a question has exactly one, in which case that claim's answer is the sentence. Five of the six published standfirsts broke the punctuation rule and were rewritten. Nothing was deleted. Every fact they carried is still on the page, in the TL;DR or the body, and each story's changelog says so."
    - "docs/DESIGN.md section 12 is the standard: what the question, the claim, the answer and the explanation each have to do, and what a script can check against what a reader has to. The schema checks shape only, which is the punctuation, the stance opener and the absence of a finding word. A method-vocabulary list in scripts/validate.ts prints warnings and never fails the build, because a word list that fails the build is the next rule that deletes true content."
    - "The plain-speech read is a required stage with a named artifact, not a style guide. prompts/plain-speech-read.md goes to a model from a different vendor than the one that drafted, at stage 6 beside the faithfulness check, and asks four things: would a person say this out loud, does it make sense to somebody who has not seen the question, is every fact carried by the key facts, and has anything true been dropped rather than moved down. Its report is committed under the run directory at plain-speech/, in the shape the faithfulness reports use, and every published claim names that file in plain_speech_read. scripts/validate.ts checks the file is on disk, so a claim that cannot name its read does not publish."
    - "The control that makes the read worth running is the clause accounting. Every substantive clause of the draft, and of the wording it replaces, has to be booked as kept, moved to the explanation, split into another claim, or dropped with a written reason. This project has already had a rule delete true content once, when a numbers-in-every-bullet rule gutted a story whose key facts were absences in a bylaw's text, and a standard about brevity is exactly the shape of rule that does it again."
    - "The stage exists because of what happened the first time the read ran. The site's own editor drafted the ten answers under the standard it had just written, and the GPT seat rewrote nine of them. The drafts leaned on the question the reader could not see, said 'the buses' with nothing to attach it to, carried two supporting facts where the rule allows one, and in one case asserted a budget total the key facts did not carry. Nine of ten is the argument for the stage, and it is a poor argument for letting the drafting seat mark its own work."
    - "One rewrite was rejected, in writing, under the reader's own section of the committed report. For at-100m-vs-roads the reader offered the budget's combined 'active pathways and roads' line as the roads figure; that line contains the bike lanes being compared against it, and the claim's own key facts say the adopted budget publishes no roads-only total. The reader's other objection to that answer was right and was applied. The editor may reject a rewrite on evidence and has to say so where a reader can find it. The editor may not publish an answer this read has not seen."
    - "What this has not touched, stated plainly: ten answers and six standfirsts. No story prose has been rewritten under the standard yet. The explanation rules in section 12 are written and unenforced, and the pages under the answers still read the way they read before."
  links:
    - label: Edmonton's electric buses
      href: /questions/electric-buses
    - label: How a finding is produced
      href: /methodology#stages
  note: >
    Deleting a limit is the move that looks like loosening a rule, and the
    honest reading is that the limit was doing the damage. Thirty words was a
    number somebody picked; what it produced, on five answers out of six, was a
    sentence built to reach it. The replacement is stricter where it matters,
    because a colon is how a second idea gets in and there is now no way to
    write one, and it is the reader rather than the counter who decides whether
    a sentence is one a person would say. The part worth being uncomfortable
    about is that the editor wrote this standard and then failed it nine times
    out of ten on the first attempt. That is the case for the read being a stage
    with an artifact rather than a habit, and it is on the public record for the
    same reason the rest of the method is.
- version: "1.17"
  date: "2026-09-03"
  scope: launch-slate-dropped
  summary: >
    The nine-story slate, fixed in public before the first panel ran, is no
    longer part of the method and comes off the site. Reading whole sources
    does the job it was built for, and does it on every source rather than
    once.
  highlights:
    - "What the slate was: nine stories and fourteen claims between them, named in the design document before any verdict existed, with the site not to be promoted until all nine had run. It defended against one accusation, that this site would test whatever flattered it, and its entire strength was that the naming came first."
    - "That defence is now made continuously rather than once. Since v1.15 nobody selects: a source is read end to end and what it holds is written down whether convenient or not, and the register prints the fate of each item. The first source handled that way threw up 34 questions, sixteen of which had people on both sides of them. Nine titles chosen back in August do less work than a page showing everything the method has looked at."
    - "The slate had also become impossible to satisfy. Under v1.15 a wording nobody has been shown saying cannot go to a panel, and the slate's wordings were composed, not spoken. Two of them already sit on the register as parked, each with the reason beside it, and they stay: they were considered and declined, which is true whatever becomes of the slate."
    - "Removing a pre-registration is exactly the manoeuvre a pre-registration is meant to make impossible, which is why it is written down here instead of being quietly deleted. Anyone who saw the nine stories can find out what became of them."
    - "No new bar takes its place. The slate also carried the rule for when the site could be promoted, and dropping it leaves that unset. When to promote is an open question in the board record; this entry does not answer it, and nothing on the site should be read as though it had."
    - "Nothing about the panel, the verdict words or the publication gate moves. Published stories keep their findings and their pages, and no run is repeated over this."
  links:
    - label: Every claim we've considered
      href: /considered
    - label: The launch slate, dropped
      href: /methodology#launch-slate
  note: >
    The founder's line, on being told for the third time that the launch bar
    needed restating, was that everything had changed since it was written. He
    was right. The bar was drafted for a site that chose its claims one at a
    time, and the site does not do that any more. The part worth being
    uncomfortable about is the shape of the move: a promise made in public,
    withdrawn by the people who made it, on their own argument that they have
    something better. That argument happens to be true, and it would sound the
    same if it were false. So the protection is not our word for it. It is a
    published list of every claim considered, which a reader can check against
    the sources it came from, and this entry, sitting in the version history
    where the promise used to be.
- version: "1.16"
  date: "2026-09-03"
  scope: claims-grouped-into-investigations
  summary: >
    Propositions from a source are now grouped twice. Claims that one
    investigation would settle share a brief and a panel run; only claims that
    are the same assertion share a finding.
  highlights:
    - "The founder read the register the previous version produced and found what was still wrong with it: several separate claims per argument, each of which would cost its own panel run. Four of them turned on who pays for Edmonton's roads. Checked one at a time that is four briefs, four panels and four near-identical findings, and it had already produced an incoherent result, three of the four cleared for checking and the fourth declined as undisputed inside a thread that is an argument about exactly that."
    - "prompts/intake-group.md groups at two levels because they do different work. An investigation is one question, one brief, one body of evidence, one panel run, and propositions belong in the same one when a reviewer reading the same documents would settle both. A claim gets one finding, so it is one assertion: the same wording again, or a flat denial, is a variation of a claim, while a different predicate, scope, period or quantifier is a different claim in the same investigation."
    - "Opposite claims share an investigation and never share a finding. Whether concrete barriers delay emergency vehicles and whether responders ride down the lanes to pass traffic are one question and two claims. A single finding over the pair would state nothing, and it would label everybody quoted under it with a verdict about the other side's argument."
    - "scripts/intake-groups.ts refuses a grouping that would do that. Every proposition is placed exactly once, a claim whose variations argue different ways fails, and a claim's wording has to be copied verbatim from one of its propositions rather than composed, so a reader comparing a claim with the quotes under it finds the same sentence. Whether a two-sided question is framed so it can be answered either way is a judgement, so the script prints those questions for a person to read instead of guessing at them."
    - "Triage now rules on investigations. On the first source that is 34 decisions rather than 112, and the two readers agreed on 30 of 34 where the same two readers had agreed on 78 of 112 ruling claim by claim."
    - "An accusation against a named person is declined even when the question around it goes ahead. Grouping keyed that decision off the investigation at first, and the readers quite reasonably cleared the question of what city hall pays and what councillors have filed, so the accusation sitting inside it was published in full. The decline belongs to the claim: it carries its own refusal, and the register file may not hold the wording either, since a slug is as public as a sentence."
    - "The register grows a level to match. An investigation carries the question, the outcome and the reason; a claim says which investigation it is checked under and carries no outcome of its own. /considered lists investigations, ordered by how many people discussed each, so a question dozens of people are arguing about sits above one raised by a single commenter and cost is spent in that order. Cost still decides when a question is checked, never whether."
    - "Counts say a question or a claim was discussed by so many people, never that it was agreed with: somebody counted under a claim may have been arguing against it. One pseudonym is one person within one source, so the count is exact there; nothing sums a person across sources."
    - "Two specialist board reads rejected the first version of this, in which the group itself carried one finding, and both were right. What one of them called the hostile reading is the sentence to keep: that this site would harvest real quotes to build a consolidated strawman, knock it down with a single verdict, and make everyone quoted look like they were lying."
  links:
    - label: Every claim we've considered
      href: /considered
    - label: How a claim gets in
      href: /methodology#intake
  note: >
    The previous version stopped the editor choosing which claims to check. It
    did not stop the same argument arriving as five claims, and five checks of
    one argument is both a waste and a worse answer than one check would be. So
    the grouping is the fix, and the care in it is all about where a finding
    attaches. Group for work and you save panel runs. Group for verdict and you
    produce a finding that answers none of the claims under it while labelling
    the people quoted beneath it. Those are different operations on the same
    list, and the method now does them separately: the investigation is the unit
    of work, the claim is the unit of judgement, and a question both camps are
    asking is one investigation with claims pointing in both directions.
- version: "1.15"
  date: "2026-09-02"
  scope: whole-source-intake
  summary: >
    The unit of intake is now a whole source rather than a claim someone
    picked out of it. Three cheap models list every factual claim the source
    contains, one strong model merges the three lists, and a script proves
    that nothing they raised was lost on the way to that list.
  highlights:
    - "Anyone may submit a source: a social post with all of its comments, an article, a discussion. Every materially factual claim in it is extracted and dispositioned. Nothing is passed over for looking uninteresting, because nobody is choosing."
    - "prompts/intake-extract.md: three cheap seats, one per panel vendor, each read the whole source alone and list every claim they find, with the words that carry it copied exactly and the comment those words sit in. prompts/intake-merge.md: one strong seat then folds the three lists into propositions, carrying every captured wording forward as a form. The models, their reasoning settings and the exact commands are recorded in each run's manifest."
    - "scripts/intake-coverage.ts checks the arithmetic rather than trusting it. Every claim raised by every seat has to turn up in the merged list, either under a proposition or on a dropped list with one of three permitted reasons: not a claim, a duplicate of the seat's own quote, or not about Edmonton civic government. A seat that logs two assertions as one claim has it split across two propositions, which the check reports rather than treats as a fault. What this proves is narrow and worth stating narrowly: nothing the seats raised was lost between them and the list. It does not show the seats found everything in the source, and no script can show that."
    - "Quotes are checked by script before the merge sees them. A form whose words are not one unbroken run of the comment it cites, or that cites a comment index the capture does not have, is thrown out and the discard recorded. Seven forms across two seats went out that way on the first source read this way. A wrong quote is a false attribution to a real person, which is worse than a missed claim."
    - "No invented claims. A wording the editor or the founder thought of is still registered, but it does not run: it sits at PARK until a captured form of it turns up in a real source. Only wording somebody actually said reaches a panel."
    - "This touches the pre-registered launch slate (docs/DESIGN.md section 7). The slate's topics stand and none of them is dropped. But a slate claim's registered wording is not itself a captured form, so the bar for launch has to be restated after a retro-triage of the claims already published. That restatement is open, and this entry does not settle it."
    - "prompts/intake-triage-batch.md goes to two readers rather than one, both from a different vendor than the editor, neither shown the other's answer. Each rules on every proposition in the source, GO, PARK or NO, with a reason written for whoever suggested the claim. They combine so that going ahead takes both readers, or one GO and one PARK; a decline takes two NOs; everything else parks, a GO set against a NO included. A claim wrongly discarded is gone from the record and nobody can see what was lost; a claim held too long is only late. The verdict matrix leans the same way on findings, and this applies that lean to selection. Where the readers split, the published reason says so."
    - "A source can carry a claim that accuses a named person of wrongdoing, dishonesty or an improper motive. It is extracted like every other claim, so it is counted rather than hidden, then flagged and declined in triage with a standing public reason: an accusation can only be published fairly once the person accused has been asked and their answer printed, and v1 has no such process. The register keeps the row, its outcome and its reason, and publishes neither the accusation nor the name. The identifier is neutral too, because a slug in a URL is published as surely as a paragraph; the wording and the comments go to a private record so the decision stays auditable. What an office-holder did in office is not in this class and is not withheld: a motion brought, a vote cast, a lane installed are matters council minutes settle, and this site names office-holders when it reports them."
    - "Commenters in a capture are given a stable label of the form adjective, Edmonton animal, first initial, such as Snowy Hare F. The label is chosen from a hash of the name, so re-exporting the same source produces the same label every time. Magpie is excluded, being Stew's bird. Public office-holders keep their names. The mapping from label back to name is held privately and is never published."
    - "The Claude panel seat moves from Fable 5.1 to Opus 5. The reason is money: the founder's Fable allowance on his subscription is nearly used up. It is not a finding that one model reviews better than the other, and nothing here measures that. The pins recorded in v1.5 (the seat) and v1.6 (reasoning effort) stand as written. Runs already published under Fable 5.1 keep the model their manifests record and are not re-run over this."
    - "Prompted by the founder's read of the published stories, 2026-09-02: the site was checking arithmetic inside a councillor's quotation, a capital-against-operating budget comparison, and whether the City is on track for its climate targets, while the arguments people were actually having went unchecked. Every check added since v1.10 asked whether a claim could be tested fairly. None asked whether it was the thing being argued about."
    - "Not proven: the extraction has been run on exactly one source, a thread of 621 comments, and nobody has yet shown that a second triage read of the same proposition list reaches the same dispositions. Reproducibility of the disposition is an open question in the board record, not a settled property of the method."
  links:
    - label: How a claim gets in
      href: /methodology#intake
    - label: Every claim we've considered
      href: /considered
  note: >
    Choosing claims by hand was the fault. An editor reading a thread picks
    what looks checkable, and what looks checkable is rarely what people are
    arguing about. Every guard added to this method since v1.10 has been about
    testing honestly: the claim at its strongest, in the units a reader would
    actually use, against a threshold set in advance. All of those questions
    presume the claim was worth the panel's time in the first place, and none
    of them can catch a claim that should never have been chosen. So the
    method stops choosing. The whole
    source comes in, every factual claim in it comes out, a script proves the
    count survived the merge, and triage disposes of the lot together. What
    that buys is an answer to "why this claim and not that one": there is
    none, because there was no selection. What it costs is volume, and a
    triage step that now rules on many propositions at once instead of one.
    One source has been through the pipeline. The disposition step is the
    part nobody has run twice on the same input, so the honest claim for this
    version is narrow: selection bias is out of intake, not out of the
    method.
- version: "1.14"
  date: "2026-09-02"
  scope: panel-seat-tooling
  summary: >
    The Gemini seat's pinned command now approves its own tool calls inside
    its sandbox, because in headless mode it returned nothing whenever a
    brief named PDF sources.
  highlights:
    - "scripts/panel/run-reviewer.sh: the Gemini seat runs `agy --effort high --sandbox --dangerously-skip-permissions --print-timeout 45m -p`. Headless agy auto-denies any tool that needs a permission prompt; the seat reaches for a shell (curl, wget, python3) whenever a brief names PDF sources its URL tool cannot read, and then returns nothing."
    - "On the active-transportation brief the seat failed four times under the previous command and twice more with the brief's documents pre-fetched as text files and a note that it had no shell. Its earlier failure on the low-density-history rerun (six attempts) was the same fault."
    - "The other two seats already run with a shell (the Claude seat's Bash tool, the Codex seat's read-only sandbox), so this levels the seats rather than loosening one. Blindness still comes from the scratch directory, which holds only the package, and repo paths are never passed to a seat."
    - "Founder decision, recorded in the board record; the pre-fetched packet remains the better long-term fix and stays open."
    - "scripts/panel/extract-review.ts: a `$schema` key echoed at the root of a reviewer's answer is dropped before validation. The Gemini seat's first complete review under the new command failed only on that key; it was extracted by hand with the key removed and recorded in the run manifest and the run's errata."
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: Active transportation investment
      href: /facts/active-transportation
  note: >
    A seat that cannot read the documents a brief names is not an
    independent reviewer of them. Six empty returns on one brief, four
    under the pinned command and two with the documents supplied as
    text, showed the fault was the headless permission model, not the
    package. The change is to the seat's own command, is recorded in
    every run manifest from here on, and does not touch the package the
    three seats receive.
- version: "1.13"
  date: "2026-09-02"
  scope: findings-board
  summary: >
    A checked story whose claims are all Not established, and all parked
    or declined on a triage read, stops being a finding; it moves to the
    claims considered and its page stays.
  highlights:
    - "A story leaves the findings board, the story list, search results and topic counts when every claim on it is Not established and a triage read of those claims (prompts/intake-triage.md) returns PARK or NO for each. Its page stays at its URL with a note at the top, so nothing disappears quietly and corrections still apply."
    - "The story is listed on /considered under Checked, not answered, with a one-sentence reason and the condition on which it reopens. The register entry and the triage read are public."
    - "First application: Infill teardown prices. Both published claims are Not established; the read parked both, one because the price-gap ratio needs a decade-scale lot-by-lot linkage the run did not build, the other because no public record says what the housing that replaced particular demolished homes costs."
    - "Every candidate with an intake record and a triage read gets a page of its own under /considered, rendered from the same files that are kept on GitHub."
    - "Prompted by the founder, who asked whether it is good to publish stories that are meaningless. A Not established verdict is a finding when the question is one people ask and the record could have answered it; when neither holds, a verdict tells the reader nothing and the board should not carry it."
  links:
    - label: Every claim we've considered
      href: /considered
    - label: Infill teardown prices
      href: /facts/infill-prices
  note: >
    Not established was doing two jobs: an answer (the record was
    checked and does not support the claim) and a shrug (nobody could
    check). Only the first belongs on a board of findings. The second
    belongs with the claims considered, where the reader can see why.
- version: "1.12"
  date: "2026-09-02"
  scope: intake-triage
  summary: >
    A one-page triage decides whether a claim is worth checking before any
    brief is written; the framing check is capped at three reports.
  highlights:
    - "prompts/intake-triage.md: a model other than the editor answers five questions from the intake record, who asks this in their words, how it circulates and what we captured, whether the public record can answer it at the level people ask, which verdicts are possible and whom each would surprise, and what it costs. It ends GO, PARK or NO with a one-sentence reason that can be shown to whoever suggested the claim."
    - "GO requires a real question, a record that can answer it at a level people care about, and at least two verdicts that would surprise someone. The editor may overrule a NO in writing."
    - "The framing check is capped at three reports: after the second the editor resolves open findings in writing, the third confirms, and a brief still at REVISE after the third is parked and reopens only on new intake evidence."
    - "A public candidate register, intake/register.yaml, lists every claim the site has considered, sent to triage or not, with where its wording came from (captured, supplied, or the editor's own hypothesis) and the outcome. Cost decides when a claim is scheduled, never whether it is worth checking; who is affected and whether a decision turns on it decide that."
    - "An Evidence and Methodology specialist read (GPT) said REVISE before first use and named what is still missing: a harm and neglect test with teeth, an audit of a sample of NO and PARK decisions, intake events in the quality ledger, and a preregistered blind re-triage pilot. The register, the origin labels, the cost rule and the cap resolution are adopted here; the rest is recorded as an open question in the board record."
    - "Prompted by the founder: the first delegated story spent four briefs, twelve framing checks and four panel rounds on claims nobody asks; two of them are now being re-framed. The first case through triage is the re-brief of that story."
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: Infill teardown prices
      href: /facts/infill-prices
  note: >
    Every check in this method asks whether a claim is fair, precise or
    computable. None asked whether it was worth the work, so the loop
    optimised claims into shapes the record could answer and nobody had
    asked. Triage puts the reader's question first and the cost beside
    it, and the cap on framing rounds stops the loop from running past
    the point where the claim is still the claim.
- version: "1.11"
  date: "2026-09-02"
  scope: framing-check-who-asks-this
  summary: >
    A brief must name the question a resident or reporter would actually
    ask, and the proposition must answer it, not a measurable cousin of it.
  highlights:
    - "Check 9 in prompts/framing-check.md: the brief states the question people actually ask; a proposition stated in the units the record happens to publish, when nobody would ask it in those units, fails even if every other check passes."
    - "Where the record cannot answer at the level people ask, the brief says so and tests the nearest level the record does answer, in words a reader would use."
    - "Prompted by the founder's read of the published infill story: its two claims were shaped by what the record could compute (a lot-matched value ratio; a purchase model on separately titled dwellings) and answered questions nobody asks. The story is being re-briefed around the questions people do ask: were the demolished houses more affordable than what replaced them, is new infill luxury housing, and can a median-income household afford infill."
  links:
    - label: Infill teardown prices
      href: /facts/infill-prices
    - label: How a finding is produced
      href: /methodology#stages
  note: >
    v1.10 stopped a claim from being neutralised into a truism. This
    entry closes the neighbouring gap: a claim can be fair, checkable
    and precise and still be a question nobody asked, because the
    framing loop optimises toward what the record can compute. The
    check now starts from the reader's question and works back to the
    record, instead of the other way round.
- version: "1.10"
  date: "2026-09-02"
  scope: framing-check-truism-test
  summary: >
    The framing check must reject a proposition that no informed person
    disputes. The first published delegated claim was one.
  highlights:
    - "The price-gap claim in Infill teardown prices asked whether housing built on a teardown lot is worth more than the house demolished for it. Nobody disputes that; the circulating claim is about a modest house replaced by housing priced near a million. Four framing-check reports and an escalation neutralised the magnitude out of the brief in the name of fairness to the claim's holder, and the editor adopted each step."
    - "Check 3 of prompts/framing-check.md now says a truism is as much a framing defect as a weak-man, and that a claim about magnitude or consequence must carry it with a predeclared threshold and one alternative."
    - "A new check 8, stakes: the brief must say what each verdict would mean to a holder and to an opponent; if no verdict would surprise either side, or one verdict is impossible on any evidence, the brief is sent back. Two overriding rules: a claim is tested as its holders assert it, so an example offered for a general pattern is tested as the pattern; and a proposition may be made more precise than the claim as made, never weaker."
    - "The claim is re-briefed as the magnitude proposition and re-run; the published finding stands, with a dated editorial note, until the re-run replaces it. Logged in the quality ledger against the check and the editor."
  links:
    - label: Infill teardown prices
      href: /facts/infill-prices
    - label: How a finding is produced
      href: /methodology#stages
  note: >
    v1.9 fixed the check for asking the record for things it cannot
    supply. This entry fixes the opposite: the check pushed a claim into
    a form the record could answer only by draining it of the thing
    people argue about. The founder saw it on the published page and
    said so. Fairness to a claim's holder means testing the claim they
    make, at its strongest, with the magnitude they assert; a threshold
    is a judgement, so the brief states one and one alternative, and the
    reader sees both.
- version: "1.9"
  date: "2026-09-01"
  scope: framing-check-checkability-and-first-use
  summary: >
    First use of delegated briefs: both panels halted on framing concerns
    the check had passed. The check now sees the output schema, must name
    a published source for every threshold, and must verify that every
    instrument a brief relies on exists.
  highlights:
    - "Both first briefs passed the framing check, then the research panel halted synthesis on a MATERIAL FRAMING CONCERN. Infill: the brief relied on a mature-neighbourhood instrument in force on the freeze date, and none exists since the overlay was retired on 2024-01-01. Low-density history: a density rule the check itself had demanded could not be computed from the 1926 record, and the brief demanded variant verdicts the schema cannot carry."
    - "The framing checker now receives prompts/review-schema.json and may not ask for outputs it cannot carry; must name the published source a reviewer would compute any threshold from, or drop it; and must verify that every instrument, boundary, dataset or definition exists as described on the as-of date."
    - "The reviewer prompt says to write MATERIAL FRAMING CONCERN only to raise one; the synthesis script ignores a negated mention, since a seat wrote 'no MATERIAL FRAMING CONCERN' and a plain text match would have halted on it."
    - "The panel quality ledger gains a framing stage and a framing-miss event; six events from the two first runs are recorded, four valid catches by seats and two misses by the check."
    - "Both stories are being rerun under revised briefs: infill with the dwelling unit as the verdict unit and a frozen historical overlay boundary, low-density history with classification by each era's own terminology and documented housing form, counts from published neighbourhood records. Evidence from the halted runs stays in the registry."
    - "Date erratum: the first run directories and the v1.7 and v1.8 entries were dated 2026-09-02; the actual date was 2026-09-01. Entry dates are corrected; committed directory names are kept and each run's errata records it. The runner's pinned Gemini command could not run as written and is corrected."
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: Panel quality record
      href: /methodology#panel-quality
  note: >
    The framing check was designed to keep a brief fair; on first use it
    kept the brief fair and made it unresearchable, because the checker
    optimised definitions without knowing what the output schema carries
    or what the historical record can supply. The panel caught both
    cases in round one, which is the method working as designed, and
    the cost was two halted runs. Three changes follow: the checker sees
    the schema, the checker must name the published source behind every
    threshold it asks for, and the checker must confirm that the
    instruments a brief relies on exist. The halted runs, their
    concerns, the revised briefs and every check report are committed
    beside each other so a reader can see the loop.
- version: "1.8"
  date: "2026-09-01"
  scope: framing-check-escalation-and-bound
  summary: >
    Framing-check disputes now resolve with Stew as editor, on the
    record; the check no longer asks for alternatives to alternatives.
  highlights:
    - "A finding still open after two revisions is decided in writing by Stew, the editor responsible for content, with the checker's standing objection kept in the committed record. The founder is not asked to arbitrate; he stays accountable and can revert."
    - "A cutoff justified from an identified standard, or stated with one reasonable alternative and results under both, is sufficient. The checker may not ask for an alternative to the alternative."
    - "First use: both infill briefs reached check 3 still at REVISE; the open findings and the editor's resolution of each are committed beside the briefs."
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: About and independence
      href: /about
  note: >
    v1.7 sent unresolved framing disputes to the founder. On first use
    both briefs reached that point, and the founder declined the role:
    editorial content is the steward's responsibility, he supplies
    ideas. So the escalation now ends with Stew deciding in writing,
    and the record shows what the checker still objected to. The
    founder's accountability is unchanged in kind: a standing power to
    revert, not a per-item approval. The second change closes a
    regress the first use exposed: a predeclared threshold was asked
    for an alternative, and the alternative would then have needed
    one. One identified standard, or one alternative with results
    under both, is now enough.
- version: "1.7"
  date: "2026-09-01"
  scope: delegated-briefs-and-framing-check
  summary: >
    Stew, the AI steward, now writes review briefs; a second model from a
    different vendor checks the framing before a brief is frozen. Applied
    retroactively, the check would have sent all four published briefs
    back for revision.
  highlights:
    - "Briefs are drafted by Stew from an intake record that states where each circulating form came from, or that it was not captured. No founder approval is needed per story; the founder's accountability is unchanged."
    - "Before a brief is frozen, a model from a different vendor runs prompts/framing-check.md; it looks for propositions that test a weaker or wider claim than the post made, verdict-sensitive definitions with no stated alternative, and sentences that tell reviewers where to land. The brief is frozen only on FRAME OK; after two unresolved revisions the disagreement goes to Ildar Abdulin in writing."
    - "Every check report, the author's response and any resolution are committed beside the brief. A framing defect found later by the panel, the gate or a correction is logged against the check in the quality ledger."
    - "Run retroactively on the four published briefs, the check returned REVISE on all four, mainly for site-written paraphrases presented as circulating forms, sentences naming which evidence 'would contradict' the claim, and folded or undefined propositions. The reports are committed beside each brief; the findings stand as published and each story will be re-framed and re-run under this version."
    - "Two specialist board reviews (Evidence and Methodology on GPT, Public Trust on Gemini) reviewed the design before first use; both said revise. Their controls that were adopted are the intake record, the alternative-operationalization requirement, the mandatory re-check, the human circuit-breaker and the ledger entry. Not adopted yet: a public waiting period between freeze and panel, and a blind human-methodologist pilot."
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: About and independence
      href: /about
  note: >
    Every brief so far was drafted by an AI session and ratified by the
    founder at the publication gate, which D-0007 then delegated to AI
    audits. This entry says so plainly and closes the loop: Stew writes
    the brief, and the safeguard that delegation needs is a framing check
    by a model from a different vendor, run before the freeze, whose
    report is public. The check's questions are the ones a fair-minded
    holder of the claim and a fair-minded opponent would both ask: is
    this the claim I made, is it the strongest fair reading, would I have
    accepted these definitions before seeing the result, and does the
    brief tell the reviewers what to find. Run on the four published
    briefs, the check said all four would need revision. None of that
    changes a published finding, because the panel and the gate decided
    on evidence, but it does mean the frames the panel was given were
    weaker than this version requires. The reports are committed beside
    the briefs, and the four stories are scheduled to be re-framed and
    re-run under v1.7 rather than patched. The two specialist reviews are
    archived in the board's private record; their two unadopted asks are
    recorded there as open questions, with the founder's decision pending.
- version: "1.6"
  date: "2026-09-01"
  scope: reviewer-effort-pinning
  summary: >
    Pinned the reasoning-effort setting for every panel seat and started
    recording it in run manifests.
  highlights:
    - The Claude command now carries --effort high; the GPT and Gemini commands already pinned it.
    - Every seat runs at its vendor's "high" setting, the highest level the three CLIs share.
    - "Claude and Codex offer settings above high. They are not used: the founder finds the extra cost and run time unmatched by better results, and nothing here benchmarks that."
    - The runner writes the effort into each review file and the run manifest, and the site displays it from the manifest.
    - Runs before v1.6 show "not recorded" for effort; the Claude seat's effort came from an unpublished local default and is not backfilled.
    - The run manifest now also records each seat's display name, so the site no longer reconstructs it from the provider field.
    - "Tooling correction: the manifest stamper read the wrong end of the changelog and wrote methodology_version 1.0 on runs made under later versions. Fixed and tested; earlier manifests are left as written."
  links:
    - label: How a finding is produced
      href: /methodology#stages
  note: >
    Models are released often — Fable 5.1 shipped the day of this entry — and
    the reasoning-effort setting changes what a model returns as much as the
    model version does. Leaving it unpinned made the published command
    incomplete for one seat: prior Claude runs inherited an unpublished local
    default rather than a setting on the record. Effort is now pinned in the
    command, stamped onto each review file by the runner, and recorded per run
    in run.yaml. Every seat is pinned to "high" for two reasons: it is the
    highest level all three CLIs share (the Gemini CLI stops there), and while
    Claude and Codex offer settings above it, the founder does not use them for
    the panel — in his experience they cost significantly more and run longer
    without a matching gain. That is a judgement call, not a measurement; no
    benchmark of the trade-off exists here. Two smaller corrections ride along:
    the manifest now names each seat directly, and the script that stamps the
    methodology version onto manifests was reading the oldest changelog entry
    instead of the newest, so runs made under v1.1 through v1.5 are labelled
    "1.0" in their manifests. The stamper is fixed; the earlier labels stay as
    written, because a manifest is a record of what ran, including its
    mistakes.
