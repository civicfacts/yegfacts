- version: "1.4"
  date: "2026-09-01"
  scope: verdict-semantics-and-freshness
  summary: >
    Tightened the rule for "Partially supported" findings and added a
    freshness check before publication.
  highlights:
    - A Partially supported finding must name the part of the normalized proposition that fails. Evidence-quality doubts affect confidence, not the finding.
    - The e-bus procurement claim was re-run against archived evidence under the tightened rule.
    - Freshness and completeness are now a third publication-gate audit, including a retroactive pass on the four published stories.
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: The words we use
      href: /methodology#vocabulary
    - label: Electric buses finding
      href: /facts/electric-buses
  note: >
    Two changes from the external review's P0 findings. (1) "Partially
    supported" now structurally requires naming which part of the
    normalized proposition fails; evidence-quality doubts (untested
    allegations, litigation figures) affect confidence, never the
    finding. The one published claim decided under the looser reading
    (e-bus procurement failure) is re-run against its archived evidence
    under the tightened rule; any change ships as a logged
    verdict-change. (2) The publication gate gains a third audit:
    freshness & completeness (prompts/freshness-audit.md) — an
    independent re-search for newer or stronger sources and material
    events between evidence gathering and publication, run before every
    publication and retroactively on the four published stories.
- version: "1.3"
  date: "2026-09-01"
  scope: synthesis-basis-and-vocabulary
  summary: >
    Moved synthesis to independent round-one verdicts, replaced canonical
    confidence with panel agreement, and opened a quality record.
  highlights:
    - The synthesis matrix now uses locked round-one verdicts; round two remains an error-documentation channel.
    - Panel agreement (Unanimous, Adjacent, Split) replaces canonical confidence; per-reviewer confidence remains in AI review.
    - The cautious synthesis rule and its reason are now published, and the panel quality record is open.
  links:
    - label: The synthesis matrix
      href: /methodology#synthesis
    - label: Panel quality record
      href: /methodology#panel-quality
  note: >
    Four decisions from the 2026-09-01 methodology panel, resolved with
    written second and third opinions (dispositions in
    methodology/reviews/2026-09-01-panel/DISPOSITIONS.md). (1) Synthesis
    now consumes the locked ROUND-1 verdicts. Round 1 is the only round
    in which the three reviewers are independent; synthesising from
    round 2, where each has read the other two, treated a deliberative
    round as the vote. Round 2 keeps its job as an error-documentation
    channel: every final position is carried into synthesis.json as
    round2_positions and rendered, and a material catch there (fabricated
    citation, wrong evidence) triggers a fresh blind re-run of the
    affected claim rather than a correction inside the run. Verified
    before adoption and re-verified on switching: the round-1 and round-2
    multisets give identical canonical findings on all six published
    claims, so no published verdict changed. (2) The canonical per-claim
    "confidence" is replaced by PANEL AGREEMENT — Unanimous, Adjacent or
    Split, computed from the round-1 multiset. Confidence named something
    the method never computed and read as a probability that the claim was
    true; agreement describes the panel and is published with a gloss
    saying so. Per-reviewer confidence stays visible in the AI review, and
    the matrix no longer emits a canonical confidence at all. The
    review.agreement value "Majority" becomes "Adjacent" so there is one
    vocabulary. (3) The matrix keeps its cautious lean and now publishes
    the reason: a qualification found by one reviewer does not disappear
    because two missed it, and for a fact-checking site overclaiming is
    the costlier error. The veto objection is answered by disclosure — the
    vote composition is always displayed — not by averaging. (4) A panel
    quality record opens at methodology/quality-ledger.yaml: adjudicated
    per-seat events (fabricated citations, false accusations, unsupported
    figures, self-corrections, catches that held up), each traceable to a
    committed artifact, seeded retroactively from the four published runs
    with the per-seat denominator stated. It is an error record, not a
    calibration; a summary publishes when the nine-story slate completes.
    Reviewer prompts, the merge, and the 20 matrix rows' findings are
    unchanged.
- version: "1.2"
  date: "2026-09-01"
  scope: artifact-hygiene-and-honesty
  summary: >
    Made evidence and review artifacts more explicit, and aligned the public
    site with the delegated publication gate.
  highlights:
    - Evidence items now show fetch status and registry ID, so unverifiable citations are visible.
    - Panel identity comes from the run manifest; known artifact errors get adjacent errata files.
    - Reviewers now flag framing problems, and story pages link to the brief and gate reports.
    - Composite paraphrases are labelled as paraphrases.
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: Electric buses finding
      href: /facts/electric-buses
  note: >
    Changes from the first methodology/trust panel review (three models
    reviewing the process, not the stories; full reports in
    methodology/reviews/2026-09-01-panel/). (1) Evidence items in
    combined-evidence artifacts now carry an explicit fetch status and
    registry id — unverifiable citations are flagged, never silent.
    (2) Panel identity is rendered from the run manifest, never from a
    model's self-report. (3) Raw artifacts known to contain errors get an
    errata.md beside them; the record is annotated, never edited.
    (4) Reviewer prompt now instructs reviewers to flag material framing
    problems in the brief; a material framing flag halts synthesis until
    the brief is revised and round 1 rerun. (5) Site copy reconciled with
    the v1.1 delegated gate everywhere; gate audit reports and the frozen
    brief are linked from each story's AI-review section. (6) "Claims
    we're seeing" drops social-platform styling; composite paraphrases
    are visually labeled as paraphrases. Research, merge, cross-review,
    and synthesis rules are unchanged.
- version: "1.1"
  date: "2026-09-01"
  scope: publication-gate
  summary: >
    Delegated the final publication audit to a separate AI audit pair while
    keeping founder accountability.
  highlights:
    - A source-verification audit checks every published statement against archived source bytes.
    - A privacy and copyright release check covers raw review artifacts.
    - Both reports are committed with the run; the founder remains accountable for everything published.
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: Who builds it
      href: /about#who-builds-it
  note: >
    Publication gate delegated: the founder's per-story manual review is
    replaced by a dedicated AI audit pair — source verification of every
    published statement against archived source bytes, and a
    privacy/copyright release check of raw review artifacts — with both
    reports committed alongside the run. The founder holds a standing
    delegation, remains accountable for everything published, and can
    revert any publication. Research, merge, cross-review, and synthesis
    stages are unchanged.
- version: "1.0"
  date: "2026-08-31"
  scope: initial
  summary: >
    Established the first public methodology: three independent reviewers,
    deterministic synthesis, and a human publication gate.
  highlights:
    - Three reviewers work independently in blind round one.
    - A deterministic merge and multiset synthesis matrix produce canonical findings.
    - A cross-review round documents errors, drafting gets a two-model faithfulness check, and a human publication gate closes the process.
  links:
    - label: How a finding is produced
      href: /methodology#stages
    - label: The words we use
      href: /methodology#vocabulary
  note: >
    Initial methodology: three-reviewer panel (Claude Fable 5, GPT-5.6 Sol,
    Gemini 3.1 Pro via CLI), blind round 1, deterministic merge,
    cross-review round 2, deterministic multiset synthesis matrix,
    drafting with two-model faithfulness check, human publication gate.
    Reviewer verdicts: Supported / Partially supported / Not established /
    Contradicted. Canonical findings add Mixed (split panel only).
