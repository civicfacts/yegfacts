story: electric-buses
date: "2026-08-31"
methodology_version: "1.0"
brief: brief.md
notes: >
  First production run, orchestrated manually before scripts/panel existed.
  Gemini round 1 took 4 attempts (CLI flag parsing and headless tool-permission
  denials; no model output in failed attempts). One Gemini round-1 citation was
  found to be hallucinated at evidence staging and excluded from the registry.
runs:
  - round: 1
    provider: "anthropic"
    model_id: "claude-fable-5"
    cli: "claude (Claude Code CLI)"
    cli_version: "2.1.252"
    command: "claude -p --model claude-fable-5 --allowedTools \"WebSearch,WebFetch\" < package.md"
    prompt_sha256: "3f7a3c31aee6cbfbc3dbc2df24a06661541aaf64d47d428ff15e811668831b98"
    methodology_version: "1.0"
    started_at: "2026-09-01T06:11:24Z"
    finished_at: "2026-09-01T06:11:24Z"
    timestamps_note: "finished_at from output file mtime; started_at not separately recorded in this first manual run"
    isolation: "scratch dir outside repo; web tools only"
  - round: 1
    provider: "openai"
    model_id: "gpt-5.6-sol (self-reported gpt-5)"
    cli: "codex (Codex CLI)"
    cli_version: "0.151.0"
    command: "codex exec -m gpt-5.6-sol -c model_reasoning_effort=high -c tools.web_search=true -s read-only --skip-git-repo-check - < package.md"
    prompt_sha256: "3f7a3c31aee6cbfbc3dbc2df24a06661541aaf64d47d428ff15e811668831b98"
