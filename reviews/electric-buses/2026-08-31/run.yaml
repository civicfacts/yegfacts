story: electric-buses
date: "2026-08-31"
methodology_version: "1.0"
brief: brief.md
prompt_files: [prompts/reviewer.md, prompts/review-schema.json]
round1:
  gemini:
    provider: google
    model_self_reported: "Gemini 3.1 Pro"
    cli: "agy (Antigravity CLI)"
    cli_version: "1.1.23"
    command: 'agy --effort high --sandbox --print-timeout 45m -p "$(cat package2.md)"'
    isolation: "scratch dir outside repo; sandbox flag; web read/search tools allowed via permissions.allow"
    attempts: 4
    attempt_notes: >
      Attempts 1-3 failed on CLI flag parsing (-p consumed --effort) and
      headless tool-permission denials (command, read_url); fixed by
      passing prompt as -p value, adding a no-terminal instruction to the
      package, and allowing read_url(*)/search(*) in agy settings. No
      model output was produced in failed attempts.
    package_note: "package2.md = package.md + explicit no-terminal-access instruction"
    status: ok
  claude:
    provider: anthropic
    model_self_reported: "claude-fable-5"
    cli: "claude (Claude Code CLI)"
    cli_version: "2.1.252"
    command: 'claude -p --model claude-fable-5 --allowedTools "WebSearch,WebFetch" < package.md > out.json'
    isolation: "scratch dir outside repo; only WebSearch/WebFetch tools allowed"
    attempts: 1
    status: ok
  gpt:
    provider: openai
    model_self_reported: "gpt-5"
    model_requested: "gpt-5.6-sol"
    cli: "codex (Codex CLI)"
    cli_version: "0.151.0"
    command: 'codex exec -m gpt-5.6-sol -c model_reasoning_effort=high -c tools.web_search=true -s read-only --skip-git-repo-check - < package.md'
    isolation: "scratch dir outside repo; read-only sandbox; web search enabled"
    attempts: 1
    status: ok
    note: "model self-reports generic 'gpt-5'; command pinned gpt-5.6-sol"
round2:
  all_three: {status: ok, commands: same-as-round1, package: "cross-review.md + fetch report + all round1 JSONs + combined evidence + brief"}
