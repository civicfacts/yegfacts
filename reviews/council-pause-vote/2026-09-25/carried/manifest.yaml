redaction_rule:
  version: 4
  rule: In a minutes list introduced by "The following public speaker(s)" or "The following member(s) of the delegation" (not Administration's delegation), each listed name that is not an office-holder named in the page's attendance list or roll call becomes "[member of the public]"; an organisation after the name is kept. An attachment whose title starts with an agenda item number, then optionally a hyphen, then "Panel <n>" (any case), becomes "<item number> - Panel <n> - [member of the public]"; no other title changes. In a Requests to Speak motion ("That ... hear from the following ... speakers"), each listed entry is withheld unless it begins with an agenda item number, and the operative words, mover, vote and result are kept. No other motion text is changed. Office-holders are matched without a leading Mayor, Deputy Mayor, Acting Mayor, Councillor, Chair or Vice-Chair, ignoring case.
