<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YEGFacts.ca</title>
<meta name="description" content="Edmonton civic evidence, checked against the record.">
<link rel="icon" href="symbol.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #123F35;
    --navy: #123B5D;
    --gold: #C3A35E;
    --paper: #FAF9F6;
    --ink: #20272B;
    --rule: #E8E9E6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  main { text-align: center; max-width: 34rem; }
  img.symbol { width: 168px; height: auto; margin-bottom: 1.75rem; }
  h1 {
    font-size: clamp(2rem, 8vw, 2.75rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--forest);
  }
  h1 .tld { color: var(--gold); }
  p.tagline {
    margin-top: 0.9rem;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--navy);
  }
  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2rem auto;
    width: 6rem;
  }
  p.status { font-size: 0.95rem; color: var(--ink); }
  p.contact { margin-top: 0.6rem; font-size: 0.95rem; }
  a { color: var(--forest); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--gold); }
</style>
</head>
<body>
<main>
  <img class="symbol" src="symbol.png" alt="" width="480" height="400">
  <h1>YEGFacts<span class="tld">.ca</span></h1>
  <p class="tagline">Edmonton civic evidence, checked against the record.</p>
  <hr>
  <p class="status">Launching soon.</p>
  <p class="contact"><a href="mailto:hello@yegfacts.ca">hello@yegfacts.ca</a></p>
</main>
</body>
</html>
