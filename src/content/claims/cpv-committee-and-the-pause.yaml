id: cpv-committee-and-the-pause
question: Did council's Infrastructure Committee turn down administration's proposed pause on the remaining bike routes, and did full City Council later decide it?
story: council-pause-vote
finding: Partially supported
answer: >-
  Partly. Council's Infrastructure Committee left administration's plan to take another look at 14 bike routes undecided, neither adopting it nor voting it down.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.42"
review_run: reviews/council-pause-vote/2026-09-25
plain_speech_read: reviews/council-pause-vote/2026-09-25/plain-speech/gpt-1.md
topics: [transportation, bike-lanes, city-hall]
evidence: [YF-EV-0209, YF-EV-0210, YF-EV-0118, YF-EV-0140, YF-EV-0222, YF-EV-0223, YF-EV-0216, YF-EV-0227, YF-EV-0221, YF-EV-0204, YF-EV-0214, YF-EV-0228, YF-EV-0229]
key_facts:
  - text: "Report IS03688 asked the Infrastructure Committee to recommend to City Council that the updated approach for the remaining routes, as outlined in its Attachment 5, be approved. The report marked this \"Council decision required\"."
    sources: [YF-EV-0118]
  - text: "In Version 2 of Attachment 5, the latest of its three versions, routes that leave travel lanes and parking alone continue as planned, the remaining routes are to be evaluated for trade-offs, design options and budget, and administration would bring a report to Council in the first quarter of 2027 for direction and approval. It lists 14 projects that may be re-evaluated."
    sources: [YF-EV-0140]
  - text: "The committee's minutes record no motion to adopt the recommendation, moved or put."
    sources: [YF-EV-0209]
  - text: "Councillor A. Salvador moved that administration continue the program within its previously approved scope, advance tendering for routes ready to tender and get the rest ready for 2027. It was defeated 2 to 2, with A. Salvador and M. Janz in favour and E. Rutherford and R. Clarke opposed."
    sources: [YF-EV-0209]
  - text: "Rutherford's amendment to drop the instruction to make the most of the remaining 2026 construction season was also defeated 2 to 2. Mayor A. Knack and Councillor A. Paquette, both committee members, are recorded on neither vote. The only motion on the item that carried kept a confidential attachment private, 4 to 0."
    sources: [YF-EV-0209]
  - text: "At Executive Committee on September 2, 2026, Salvador could not make a pending motion on the program for lack of time and gave notice of it again. At City Council on September 8, that notice, asking administration to prepare options for more money to complete the 14 routes for the 2027 to 2030 budget, was laid over to October 6, 2026."
    sources: [YF-EV-0216, YF-EV-0227]
  - text: "The City Council agenda for October 6, 2026, as published on September 25, lists Salvador's motion and no item on report IS03688 or its Attachment 5."
    sources: [YF-EV-0221]
  - text: "The minutes of the Council public hearings of September 15 and 22, 2026 hold no item on report IS03688 or its Attachment 5. The only item on the active transportation network, on September 15, set a new due date for a separate report on updating the network in the City's planning bylaws."
    sources: [YF-EV-0228, YF-EV-0229]
aliases:
  - council-rejected-bike-route-pause
  - did-council-pause-bike-routes
register_claims: [council-rejected-pause]
limitations:
  - "The body that met on August 26, 2026 was the Infrastructure Committee, a committee of Council with six members, not City Council. A committee decision is not a Council decision. This finding is about the committee. For City Council as a whole, the records reviewed show no decision on the recommendation by September 25, 2026, and some Council meetings in that period were not reviewed."
  - "The finding reads \"did not support\" strictly, as a choice made, because that is what \"ignore\" and \"go their own route\" describe. Read loosely, as the plan simply not being adopted, the claim holds in full."
  - "No override happened. The committee made no decision on the plan for Council to overturn, and no later Council decision on it appears in the records the reviewers read."
  - "Which version of Attachment 5 was before the committee is not recorded. This check reads Version 2, the latest, because the record does not say. Under it, what went undecided was a plan to re-evaluate routes and report back, not a hold on them. Under the first version, and Version 1, it was a hold. The finding is the same either way, because the committee decided neither."
  - "The minutes do not say why the mayor and Councillor Paquette are not recorded on the two votes. Paquette was absent for part of the meeting."
  - "The reviewers read selected items from the September Council minutes, not every page of every Council meeting up to September 25. The September 15 and 22 public-hearing minutes were not among them. This site read them after the panel ran and found no item on the report. The City's open voting record, checked by one reviewer on September 29, 2026, showed no Council vote on the report through September 22."
  - "The program kept the scope Council approved in December 2022, as later changed for 50 Street by Council on July 7, 2026. The report's own statement that construction not yet started was best postponed to 2027, because of the weather, is administration's assessment and not a Council decision."
unknowns:
  - "What City Council will do with Salvador's motion, laid over to October 6, 2026, after this page's cut-off date of September 25."
  - "Whether any Council meeting before September 25, 2026 that the reviewers did not read dealt with the report."
missing_evidence:
  - "Complete City Council minutes for every regular meeting from August 26 to September 25, 2026, read whole rather than as selected items (City of Edmonton, Office of the City Clerk)."
