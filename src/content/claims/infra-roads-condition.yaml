id: infra-roads-condition
question: Were Edmonton's roads in poor condition in the City's latest published ratings?
story: infrastructure-deficit
finding: Partially supported
answer: >-
  Partly. The City's latest ratings put about a ninth of Edmonton's roads in poor or very
  poor condition at the end of 2024, counting them by what they would cost to replace.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.39"
review_run: reviews/infrastructure-deficit/2026-09-03
plain_speech_read: reviews/infrastructure-deficit/2026-09-03/plain-speech/gpt-1.md
evidence: [YF-EV-0200, YF-EV-0202, YF-EV-0205, YF-EV-0206]
key_facts:
  - text: "The City's 2025 Infrastructure State and Condition Report is the latest condition rating it had published by 2026-09-03. It says its data was collected as of December 31, 2024, so it describes the roads on that date and not in the summer of 2026."
    sources: [YF-EV-0200]
  - text: "Appendix B of the report puts the City's Roads class at a replacement value of $10,484,313,206 on December 31, 2024. By that value, 70.8 per cent was rated good (A or B), 16.2 per cent fair (C), 11.2 per cent poor or very poor (D or F) and 1.7 per cent not rated."
    sources: [YF-EV-0200]
  - text: "On December 31, 2024, the City's Roads class held three things: paved roads, 12.5 per cent poor or very poor; unpaved roads, none of which were rated; and curbs, 7.0 per cent poor or very poor. The three add up to the class's replacement value, and weighting their shares by that value gives back the class's 11.2 per cent, a check made here."
    sources: [YF-EV-0200]
  - text: "The City grades on five steps, A very good to F very poor, on physical condition. A D asset has a major portion that is physically deficient. An F asset is physically unsound or not performing as intended, with a higher probability of failure, and needs replacement or major refurbishment."
    sources: [YF-EV-0200]
  - text: "Beside each 2025 row, the appendix prints the 2023 report's figure. The Roads row there is 11.4 per cent poor or very poor, with no curbs row. The report says its own methodology differs from previous years, so the two are not a like-for-like trend."
    sources: [YF-EV-0200]
  - text: "The report's service view groups a wider set, Roads Service Assets, at $15,697,712,522, with 11.6 per cent poor or very poor on December 31, 2024. That grouping landed in the same band as the Roads class."
    sources: [YF-EV-0200]
  - text: "The report went to the City's Infrastructure Committee on 2026-02-23, where Administration presented it. It had been on the Executive Committee's agenda for 2026-01-21 and was deleted from that agenda."
    sources: [YF-EV-0205, YF-EV-0206]
  - text: "The 2019-2022 capital budget said the City had 1,180 kilometres of alleys and that two-thirds of them were in poor condition. The same budget describes an Alley Renewal Strategy, introduced in 2017, to eliminate alleys rated to be in very poor condition."
    sources: [YF-EV-0202]
  - text: "The 2019-2022 capital budget measures arterial roads against a Council target, which is that under 10 per cent of them should be rated D or F. It applies to arterial roads alone."
    sources: [YF-EV-0202]
aliases:
