id: infra-bike-money-renewal-eligible
question: Did the $100 million Edmonton approved for bike lanes come from money that could have paid for road and alley renewal instead?
story: infrastructure-deficit
finding: Partially supported
answer: >-
  Partly. City records list all $100 million as borrowing repaid from taxes, which the two
  OpenAI reviewers read as money roads could have used and the Anthropic reviewer could not
  check.
evidence_basis: Direct Edmonton evidence
panel_agreement: Split
methodology_version: "1.39"
review_run: reviews/infrastructure-deficit/2026-09-03
plain_speech_read: reviews/infrastructure-deficit/2026-09-03/plain-speech/gpt-1.md
evidence: [YF-EV-0114, YF-EV-0131, YF-EV-0204, YF-EV-0203, YF-EV-0130, YF-EV-0129]
key_facts:
  - text: "The profile sheet for the program in the adopted 2023-2026 Capital Budget, CM-20-0330, lists one approved funding source, Tax-Supported Debt, at 5,950, 26,750, 33,650 and 33,650 thousand dollars for 2023 to 2026, 100,000 in all."
    sources: [YF-EV-0114]
  - text: "The December 2022 budget minutes record that council approved CM-20-0330 for $100,000,000 \"with funding coming from Tax-Supported Debt\". The motion carried 9 to 4."
    sources: [YF-EV-0131, YF-EV-0204]
  - text: "The same profile sheet classes the program as 100 per cent growth and none of it renewal. Its description says it \"includes funding to supplement renewal projects where alignment exists\"."
    sources: [YF-EV-0114]
  - text: "Before the $100 million carried in December 2022, four amendments proposing other amounts or arrangements for the program were withdrawn. Each named tax-supported debt as the funding."
    sources: [YF-EV-0204]
  - text: "In December 2024, council defeated 4 to 7 a motion to take $33,650,000 out of each of 2025 and 2026, which the motion described as funding from tax-supported debt."
    sources: [YF-EV-0203]
  - text: "In June 2025 council moved $430,000 out of the program into a Dunluce neighbourhood and alley renewal profile, leaving it at $99,570,000. That is the only change to its approved amount the panel found."
    sources: [YF-EV-0130, YF-EV-0129]
aliases:
  - could-bike-lane-money-have-fixed-roads
  - bike-lane-money-for-road-repair
register_claims: [spending-100-million-despite-deficit]
limitations:
  - "The panel split by vendor. In the blind round the Anthropic seat, Claude Opus 5.5, found the claim not established, and both OpenAI seats, GPT-6 Sol and GPT-6 Luna, found it supported. The two OpenAI seats are not independent of each other, so this is one reading from each vendor and not two votes against one. The published finding, Partially supported, is what the site's fixed rule gives for that combination."
  - "The disagreement is over what each seat could open, not over what the documents say. The Anthropic seat could not extract text from the City's budget PDF and was refused by the council meeting portal, so it never saw the profile sheet or the minutes. It had only news and advocacy reports that the program was paid for with tax-supported debt, and the brief does not let a news report carry a figure in a finding. Under the brief's rule every dollar whose source it could not see counted as undetermined, which is a Not established result. It said in its own answer that the likely outcome, if the profile sheet confirmed the reports, was yes, and warned against reading its result as the City publishing too little."
  - "Both OpenAI seats read the profile sheet and the minutes and found the whole amount on tax-supported debt. Under the brief's rule, general City capital money, including tax-supported debt, counts as money that could have gone to road or alley renewal unless the record restricts it. Neither seat found a grant or any other restricted source. This site then read the profile sheet and the minutes in its own archived copies, and they say what the two OpenAI seats reported. That check is the site's, made after the panel, and it does not change the finding."
  - "In the cross-review round, after reading the other two answers, the Anthropic seat found a further City record, a capital financial update to June 30, 2023, listing the program as \"Tax-Supported Debt - 100,000\", and moved to supported. That round documents errors and cannot change a finding, so the finding stays where the blind round put it. The June 2023 record could not be archived for this page."
  - "The finding is about where the money came from. It does not say council would have spent the money on roads or alleys, that it should have, or that money was moved out of road renewal into bike lanes. None of the three reviewers found a transfer from a renewal budget into the program, among the council records and budget adjustments they could reach."
  - "Two reviewers reported that a borrowing bylaw passed in April 2023 authorised the debt for this project, so moving it elsewhere after that date would have needed council to act. That bylaw could not be archived for this page. It came after the December 2022 approval this finding is about."
  - "Borrowing is repaid with interest out of the operating budget. That is a cost of the choice and not a restriction on what the money could be spent on, and this finding does not weigh it."
  - "The $100 million used here is the amount approved in December 2022. The later $99.57 million is above both of the brief's lines, $50 million and $25 million, so the result would be the same on either amount."
unknowns:
  - "How much of the approved borrowing has actually been issued as debt, as distinct from approved."
  - "Whether any budget adjustment the reviewers could not reach moved money between the program and a renewal budget."
missing_evidence:
  - "A transaction-level record of every change to CM-20-0330's budget and its funding source from 2023 to 2026 (City of Edmonton, Financial and Corporate Services; moderate)."
review:
  agreement: Split
  reviewers:
    - model: Claude Opus 5.5
      verdict: Not established
      confidence: Low
      key_findings:
        - "Could not read the profile sheet or the council minutes, so every dollar's source was undetermined under the brief's rule."
        - "News reports of a 2023 council debate said the program was financed with tax-supported debt, which would make it eligible, but a news report cannot carry a figure in a finding."
        - "Found no restricted grant tied to the program."
      changed_between_rounds: "Moved to Supported in cross-review after finding a City capital financial update listing the program as tax-supported debt, and said the change rested on that City record, not on the other reviewers' verdicts. The cross-review round cannot move a finding."
    - model: GPT-6 Sol
      verdict: Supported
      confidence: High
      key_findings:
        - "The adopted profile lists only tax-supported debt, $100 million across 2023 to 2026, and the December 2022 minutes record the same source."
        - "A later borrowing bylaw limits what can be done with the debt after approval, but does not show council could not have chosen road or alley renewal when it allocated the money."
      changed_between_rounds: "No change."
    - model: GPT-6 Luna
      verdict: Supported
      confidence: Moderate
      key_findings:
        - "The adopted profile lists the entire $100 million as tax-supported debt, eligible under the brief's rule for general capital funding."
        - "This answers where the money came from, not whether council would have redirected it."
      changed_between_rounds: "Stayed at Supported, now with High confidence."
