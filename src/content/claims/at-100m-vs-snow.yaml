id: at-100m-vs-snow
question: Is the $100 million approved for bike lanes almost double the City's annual snow-clearing budget?
story: active-transportation
finding: Partially supported
evidence_basis: Edmonton budget documents
panel_agreement: Unanimous
methodology_version: "1.14"
review_run: reviews/active-transportation/2026-09-02-rerun
evidence: [YF-EV-0114, YF-EV-0115, YF-EV-0117, YF-EV-0122, YF-EV-0123, YF-EV-0124, YF-EV-0125, YF-EV-0126, YF-EV-0127, YF-EV-0128, YF-EV-0131, YF-EV-0133]
key_facts:
  - text: "The comparison was made as stated: a campaign page captured on 2022-12-12 says the $100 million for bike lanes is \"almost double the City's annual snow-clearing budget\", without giving a snow figure."
    sources: [YF-EV-0122]
  - text: "The $100 million is capital profile CM-20-0330, approved by council on 2022-12-16 (9 to 4) for 2023 to 2026: $5.95 million, $26.75 million, $33.65 million and $33.65 million by year, funded by tax-supported debt."
    sources: [YF-EV-0131, YF-EV-0114, YF-EV-0117]
  - text: "The City's printed 2022 budget for the Snow and Ice Control program, the annual figure in force when the comparison was made, is $64.466 million of expenditure and transfers in the Approved 2019-2022 Operating Budget. $100 million is 1.55 times that: well above it, but not almost double."
    sources: [YF-EV-0115]
  - text: "Council added to that 2022 budget three times during the year, all one-time: $2.3 million carried forward from the 2021 program's surplus on 2022-03-14, $14.3 million for the enhanced snow-clearing pilot in the spring adjustment of 2022-04-19, and $4.7 million from the Financial Stabilization Reserve on 2022-07-04. Against the budget as amended, $85.766 million, the ratio is 1.17."
    sources: [YF-EV-0124, YF-EV-0123, YF-EV-0115]
  - text: "The City's own year-end table for 2022 gives the program an adjusted expense budget of $79.474 million and an actual expense of $97.571 million. Against that adjusted budget the ratio is 1.26. The panel could not reconcile the $79.474 million with the printed cell plus the three additions, and the difference is recorded, not resolved."
    sources: [YF-EV-0125]
  - text: "For 2023, the year the budget being debated covered, the City's fact sheet gives $60.9 million for snow clearing, a figure that includes the enhanced snow and ice control package council funded on 2022-12-16 ($3.768 million to Parks and Roads Services and $274,600 to Community Standards and Neighbourhoods for 2023). Against $60.9 million the ratio is 1.64."
    sources: [YF-EV-0133, YF-EV-0131]
  - text: "Like for like, the program's 2023 allocation of $5.95 million is 9 per cent of the 2022 snow budget, and its average approved year of $25 million is 39 per cent of it."
    sources: [YF-EV-0114, YF-EV-0115]
  - text: "Snow clearing in the following years cost more than the comparison assumed: adjusted budgets of $63.574 million, $67.090 million and $67.554 million for 2023, 2024 and 2025 against actual expense of $54.917 million, $72.086 million and $76.648 million."
    sources: [YF-EV-0126, YF-EV-0127, YF-EV-0128]
aliases:
  - bike-lanes-double-snow-budget
  - 100-million-bike-lanes-snow-clearing
limitations:
  - "The finding is definition-sensitive, and the brief said in advance that it would be reported as such. On the printed 2022 budget cell the ratio is 1.55 and the classification is Partially supported; on the same budget as council topped it up during 2022 the ratio is 1.17 and the classification is Contradicted; on the 2023 figure it is 1.64, Partially supported again. Neither side can cite the verdict word without saying which budget it compares against."
  - "The holder's comparison sets a four-year capital total against a one-year operating budget. The panel tested it as made, because that is what was said; the like-for-like figures are reported beside it so the mismatch is visible, and they are not the verdict."
  - "The City's year-end adjusted 2022 budget ($79.474 million) does not equal the printed cell plus the three council additions ($85.766 million). The panel reported the gap of $6.292 million and did not resolve it; the year-end table may net items the additions do not."
  - "The 2023-2026 Operating Budget prints no Snow and Ice Control program summary of the kind the 2019-2022 budget prints, so the 2023 figure rests on the City's fact sheet and the December 2022 amendment rather than on a budget-book cell."
  - "Snow and Ice Control actuals exist on two City bases that differ by $3 million to $10 million a year (the year-end operating updates and a 2026 program summary by account category). The year-end figures are used here; the actuals are context in any case, since the claim compares budgets."
unknowns:
  - "Why the City's year-end adjusted 2022 budget for the program differs from the adopted cell plus the three in-year additions."
  - "What the campaign page's author had in mind as the snow-clearing budget; the page gives no figure and no source."
missing_evidence:
  - "A single City statement of the Snow and Ice Control program's approved gross budget for each year 2022 to 2026, before and after in-year amendments, on one basis (City of Edmonton Financial and Corporate Services; moderate)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Fable 5.1
      verdict: Partially supported
      confidence: High
      key_findings:
        - "On the printed 2022 cell the ratio is 1.551; the failing part is the word double, the figure is about half again."
        - "Alternative A, the cell plus every 2022 council addition in force on 2022-12-12, is $85.766 million and 1.166, Contradicted; the City's own year-end adjusted budget of $79.474 million gives 1.258, also Contradicted."
      changed_between_rounds: "Held Partially supported at High. In round 2 documented that the other two seats had counted only the July 2022 addition and missed the March carry-forward and the April spring adjustment, and that Snow and Ice Control actuals exist on two City bases."
    - model: GPT-5.6 Sol
      verdict: Partially supported
      confidence: High
      key_findings:
        - "The printed cell gives 1.551, Partially supported under both cutoff sets; the amount is substantially larger than a year of snow clearing, but almost double fails."
        - "Against the amended 2022 budget the classification is Contradicted, so the finding is definition-sensitive and neither side can cite it without that qualification."
      changed_between_rounds: "Held Partially supported at High. Adopted the full 2022 amendment list surfaced in cross-review ($2.3 million, $14.3 million, $4.7 million) and recomputed Alternative A at 1.166."
    - model: Gemini 3.1 Pro
      verdict: Partially supported
      confidence: High
      key_findings:
        - "The word double is an overstatement under every reading: 1.55 on the printed cell, 1.45 with the July addition, 1.64 on the 2023 figure."
      changed_between_rounds: "Held Partially supported at High. In round 2 acknowledged the March and April 2022 additions it had missed and the spring 2025 transfer out of CM-20-0330."
