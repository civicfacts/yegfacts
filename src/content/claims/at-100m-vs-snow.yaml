id: at-100m-vs-snow
question: Is the $100 million approved for bike lanes almost double what the City budgets for clearing snow in a year? We measured against the snow budget the City printed for 2022, and other City figures for that year change the answer.
story: active-transportation
finding: Partially supported
answer: >-
  Partly. The City approved $100 million for bike lanes over four years, about one and a
  half times the snow budget it printed for 2022 rather than almost double.
evidence_basis: Edmonton budget documents
panel_agreement: Unanimous
board_withdrawn:
  date: "2026-09-03"
  reason: >-
    The comparison sets four years of capital money, which pays to build things, against
    one year of operating money, which pays to run a service, so the ratio does not mean
    what it looks like it means, and a re-run on a common basis is queued. These figures
    are also the arithmetic under an argument the site has not checked, which is whether
    Edmonton is letting roads, alleys and basic services go while it funds bike lanes.
methodology_version: "1.14"
review_run: reviews/active-transportation/2026-09-02-rerun
plain_speech_read: reviews/active-transportation/2026-09-02-rerun/plain-speech/gpt-2.md
evidence: [YF-EV-0114, YF-EV-0115, YF-EV-0117, YF-EV-0122, YF-EV-0123, YF-EV-0124, YF-EV-0125, YF-EV-0126, YF-EV-0127, YF-EV-0128, YF-EV-0131, YF-EV-0133, YF-EV-0136, YF-EV-0139]
key_facts:
  - text: "The comparison was made as stated: a campaign page captured on 2022-12-12 says the $100 million for bike lanes is \"almost double the City's annual snow-clearing budget\", without giving a snow figure."
    sources: [YF-EV-0122]
  - text: "The $100 million is capital profile CM-20-0330, approved by council in its December 2022 budget deliberations (9 to 4) for 2023 to 2026: $5.95 million, $26.75 million, $33.65 million and $33.65 million by year, funded by tax-supported debt."
    sources: [YF-EV-0131, YF-EV-0114, YF-EV-0117]
  - text: "The City's printed 2022 budget for the Snow and Ice Control program, the base budget as adopted and the cell the brief selected, is $64.466 million of expenditure and transfers in the Approved 2019-2022 Operating Budget. $100 million is 1.55 times that: well above it, but not almost double."
    sources: [YF-EV-0115]
  - text: "Council added to that 2022 budget three times during the year, all one-time: $2.3 million carried forward from the 2021 program's surplus on 2022-03-14, $14.3 million for the enhanced snow-clearing pilot in the spring adjustment of 2022-04-19, and $4.7 million from the Financial Stabilization Reserve on 2022-07-04. Under the brief's calculation of the cell plus all three additions, the denominator is $85.766 million and the ratio 1.17."
    sources: [YF-EV-0124, YF-EV-0123, YF-EV-0115]
  - text: "The City's own year-end table for 2022 gives the program an adjusted expense budget of $79.474 million and an actual expense of $97.571 million. Against that adjusted budget the ratio is 1.26. The panel could not reconcile the $79.474 million with the printed cell plus the three additions, and the difference is recorded, not resolved."
    sources: [YF-EV-0125]
  - text: "The City's budget fact sheet gives $60.9 million for snow clearing, without a year. The panel read it as the 2023 approved total, the base budget plus the enhanced snow and ice control package council funded in the same December 2022 deliberations ($3.768 million to Parks and Roads Services and $274,600 to Community Standards and Neighbourhoods for 2023). Against $60.9 million the ratio is 1.64."
    sources: [YF-EV-0133, YF-EV-0131]
  - text: "Same year against same year, the program's 2023 allocation of $5.95 million is 9.8 per cent of the $60.9 million 2023 snow figure, and its 2023 to 2025 allocations of $66.35 million together are 33.5 per cent of the City's adjusted snow budgets for those years ($63.574 million, $67.090 million and $67.554 million)."
    sources: [YF-EV-0114, YF-EV-0133, YF-EV-0126, YF-EV-0127, YF-EV-0128]
  - text: "The City's year-end tables give Snow and Ice Control adjusted budgets of $63.574 million, $67.090 million and $67.554 million for 2023, 2024 and 2025, against actual expense of $54.917 million, $72.086 million and $76.648 million: under budget in 2023, over it in 2024 and 2025."
    sources: [YF-EV-0126, YF-EV-0127, YF-EV-0128]
aliases:
  - bike-lanes-double-snow-budget
  - 100-million-bike-lanes-snow-clearing
limitations:
  - "The finding is definition-sensitive, and the brief said in advance that it would be reported as such. On the printed 2022 budget cell the ratio is 1.55 and the classification is Partially supported; on the brief's calculation of that cell plus the three 2022 additions the ratio is 1.17 and the classification is Contradicted; on the 2023 figure it is 1.64, Partially supported again. Neither side can cite the verdict word without saying which budget it compares against."
  - "The holder's comparison sets a four-year capital total against a one-year operating budget. The panel tested it as made, because that is what was said; the like-for-like figures are reported beside it so the mismatch is visible, and they are not the verdict."
  - "The City's year-end adjusted 2022 budget ($79.474 million) does not equal the printed cell plus the three council additions ($85.766 million). The panel reported the gap of $6.292 million and did not resolve it; the year-end table may net items the additions do not."
  - "The 2023-2026 Operating Budget prints no Snow and Ice Control program summary of the kind the 2019-2022 budget prints, so the 2023 figure rests on the City's undated fact sheet, the December 2022 amendment, and press reports of the $56.9 million base that the panel used to reconcile them, rather than on a budget-book cell."
  - "Snow and Ice Control actuals exist on two City bases that differ by $3 million to $10 million a year: the year-end operating updates used here, and the March 2026 program summary by account category (YF-EV-0136), which gives $51.750 million, $64.749 million and $66.588 million for 2023 to 2025. The actuals are context in any case, since the claim compares budgets."
unknowns:
  - "Why the City's year-end adjusted 2022 budget for the program differs from the adopted cell plus the three in-year additions."
  - "What the campaign page's author had in mind as the snow-clearing budget; the page gives no figure and no source."
missing_evidence:
  - "A City table of the Snow and Ice Control program's approved gross budget for each year 2022 to 2026, before and after in-year amendments, on one basis. The City has published a 2022-2026 budget overview in chart form (YF-EV-0139, June 2023), from which no figure can be read to the precision the ratio needs (City of Edmonton Financial and Corporate Services; moderate)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Fable 5.1
      verdict: Partially supported
      confidence: High
      key_findings:
        - "On the printed 2022 cell the ratio is 1.551; the failing part is the word double, the figure is about half again."
        - "Alternative A, the cell plus every 2022 council addition in force on 2022-12-12, is $85.766 million and 1.166, Contradicted; the City's own year-end adjusted budget of $79.474 million gives 1.258, Contradicted under the primary cutoffs and Partially supported under the alternative ones."
      changed_between_rounds: "No change. In round 2 documented that the other two seats had counted only the July 2022 addition and missed the March carry-forward and the April spring adjustment, and that the City reports snow actuals on two different bases."
    - model: GPT-5.6 Sol
      verdict: Partially supported
      confidence: High
      key_findings:
        - "The printed cell gives 1.551, Partially supported under both cutoff sets; the amount is substantially larger than a year of snow clearing, but almost double fails."
        - "Against the amended 2022 budget the classification is Contradicted, so the finding is definition-sensitive and neither side can cite it without that qualification."
      changed_between_rounds: "No change in verdict or confidence. Adopted the full 2022 amendment list surfaced in cross-review ($2.3 million, $14.3 million, $4.7 million) and recomputed Alternative A at 1.166."
    - model: Gemini 3.1 Pro
      verdict: Partially supported
      confidence: High
      key_findings:
        - "In round 1: the word double is an overstatement under every reading, 1.55 on the printed cell, 1.45 with the July addition, 1.64 on the 2023 figure; recomputed in round 2 to 1.17 and 1.57 after the additions it had missed."
      changed_between_rounds: "No change. Acknowledged in round 2 the March and April 2022 additions it had missed and the spring 2025 transfer out of CM-20-0330."
