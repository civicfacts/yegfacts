key_facts:
  - text: "The threshold is Statistics Canada's, quoted rather than paraphrased. Its shelter-cost-to-income classification, in force on the freeze date, splits households into those spending less than 30 percent of total income on shelter costs and those spending 30 percent or more. Neither the definition nor the classification carries any Edmonton figure."
    sources: [YF-EV-0106, YF-EV-0110]
  - text: "The financing inputs the brief fixes are published. The Bank of Canada's posted five-year conventional mortgage rate is available as a full observation history, the City publishes its municipal and education mill rates by year and assessment class, and Statistics Canada's household spending table gives the water, fuel and electricity category for the principal accommodation, with 2023 as the latest reference year released before the freeze date. The mortgage figure is a posted chartered-bank rate, not a contract rate any buyer transacted at, and the utility figure is a provincial average, not any dwelling's bill."
    sources: [YF-EV-0092, YF-EV-0046, YF-EV-0097, YF-EV-0107]
  - text: "One of those inputs needs a rule the brief does not supply. The Bank of Canada discontinued its monthly chartered-bank interest-rate publication on 2019-10-01, keeping the weekly posted series, so the price-month rate the brief calls for is not published as a monthly series for any purchase after September 2019 and has to be derived."
    sources: [YF-EV-0091]
  - text: "The income figure the whole test turns on is carried by the run's fetch report and by YF-EV-0049, which independently reports the same figure. The panel declared the 2021 Census median total before-tax household income for the City of Edmonton, $90,000, which puts the 30 percent line at $2,250 a month. The fetch report records both cited Census Profile pages returning a File not found body under an HTTP 200 when the run archived them, so the figure was not ingested from those pages. Nor was it the only input the run could not get: no first arm's-length sale price and no condominium fee was publicly available for any dwelling in the cohort. What the registry does carry is the City's own affordability analysis, built on a median-income Edmonton household under the City's own method, and a later Statistics Canada estimate for the Edmonton area on a different unit, economic families rather than households. The run used that estimate only as a labelled sensitivity, and the finding that it would not change which dwelling types pass is the run's own arithmetic."
    sources: [YF-EV-0059, YF-EV-0049]
  - text: "The run lacked sale prices to run the test on and used, or could have used, the assessed-value fallback the brief allows for a first full assessment roll. The City's assessment data publish assessed values only, with no sale prices, no shelter costs and no tenure; the City calls an assessed value a mass-appraisal estimate rather than a transaction price; and arm's-length transfer prices are held by Alberta's land-title registry, released parcel by parcel for a fee rather than as an open dataset."
    sources: [YF-EV-0040, YF-EV-0047, YF-EV-0036]
  - text: "The City has run its own affordability analysis, on its own method, and it is not this one. Its 2024 market housing affordability report found that a median-income Edmonton household could afford benchmark row and apartment product and could not afford benchmark single-detached product. It uses benchmark prices, income bands and a mortgage-qualification method rather than the frozen shelter-cost model, and it says nothing about replacement dwellings on teardown lots."
    sources: [YF-EV-0049]
  - text: "The comparators that exist answer a different question. CMHC's absorbed-price distribution for newly built dwellings in Edmonton is a directional new-construction comparator whose captured table covers single- and semi-detached units only, so it says nothing about new row or apartment prices, and it does not isolate teardown replacements or separately titled dwellings and is not lot-matched. The REALTORS Association's July 2026 city-wide averages put detached at $585,726, semi-detached at $425,329, row and townhouse at $292,756 and apartment condominium at $214,521, which shows cheaper ownership product exists in the resale market and is not a matched teardown-replacement figure."
    sources: [YF-EV-0105, YF-EV-0104]
  - text: "Renting the replacement housing is not tested, and the reason is a gap in the record rather than a result. CMHC's Rental Market Survey reports rents that carry no heat-included status and covers structures of three or more units, which is the scope the source establishes. The run found no open cohort-level source of contract rents, so no utilities-inclusive shelter cost can be built for the units held on a single title."
    sources: [YF-EV-0039]
  - text: "The City's own affordable-housing definitions are deliberately not applied here. The guidebook gives two alternative definitions: rental or ownership housing that gets government financial help, upfront or ongoing, keeping costs below market price for households earning less than the median income for their household size; or, separately, a property rented under a government agreement aimed at reducing poverty, with rent capped at no more than 80 percent of market rate or 30 percent of the resident's pre-tax income. The guidebook excludes market home ownership from both, so market replacement dwellings fall outside them by construction."
    sources: [YF-EV-0050]
  - text: "Two of the brief's named sensitivities rest on regulation rather than choice. A 30-year amortization has been available since 2024-12-15 for newly built dwellings and first-time buyers, but only on insured borrowing; above 20 percent down it is lender policy, not regulation. Where the minimum down payment is modelled instead, CMHC's published premium schedule by loan-to-value band is what gets added to the financed amount."
    sources: [YF-EV-0054, YF-EV-0093]
