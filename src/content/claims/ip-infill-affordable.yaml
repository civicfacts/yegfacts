limitations:
  - "Not established here is a statement about the record, not a verdict that the replacement housing is affordable. Two of the three seats found the record silent; the third ran a model that put 88.4 percent of separately titled replacements over the threshold. The disagreement is shown rather than averaged."
  - "The test the brief fixes is a model of purchase affordability for a hypothetical household at the declared median income. It is not the cost borne by any dwelling's occupant, and no result under it says what any household paid."
  - "Tenure is not used anywhere in the test, because no published source establishes tenure at the dwelling level for the declared cohort. A separately titled replacement is tested on the purchase model whether it is owner occupied, rented or unlet."
  - "The one seat that produced a number priced every dwelling at its assessed value, because no first arm's-length sale price is public for any of them. Another seat documented that a lack of public access does not establish that no such sale existed, and assessed values can differ from sale prices in either direction."
  - "That model also inherits the first claim's nonconforming frame: assessment-detected candidate lots rather than the brief's permit frame, and title form inferred from permit unit counts rather than read from the title record."
  - "One seat documented an arithmetic description error in that model: 2,968 of 3,584 is called the lower bound with unclassified dwellings treated as meeting the threshold, but the numerator excludes all 225 unclassified dwellings. The arithmetic is the lower bound; the description of it is reversed."
  - "About half the replacement dwelling units in the matched set, 3,244 of 6,603 in the reconstruction, are classed as sitting inside single-title multi-unit buildings and so fall outside the verdict denominator by the brief's own rule. That split is the seat's inference of title form from permit unit counts, not a classification anything in the record publishes, and the counts it produces are nonconforming: the same reconstruction reports 2,995.6 fractional unclassified units. It is a limitation of the record, not a finding about those units."
  - "The utility allowance is a fixed provincial average applied identically to every dwelling. Removing it drops the failing share in that model from 88.4 to 80.9 percent without changing its verdict."
  - "Condominium fees are not included for any dwelling, because none is published in the assessment record, and no bedroom breakdown is possible, because neither the assessment record nor the permits give bedroom counts."
  - "CMHC has published a methodological critique of the fixed 30 percent ratio, arguing it measures a threshold rather than a household's actual capacity. The brief still uses the Statistics Canada classification, and the critique establishes nothing about Edmonton dwellings or prices."
  - "The price relationship on redeveloped lots is a separate proposition with its own finding. A replacement dwelling can exceed an affordability threshold while costing less than the dwelling it replaced, and the reverse."
missing_evidence:
  - "First arm's-length sale prices and dates for every separately titled replacement dwelling, linked to completion and title history. This is the brief's primary price basis and it covered zero cases (Alberta Land Titles at Service Alberta, and MLS records held by the REALTORS Association of Edmonton; critical)."
  - "Title form and a verified dwelling count for every replacement building, which is what separates the verdict denominator from the excluded single-title units (Alberta Land Titles and City of Edmonton Development Services; critical)."
  - "A retrievable source for the declared City median household income. The two Census Profile URLs cited for it returned a File not found page, so the run's primary income input is not in the registry (Statistics Canada; critical)."
  - "A predeclared method for deriving price-month five-year conventional mortgage rates after the Bank of Canada ended the monthly series in 2019 (YEGFacts editors, using the Bank of Canada weekly series; critical)."
  - "Property-level condominium fees for every condominium-titled replacement (condominium corporations and listing records; high)."
  - "Contract rents and their utility terms for replacement units held in single-title buildings, without which rental affordability cannot be tested at all (landlords; CMHC does not collect utility inclusion; moderate)."
  - "Bedroom counts per replacement dwelling, for the bedroom breakdown the brief requires (City of Edmonton Assessment and Taxation, and builders' listings; moderate)."
  - "Same-neighbourhood median sale prices by year, for the neighbourhood comparator the brief names (REALTORS Association of Edmonton; moderate)."
review:
  agreement: Split
  reviewers:
    - model: Claude Fable 5.1
      verdict: Supported
      confidence: High
      key_findings:
        - "Priced at assessed value on the first verified full roll, 2,968 of 3,359 separately titled replacement dwellings, 88.4 percent, would need 30 percent or more of the modelled household's income, with predeclared bounds of 82.8 to 89.1 percent, so the lower bound clears the threshold by a wide margin."
        - "The median modelled price is $638,000 and the median modelled shelter cost $3,948 a month against a $2,250 limit. The component medians, $3,070 principal and interest, $494 property tax and a $377.67 utility allowance, are separate distributions and do not add to it: they sum to $3,941.67."
        - "3,244 dwelling units in single-title buildings, 49.1 percent of the classified replacement units, sit outside the verdict denominator, and their rental affordability cannot be tested because no contract rents are published and CMHC average rents make no adjustment for utilities."
      changed_between_rounds: "Held Supported and answered the mortgage-rate objection, showing that its last-weekly-observation rule reproduces the definition of the monthly Bank of Canada series that was discontinued in 2019."
    - model: GPT-5.6 Sol
      verdict: Not established
      confidence: High
      key_findings:
        - "No public source identifies the complete set of separately titled replacement dwellings linked to eligible demolitions, and City assessment data do not identify title form, so the verdict denominator cannot be separated from the excluded single-title units."
        - "New-home price evidence is directionally consistent with a purchase-affordability problem for a $90,000 household, and the City's own affordability report puts that income below what it estimates is needed for benchmark detached and semi-detached product, but neither isolates teardown-linked replacements."
        - "The model cannot describe what any occupant paid: tenure, actual purchaser income, actual utilities and actual occupant shelter costs are all unavailable."
      changed_between_rounds: "Held Not established, calling the model strong directional evidence that still inherits a nonconforming frame and prices every dwelling at assessed value without establishing that no first arm's-length sale existed."
    - model: Gemini 3.1 Pro
      verdict: Not established
      confidence: High
      key_findings:
        - "The denominator of separately titled replacement dwellings cannot be identified without the matched dataset the price-gap claim also lacks."
        - "Its round-one position was that without the purchase price of each replacement dwelling the shelter-cost test has nothing to run on. The frozen brief expressly directs the total assessed value on the first full roll where no sale is recorded, and another seat ran it, so this is recorded as a reviewer error rather than a finding about the record."
      changed_between_rounds: "Moved from Not established to Supported in round two, accepting that another seat's use of assessed value as the price basis, which the brief directs where no sale is recorded, produced an 82.8 percent lower bound clearing the 50 percent threshold. The canonical finding is computed from round one, so the movement does not change it."
