id: ip-infill-affordable
question: Would the housing built on Edmonton teardown lots cost a median-income household 30 percent or more of its income to buy?
story: infill-prices
finding: Not established
evidence_basis: Direct Edmonton evidence
panel_agreement: Split
methodology_version: "1.9"
