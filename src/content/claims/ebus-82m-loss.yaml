id: ebus-82m-loss
question: Did Edmonton lose $82 million on its electric buses?
story: electric-buses
finding: Not established
evidence_basis: Direct Edmonton evidence
confidence: High
methodology_version: "1.0"
review_run: reviews/electric-buses/2026-08-31
topics: [transportation, city-finances]
evidence: [YF-EV-0001, YF-EV-0002, YF-EV-0003, YF-EV-0005, YF-EV-0010, YF-EV-0011]
key_facts:
  - text: "The $82 million figure is a proof of claim the City filed on February 2, 2024 in Proterra's Chapter 11 bankruptcy, seeking damages for breach of contract and negligence. A damages claim is not an audited loss."
    sources: [YF-EV-0003, YF-EV-0002]
  - text: "The City's October 2023 court filing says it paid US$58,761,600 under the 60-bus contract, and itemized C$1,352,655.58 in repair labour, parts, battery blankets and an outstanding receivable at that time."
    sources: [YF-EV-0001]
  - text: "A May 2026 claims-register entry lists Edmonton's claim as general unsecured, with no allowed or paid amount shown — how much Edmonton will ever recover is not public."
    sources: [YF-EV-0002]
  - text: "Governments announced more than C$43 million in joint funding for the original project: more than C$21.5M federal, about C$10.8M provincial and more than C$10.8M municipal — the payer mix matters to any 'Edmonton lost' framing."
    sources: [YF-EV-0010]
  - text: "The buses entered service in 2020, were reported still in daily service in early 2024, and the City still lists all 60 in the ETS fleet — service was delivered and residual value exists, neither of which the loss framing counts."
    sources: [YF-EV-0005, YF-EV-0004, YF-EV-0003]
aliases:
  - 82-million-ebus-loss
  - edmonton-lost-82-million
limitations:
  - "'Not established' does not mean the loss is zero — real, non-trivial public costs are documented; it means no public record establishes a net loss of approximately $82 million."
unknowns:
  - "Edmonton's actual recovery, if any, from the Proterra bankruptcy estate."
  - "Lifecycle cost of the Proterra fleet vs a diesel counterfactual (maintenance, energy, availability, early replacement)."
missing_evidence:
  - "Bankruptcy distribution records for claim 1281 (holder: City of Edmonton / claims agent)."
  - "ETS lifecycle cost data sufficient to compute net public cost (holder: Edmonton Transit Service)."
review:
  agreement: Unanimous
  reviewers:
    - model: claude-fable-5
      verdict: Not established
      confidence: High
      key_findings:
        - "The $82M is a legal damages claim including negligence; treating it as cash lost conflates a litigation position with an accounting result."
    - model: gpt-5 (gpt-5.6-sol)
      verdict: Not established
      confidence: High
      key_findings:
        - "Purchase price was US$58.76M — the $82M headline exceeds even the gross purchase price in USD terms; the loss framing counts no recoveries, grants, service delivered or residual value."
    - model: Gemini 3.1 Pro
      verdict: Not established
      confidence: High
      key_findings:
        - "As an unsecured creditor Edmonton was expected to recover little, but the final net loss cannot be computed from public records."
