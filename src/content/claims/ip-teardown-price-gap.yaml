limitations:
  - "Not established is not a finding that replacement housing costs the same or less. It means the public record does not carry the matched, unit-level comparison the proposition is stated in, so no share can be verified either way."
  - "The one reconstruction the panel produced departs from the brief's frame and says so. It detects teardowns from the assessment rolls rather than from demolition permits, because the open permit record loses most house demolitions after 2018, and it substitutes the last standing roll year for the demolition permit year. Another seat documented that this changes the population and the cohort rather than filling in missing fields."
  - "That reconstruction's shares cannot be checked from the cited sources. The archived bytes are open data portal pages, not the roll records, and no code, row-level output or working file was published with the run."
  - "It also reports 2,995.6 unclassified replacement dwelling units and a denominator of 9,598.6. A self-contained dwelling unit is counted once and cannot be fractional, so another seat documented that the reported bounds do not conform to the brief."
  - "Title form and the distribution of dwellings across titles were inferred from permit units-added counts set against assessment title counts. The assessment record identifies neither, and where several titles share a lot the rule does not say which dwellings belong to which title."
  - "The brief's own valuation rule treats a house with a basement suite as a two-unit single-title building and halves its value. Under a reading where only row-house and apartment permits divide a title, the same reconstruction gives 71.7 percent rather than 62.0 percent. Both readings point the same way, which is why the seat reported the ambiguity instead of halting."
  - "This claim previously carried 286 built, 387 demolished and a net loss of 101 for the 2024 Redeveloping Area Infill Report. Those figures were a transcription error in the evidence registry, caught in cross-review: one seat extracted the archived report, searched for all three and found none of them, reading a net loss of 294 single detached houses instead. The registry entry and this claim were corrected at drafting, and the run's errata.md records the correction."
  - "The mature-neighbourhood subset in the reconstruction uses the City's neighbourhood-level layer as a proxy and never applies the bylaw's parcel-by-parcel RF1 to RF5 site-zoning condition, so it is not the frozen historical boundary the brief fixed."
  - "The run found no open cohort-level source for sale prices, asking prices, contract rents, tenure, bedroom counts or fire-order and safety-order flags on these lots. Arm's-length sale records do exist parcel by parcel in Alberta's land-title registry for a fee; what the run could not find is an open series covering the cohort. Every measure the brief asks for on those grounds is recorded as missing rather than proxied."
  - "The alleged $350,000 to $1,000,000 example has no captured source, address or property. It received no verdict and nothing in this claim verifies it."
unknowns:
  - "Whether more than half of replacement dwelling units on Edmonton teardown lots exceed the demolished dwelling's inflation-adjusted assessed value. This is the proposition, and it stays open."
  - "How many of the 2016 to 2025 residential demolition permits involved exactly one existing dwelling, and how many can be matched reliably to a completed replacement and the correct pre-demolition assessment."
  - "The number of self-contained dwellings on each replacement title, and which of them are separately titled."
  - "Whether the 2024 and 2025 completions that could not be verified as complete will follow the 2022 and 2023 pattern, in which per-unit values mostly fell below the demolished house, or reverse it."
  - "How many teardown lots a point-proximity match misses, and whether the missed lots differ from the matched ones. No miss analysis was run, so that larger consolidated sites are the likelier misses is an untested hypothesis."
  - "Whether the demolished dwellings were owner occupied or rented, what rent they carried, and whether any tenants were displaced."
missing_evidence:
  - "The matched teardown-to-replacement dataset the proposition is stated in. It does not exist as a published series anywhere in the public record: no City report, no open dataset and no third-party study links a demolished dwelling's assessed value to the value of each dwelling built on the same lot (City of Edmonton; critical)."
  - "A complete residential demolition permit list for 2019 to 2025 with parcel identifiers. The open datasets capture only a fraction after 2018 (City of Edmonton Development Services and the Safety Codes permit system; critical)."
  - "A verified parcel crosswalk carrying every eligible demolition through address changes, subdivisions and consolidations to the replacement parcels, titles and assessment accounts (City of Edmonton Assessment and Taxation with Alberta Land Titles or AltaLIS; critical)."
  - "Completion and occupancy dates before 2022, sufficient to identify each replacement's first full assessment roll without an outcome-dependent heuristic (City of Edmonton permit and inspection systems; critical)."
  - "Verified dwelling counts and title structure for every replacement building, including secondary suites, from the assessment side rather than from permit units-added fields (Alberta Land Titles with City of Edmonton Assessment and Taxation; high)."
  - "Arm's-length sale prices and dates for the demolished dwellings and for the replacements, which the brief needs for its sale-to-sale sensitivity (Alberta Land Titles at Service Alberta, and REALTORS Association of Edmonton MLS records; high)."
  - "Land and improvement components of assessed value for the demolished dwellings (City of Edmonton Assessment and Taxation; moderate)."
  - "Fire-order and safety-order status, prior tenure, prior rent and recorded tenant displacement for the demolished dwellings. No public holder compiles these (City of Edmonton Fire Rescue Services and Development Services, property owners and tenants; moderate)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Fable 5.1
      verdict: Not established
      confidence: Moderate
      key_findings:
        - "No published study matching the proposition exists, so the matched set had to be built from the City's open data, and the closest published lot-level work measures lot totals on a different cohort. House demolition records in the general building permit dataset fall from 370 in 2018 to under 30 a year from 2019, so the brief's permit frame cannot supply the ten-year cohort, and the frame departure is reported rather than hidden."
        - "On the rebuilt set, 4,091 of 6,603 classified replacement dwelling units, 62.0 percent, were assessed higher than the house they replaced in constant July 2025 dollars, at a median ratio of 1.222. Undivided title totals point the other way at 93.2 percent, and lot totals at 99.6 percent: essentially every eight-unit row house is worth more than the house it replaced as a building and less per dwelling."
        - "About 3,000 recent units could not be verified as complete, so the predeclared bounds run 42.6 to 73.8 percent. Neither Supported nor Contradicted is reached, and the share falls from 86 percent for 2016 teardowns to 37 percent for 2023 as row housing replaces skinny homes."
      changed_between_rounds: "Held Not established and raised its own confidence from Moderate to High, saying the cross-review changed nothing: the bounds still straddle the majority threshold."
    - model: GPT-5.6 Sol
      verdict: Not established
      confidence: High
      key_findings:
        - "No source reports the city-wide unit-level numerator, denominator, bounds, median ratio, quartiles or range the brief predeclares, and none reports the same result on the frozen 2023-12-31 mature-neighbourhood boundary or the redeveloping-area sensitivity."
        - "Aggregate title and lot values do not test the proposition, and the closest published Edmonton analysis uses lot totals, a different cohort and different matching rules, so its result cannot be converted into the required unit-level share."
        - "The circulating $350,000 to $1,000,000 example has no address or source, was not treated as a threshold, and remains unverified."
      changed_between_rounds: "Held Not established, documenting that the reconstruction replaces the brief's permit frame with assessment-detected candidates, infers title structure, uses an outcome-dependent completion heuristic and produces fractional dwelling counts, so its 62.0 percent cannot carry the verdict."
    - model: Gemini 3.1 Pro
      verdict: Not established
      confidence: High
      key_findings:
        - "The City publishes property assessments and permit data separately. The matched dataset of teardown-and-replacement assessment values does not exist as a pre-compiled public report."
        - "Answering the claim requires a custom join across the ten-year cohort, and without it the share of replacement dwelling units assessed higher, and the median ratio, are both unknown."
      changed_between_rounds: "Adopted the assessment-roll reconstruction it had not attempted in round one and kept Not established, on the ground that the unverified 2024 and 2025 completions drop the lower bound to 42.6 percent."
