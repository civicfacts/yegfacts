key_facts:
  - text: "The City's own 2024 Redeveloping Area Infill Report reports a net loss of 294 single detached houses in the redeveloping area and concludes that other built forms are replacing the detached houses that come down. It carries no matched price or assessed-value comparison between a demolished dwelling and its replacement."
    sources: [YF-EV-0101]
  - text: "The same series for 2023 publishes aggregate demolition counts by dwelling type, on the order of 390 houses that year. Aggregate counts are all it carries: no permit-level cohort, no property identifiers, and no values or prices for those properties."
    sources: [YF-EV-0048]
  - text: "The record of house demolitions largely drops out of the City's open general building permit stream after 2018, so the brief's predeclared frame, all residential demolition permits from 2016 to 2025, cannot be reconstructed from it for most of that window. The development permit stream, published from 2019 onward, captures only part of the same frame."
    sources: [YF-EV-0094, YF-EV-0042]
  - text: "The historical assessment roll publishes account, assessment year, address, legal description, coordinates, year built, lot size and total assessed value. It carries no land and improvement components, no count of dwellings within a title and no separately titled flag, which are three of the fields the brief's valuation rules turn on."
    sources: [YF-EV-0099, YF-EV-0041]
  - text: "The two sides of the comparison are not interchangeable and neither is published in the form the claim needs. The City states that an assessed value is a mass-appraisal estimate of market value at a legislated valuation date, July 1 of the previous year adjusted for condition to December 31, rather than a transaction price. Arm's-length sale prices exist in Alberta's land-title registry, obtainable parcel by parcel for a fee, and are not published as a bulk or open dataset."
    sources: [YF-EV-0047, YF-EV-0090, YF-EV-0036]
  - text: "As of August 2026 the City was being asked to analyse how infill affects property values. What the source establishes is the request. That no matched teardown-to-replacement comparison is published is a search conclusion rather than something the source carries: the run found no published matched comparison by its freeze date of 2026-09-01."
    sources: [YF-EV-0053]
  - text: "The closest published lot-level work is an independent 2026 analysis matching Edmonton building permits to assessment accounts: 1,242 distinct lots, 95 percent matched to both a 2024 baseline and a 2026 completed assessed value, a median gross assessed-value uplift of roughly $1.7 million per lot across 67 rowhouse lots, against a control-group median appreciation of 1.19 times. It is lot totals on one cohort, not per-dwelling values, and it is a personal analytical post rather than peer-reviewed or City work."
    sources: [YF-EV-0055]
  - text: "The product mix moved under the new zoning bylaw. Administration's one-year review of Zoning Bylaw 20001 reports 16,511 dwelling units approved city-wide in 2024, a 30 percent increase, 40 percent of them in the redeveloping area, with a large share of the multi-dwelling permits being eight-unit row housing in the RS zone. Those are city-wide approvals, not matched teardown replacements, and the report carries no prices or assessed values. That a per-lot answer and a per-dwelling answer can diverge on the same lot is reported by one seat's reconstructed matched set, not by this report."
    sources: [YF-EV-0103]
  - text: "With no published series to read, one seat built the matched set itself from the assessment rolls and reports 62.0 percent of 6,603 classified replacement dwelling units assessed higher than the dwelling they replaced, at a median ratio of 1.222 in constant July 2025 dollars. Which dwellings count as classified, and how they sit across titles, is that seat's own inference from permit counts rather than a published classification. Roughly 3,000 recent units had no verified completion, putting the seat's bounds at 42.6 and 73.8 percent, which straddles the 50 percent threshold; those bounds rest on 2,995.6 fractional dwelling units and so do not conform to the brief. The archived bytes behind those rolls are the open data portal pages and carry none of the computed shares."
    sources: [YF-EV-0099, YF-EV-0098]
  - text: "The mature-neighbourhood subset the brief asks for has no boundary in force. Zoning Bylaw 12800, whose section 814.2 applied the Mature Neighbourhood Overlay to sites zoned RF1 through RF5 within a mapped appendix, was repealed on 2024-01-01 and replaced by Zoning Bylaw 20001. The City's open Mature Neighbourhoods layer lists the 111 neighbourhoods the Overlay formally defined, but it is a neighbourhood list rather than the parcel-level zoning condition."
    sources: [YF-EV-0102, YF-EV-0100, YF-EV-0096]
  - text: "The deflators the brief predeclares are published: the Edmonton all-items Consumer Price Index by month, used to put both sides of each pair in constant July 2025 dollars, and the New Housing Price Index for Edmonton, used only as the labelled market-index sensitivity. Neither supplies a property-level value to adjust."
    sources: [YF-EV-0108, YF-EV-0109]
