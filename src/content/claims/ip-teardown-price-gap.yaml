id: ip-teardown-price-gap
question: On Edmonton lots where an old house was demolished for infill, is the housing built in its place worth more than the house that came down?
story: infill-prices
finding: Not established
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.9"
review_run: reviews/infill-prices/2026-09-01-rerun2
