key_facts:
  - text: "The City's 2024 Redeveloping Area Infill Report sets a net loss of 294 single detached houses in the redeveloping area against 3,535 net new dwelling units there, including 221 net new semi-detached units, with apartments, secondary suites, backyard houses and row housing carrying most of the gain. No property in it is identified and no dollar figure is attached to any of them."
    sources: [YF-EV-0101]
  - text: "The same series a year earlier, reporting on 2023 and published in 2024, counts what came down by dwelling type: 387 single detached houses, 3 semi-detached units, 3 row housing units and 131 apartment dwellings, against 2,931 net new units. Counts by type are the whole of it. No parcel is named, no property is followed and no value appears on either side."
    sources: [YF-EV-0048]
  - text: "The historical assessment roll runs from the 2012 roll to the 2025 roll and publishes an account number, an assessment year, an address, a legal description, the year built and one total assessed value. It marks no demolition, names no replacement, splits no value into land and improvement, counts no dwellings inside a title and flags none of them as separately titled. Three of those absent fields are the ones this claim's valuation rules turn on."
    sources: [YF-EV-0041]
  - text: "The open general building permit dataset carries an issue date, a job description, a work type, an address, a legal description and a units-added count, and no parcel or title identifier; its permit-number column is blanked. One seat found that the dataset's coding of demolitions changed in 2019 and built its candidate frame out of the job description text instead, returning 5,672 records coded as single detached house demolitions for 2016 to 2025, 5,668 of them with a legal description. A second seat documented that these are candidate records rather than the brief's validated frame: the filter admits garage-only descriptions and was never shown to capture every eligible residential teardown. The dataset page records that residential occupancy dates begin with permits finalized on or after 1 January 2022, and the seat that built the frame re-queried the endpoint and returned 3,167 populated occupancy rows for permits issued in 2021 and 247 for 2020."
    sources: [YF-EV-0044]
  - text: "Both sides of the ratio are assessed values, read off two different rolls, and neither of them is a price. The City assesses annually by mass appraisal and calls the result an estimate of market value on July 1 of the preceding year, adjusted for the property's condition to December 31, which is a valuation and not a price anyone paid."
    sources: [YF-EV-0047, YF-EV-0111]
  - text: "A transaction price enters only through the predeclared sale-to-sale sensitivity, and there is no open bulk title dataset to build that from. Alberta answers a request for a title, a registered document or a plan as a single order against one property, through SPIN2, ARLO or a registry agent, and publishes no bulk or open dataset of titles. That page carries no transfer price and establishes none."
    sources: [YF-EV-0036]
  - text: "One seat matched what it could and reports the results as cases. Working 40 January 2019 house demolition permits as a feasibility probe, it found 35 of the 40 demolished houses on the 2018 roll by exact legal description but only 17 of the 40 lots on the 2025 roll, and an address lookup returned three of the missing lots as two separately titled dwellings each under new plan numbers. Eight lots and eleven replacement dwellings came through with approximate constant-dollar ratios spanning about 1.37 to 3.94: five lots where one house replaced one house ran about 1.71 to 3.94, and dwellings on subdivided lots about 1.37 to 1.89 apiece. Those are that seat's own cases. They are one month of permits, they take the replacement value off the 2025 roll rather than each replacement's first full roll after completion, and they yield neither a median nor a share."
    sources: [YF-EV-0041, YF-EV-0044]
  - text: "The closest published lot-level work is an independent August 2026 analysis joining 2024 to 2026 small-scale-residential-zone building permits to the 2024 and 2026 assessment rolls by legal description, 25 metre proximity and address: 1,492 permits consolidated to 1,242 lots, of which 1,182 carried both values. What it measures, on the completed 2024 cohort, is net assessed-value uplift, a median near $0.2 million per home added on rowhomes of five units or more. One seat documented that uplift per home added is not a replacement dwelling's value divided by the demolished house's, and cannot be turned into one without the baseline and denominator this claim needs."
    sources: [YF-EV-0055]
  - text: "A market study the City commissioned in 2019 reports that low-density infill developers hunt for properties priced below their neighbourhood and work the distance between what they pay and what the neighbourhood's top quartile sells for. One seat documented that this establishes a motive and a direction, and neither the size of the typical gap nor how widely a large gap is shared."
    sources: [YF-EV-0112]
  - text: "The mature-neighbourhood subset was never drawn. The archived consolidation of section 814 of Zoning Bylaw 12800 carries the Overlay's purpose and the RF1 to RF5 site-zoning condition it applied under, and one seat documented that the page does not by itself verify the appendix boundary as it stood on 2023-12-31, which is the frozen boundary this claim's subset was defined on."
    sources: [YF-EV-0113]
  - text: "The deflator is published and holds no property value. Statistics Canada's monthly Consumer Price Index table offers census-metropolitan-area geography, and the Edmonton July figures read off it are what put both sides of a pair into constant July 2025 dollars."
    sources: [YF-EV-0108]
aliases:
  - million-dollar-infill
  - teardown-price-gap
limitations:
  - "Not established here means no conforming population series was produced in this run or located in a published source, not that the arithmetic would come out small. Nothing published or produced here carries a matched, unit-level ratio series on the brief's rules, so neither the size of the typical gap nor the share of replacements sharing it can be read either way."
  - "This claim replaces an earlier version that asked whether more than half of matched replacement dwelling units carried a higher constant-dollar assessed value than the house that came down, with bounds on the unclassified cases and with the median and the distribution reported alongside. That version returned Not established. The editor judged afterwards that a direction-only test does not carry the magnitude the circulating quotation asserts, so a verdict on it told a reader almost nothing about the claim in circulation. It was re-briefed on the magnitude proposition and re-run; the story changelog records the change."
  - "The test was fixed in the brief before any result existed. For the claim to hold, the midpoint of the ratio spread had to reach 2.5, and better than half of matched replacement dwelling units had to reach 2.0; a weaker reading of each, 2.0 and 1.5, was declared alongside so the answer could also be given under the version most favourable to whoever holds the claim. A figure counts as met only where the lower bound meets it and failed only where the upper bound fails it. With no classified population to bound, both sat undetermined, and undetermined is what produces this finding."
  - "No series meeting the brief's dwelling-unit rules came out of this run. One seat ran a 40-permit feasibility probe instead of the ten-year frame and said so; the other two reported that no such series exists in print. An earlier run built a proxy that does not meet those rules, and it is not the series this proposition needs."
  - "The probe values replacements on the 2025 roll rather than on each replacement's first full roll after completion, so a dwelling finished in 2019 carries up to five years of market movement inside its ratio. One seat documented that departure. Its constant-dollar arithmetic removes general consumer-price inflation and nothing else."
  - "The demolition frame is candidate records rather than a validated one. It was built from permit job-description text because the dataset's category coding changed in 2019, it admits garage-only demolitions coded as houses, and it leaves out semi-detached and other dwelling demolitions that the frame requires."
  - "The seats disagreed about what the record cannot do, without disagreeing on the finding. One documented that the inputs are all published and the join is feasible, so the honest statement is that nobody has produced the calculation, not that it cannot be produced. Another had treated a missing pre-joined dataset as making the calculation impossible."
  - "One seat's round-one review cited nothing at all: both its evidence lists were empty and it recorded no URL, so none of its statements can be checked against archived bytes. Two other seats documented that."
  - "Eighteen of the 35 probe lots found on the 2018 roll failed an exact legal-description match on the 2025 roll, and three of those were recovered by address as subdivided pairs. One seat documented that this is a linkage risk only: it measures neither how often a legal-description-only join loses a subdivided replacement nor which way the population moves."
  - "Two developer-portal pages cited for the dataset field definitions returned the portal shell under an HTTP 200 and were byte-identical to each other, so the archived bytes cannot verify what either was cited for. Neither was ingested and neither is cited here."
  - "The alleged $350,000 to $1,000,000 example has no captured source, address or property. The two round numbers were fixed in advance as context rather than cutoffs; the example received no verdict and nothing here verifies it."
  - "The run found no cohort-level public source for sale prices, asking prices, contract rents, tenure, bedroom counts or fire-order and safety-order flags on these lots. Every measure standing on those is recorded as missing rather than proxied."
unknowns:
  - "The city-wide median ratio, and the share of matched replacement dwelling units at or above 2.0 and at or above 1.5, each with the bounds the unclassified-case rule requires. This is the proposition, and it stays open."
  - "Which of the 2016 to 2025 demolition permits actually constitute the frame, once garage-only records are struck out and semi-detached and other dwelling demolitions are added in."
  - "How many self-contained dwelling units sit on each replacement title, and which of them are separately titled."
  - "How often a legal-description join loses a subdivided replacement, and whether the lots it loses differ from the lots it keeps."
  - "The distribution by demolition year, and whether the move toward rowhomes of five units or more after Zoning Bylaw 20001 pulls the per-dwelling median down for the later cohorts."
  - "The result on the frozen 2023-12-31 mature-neighbourhood boundary, and on the City Plan redeveloping area."
  - "Whether the demolished houses were owner occupied or rented, at what rent, and whether any tenants were displaced."
missing_evidence:
  - "The matched series itself: each demolished house's assessed value on the roll in force the year before demolition, set against every replacement dwelling unit's assessed value on its first full roll after completion, with the dwelling-unit count on each title, across every house demolition permit from 2016 to 2025. By the freeze date, 2026-09-02, no City report, open dataset or third-party study had published one (City of Edmonton Assessment and Taxation with Urban Planning and Economy; critical)."
  - "A reproducible frame of every residential demolition permit for 2016 to 2025, carrying parcel identifiers, the prior dwelling count, fire and safety orders, and the unmatched cases, with garage-only records excluded (City of Edmonton Urban Planning and Economy and Development Services; critical)."
  - "Parcel and title lineage carrying each demolition through subdivision, consolidation and address change to every replacement title and assessment account (Alberta Land Titles and AltaLIS with the City of Edmonton; critical)."
  - "Completion and occupancy dates for permits before 2021, enough to pick each replacement's first full assessment roll without a heuristic that depends on the outcome (City of Edmonton permit and inspection systems; critical)."
  - "Verified self-contained dwelling counts and title structure for every replacement building, read from the assessment side rather than inferred from the permit units-added field, together with the land and improvement split of assessed value (City of Edmonton Assessment and Taxation with Alberta Land Titles; high)."
  - "Arm's-length sale prices and dates on both sides of each pair, which the predeclared sale-to-sale sensitivity needs (Alberta Land Titles at Service Alberta, and REALTORS Association of Edmonton MLS records; high)."
  - "The section 814 appendix boundary as it stood on 2023-12-31, as a parcel-level layer rather than a neighbourhood list (City of Edmonton; moderate)."
  - "Prior tenure, prior rent, tenant notices and any recorded displacement for the demolished houses. The run identified no complete public registry or source for these (property owners and tenants, City of Edmonton; moderate)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Fable 5.1
      verdict: Not established
      confidence: Moderate
      key_findings:
        - "Neither figure can be classified, because no series on the brief's rules was produced here or found published, and the predeclared mapping lands on Not established. The inputs sit in the open: about 5,672 candidate house demolition permits for 2016 to 2025 with legal descriptions, and assessment rolls keyed by legal description back to 2012."
        - "The permit dataset changed how it codes demolitions in 2019, so the frame has to be read out of the job description text rather than the job category, and some rows coded as a house describe a demolished garage."
        - "In a 40-permit probe, matching on legal description alone recovered the demolished house in 35 cases against the 2018 roll but reached the replacement lot in only 17 against the 2025 roll; an address lookup returned three of the missing ones as two separately titled dwellings under new plan numbers. The eight lots that came through give approximate constant-dollar ratios of about 1.37 to 3.94, which are cases and not a distribution."
      changed_between_rounds: "Held Not established and raised its own confidence from Moderate to High, holding it on a different ground than one other seat: the record can yield the series and nobody has built it, which is not the same as the record being unable to yield it."
    - model: GPT-5.6 Sol
      verdict: Not established
      confidence: Moderate
      key_findings:
        - "No source reports the city-wide dwelling-unit denominator, a conforming ratio for every classified replacement dwelling unit, or bounds taking in every unclassified one, so neither primary figure and neither declared alternative can be classified as met or failed."
        - "The published permit schema has no reliable completion dates before 2021 and does not say how many dwelling units a replacement title holds, and joins on address or legal description break where a demolition is followed by subdivision or retitling."
        - "The qualitative City evidence bears on development economics and housing costs rather than on the predeclared figures, and the $350,000 to $1,000,000 example arrived with no address and no source and was never treated as a cutoff."
      changed_between_rounds: "Stayed at Not established and moved its confidence up one step, Moderate to High, documenting that the probe is a convenience sample of one month valued on the wrong roll, that the permit filter is not a completed frame, and that net uplift per home added cannot be converted into the ratio."
    - model: Gemini 3.1 Pro
      verdict: Not established
      confidence: High
      key_findings:
        - "Historical property assessments sit in one City dataset and demolition and building permits in another, and no published dataset ties a demolished property's value to the values of the particular units raised in its place."
        - "Without that linkage run across the frame, and without the mandated constant-dollar adjustment, neither the typical size of the gap nor the share of replacements at double can be evaluated."
      changed_between_rounds: "Held Not established and lowered its own confidence from High to Moderate, accepting that the raw records do exist separately and taking up the probe's demonstration that a join without an address or spatial fallback drops subdivided lots."
