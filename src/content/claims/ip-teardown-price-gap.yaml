id: ip-teardown-price-gap
question: When an Edmonton house is torn down for infill, is what replaces it usually worth about three times as much?
story: infill-prices
finding: Not established
answer: >-
  Nobody can tell. The City's records do not follow a torn-down Edmonton house to whatever
  was built in its place, so they cannot show whether the replacement is usually worth
  about three times as much.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.10"
review_run: reviews/infill-prices/2026-09-02-magnitude
plain_speech_read: reviews/infill-prices/2026-09-02-magnitude/plain-speech/gpt-1.md
topics: [housing-development]
evidence:
  - YF-EV-0036
  - YF-EV-0041
  - YF-EV-0044
  - YF-EV-0047
  - YF-EV-0048
