register_claims: [speaking-time-cut-to-three-minutes]
wording_notes:
  - author_name: "Golden Pelican H."
    note: "The reason this comment gives, a high volume of complaints from all over the city, is not checked. The minutes record no reason for the motion."
limitations:
  - "The count depends on which list \"the queue\" means. Before the research, \"about seventy\" was set as 60 to 80, or 50 to 90 on a looser reading. The 64 approved to speak on the bike-lane item, and the 79 across the whole meeting, are inside both. The 52 recorded as speaking is below 60, so on that count and the stricter range the finding would be Partially supported."
  - "Every count is of entries on the committee's lists. Names of members of the public are withheld on our copies, so a person cannot be matched from one list to another. How many distinct people were approved, and how many of the 64 did not speak, cannot be worked out here."
  - "The motion set a maximum. The minutes do not record how long any speaker actually spoke."
  - "The committee is not City Council. A standing committee's members are councillors, and this motion changed the committee's own procedure for one meeting."
  - "No reviewer found a City record giving a reason for the motion. They searched the minutes and agenda items they were given and the web, as of October 2, 2026. The City's video of the meeting was not watched for this page, so a reason given aloud there is not checked. Why the motion was moved is not something this site tests."
  - "No reviewer could survey earlier Council and committee minutes for similar motions, because the City's meeting portal refuses their tools, and their web searches turned up none since October 2025. After the panel ran, this site read the City Council minutes of January 27 and February 17, 2026. At both meetings Council adjusted its own members' section 38 limits, and neither motion set a limit for public speakers. Other meetings were not searched, so whether cutting public speakers' time was unusual is left open."
  - "The reviewers got the minutes and agenda as a selection of items made under a published rule, because the City's meeting portal refuses their tools. The bylaw was supplied the same way after every reviewer's tool failed to read it in the two earlier rounds of this run. Every reviewer read the same supplied text, so none of them retrieved these documents on its own."
  - "The reviewers could not check the live minutes for a later correction. The copy they read, archived on September 25, 2026, shows none to the items relied on."
unknowns:
  - "Why the committee moved the time-limit motion."
  - "How many distinct people were approved to speak on the bike-lane item, and how many of them did not speak."
  - "Whether other Council or committee meetings since October 2025 cut speaking time the same way."
missing_evidence:
  - "Council and committee minutes since October 29, 2025, read in full for motions adjusting section 38 (City of Edmonton, Office of the City Clerk)."
  - "The minutes as approved at the committee's next meeting, to confirm no correction to items 1.4, 2.3 or 7.6 (City of Edmonton, Office of the City Clerk)."
