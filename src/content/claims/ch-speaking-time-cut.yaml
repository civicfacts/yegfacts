id: ch-speaking-time-cut
question: Did the committee cut bike-lane speakers from five minutes to three, with about 70 waiting to speak?
story: council-hearing
finding: Supported
answer: >-
  Yes. Edmonton's Infrastructure Committee cut each approved speaker's limit from five minutes to three, with 64 on its list to speak on the bike lanes, though the 52 recorded as speaking would fall short of about seventy.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.43"
review_run: reviews/council-hearing/2026-10-02
plain_speech_read: reviews/council-hearing/2026-10-02/plain-speech/gpt-1.md
topics: [transportation, bike-lanes, city-hall]
evidence: [YF-EV-0251, YF-EV-0209, YF-EV-0210, YF-EV-0316, YF-EV-0317]
key_facts:
  - text: "Section 38(1) of the City's Council Procedures Bylaw, Bylaw 18155, in the City's consolidation of October 29, 2025, says each approved speaker may speak for a maximum of 5 minutes. The note under section 38 shows it was last amended in July 2022."
    sources: [YF-EV-0251]
  - text: "Section 4 of the bylaw lets Council or a standing committee waive or change any part of it by special resolution, provided the change does not conflict with the Municipal Government Act or another enactment. Section 2 defines a special resolution as a vote in which at least two-thirds of all the committee's members vote in favour."
    sources: [YF-EV-0251]
  - text: "At its meeting of August 26, 2026, under item 1.4, the Infrastructure Committee carried a motion by Councillor M. Janz to adjust the section 38 time limits for that meeting so that \"each approved speaker may speak for a maximum of three minutes\", and each member of Council had three minutes to ask questions and three minutes to speak to or close debate on a motion."
    sources: [YF-EV-0209]
  - text: "The motion carried 6 to 0, with E. Rutherford, A. Salvador, R. Clarke, M. Janz, A. Knack and A. Paquette in favour, the six members the minutes list as present. Two-thirds of six is four, so the vote met the bylaw's special-resolution threshold, a calculation made here."
    sources: [YF-EV-0209, YF-EV-0251]
  - text: "The motion's words cover every approved speaker at the meeting, including those on all four items in the Requests to Speak motion, not only the bike-lane item. Under item 2.4 the committee took the bike-lane item first, so the shorter limit was in place before the first public speaker on it."
    sources: [YF-EV-0209]
  - text: "The committee's Requests to Speak motion lists 64 entries for the bike-lane item, item 7.6, in five panels of 15, 15, 15, 15 and 4. Fifteen of the entries give an organization's name."
    sources: [YF-EV-0209]
  - text: "Across all four items of the meeting the lists hold 79 entries, counting one additional speaker approved later on another item. Someone approved on two items would be counted twice."
    sources: [YF-EV-0209]
  - text: "The minutes record 52 entries for public speakers presenting on the bike-lane item, in four panels of 16, 16, 18 and 2. Twelve of those entries give an organization's name."
    sources: [YF-EV-0209]
  - text: "The minutes items the reviewers read state no reason for the time-limit motion, record no motion giving any speaker more time, and give no speaker's position. Five files from public speakers are listed under the bike-lane item in the minutes. The agenda as published lists ten files under the item, none of them from a public speaker."
    sources: [YF-EV-0209, YF-EV-0210]
  - text: "At City Council's meetings of January 27 and February 17, 2026, Council carried, 13 to 0 each time, a motion adjusting the section 38 limits for that meeting for members of Council only: three minutes to ask questions and to close, with three minutes to introduce an item in January and two in February. Neither motion set a limit for public speakers. This site read these minutes after the panel ran."
    sources: [YF-EV-0316, YF-EV-0317]
aliases:
