        - "The 2023 cut would have left $50 million. The 2024 cut would have left about $32.7 million."
      changed_between_rounds: "No change in verdict, confidence raised to High. In cross-review it agreed the 2024 text names no clear destination for the money."
    - model: GPT-6 Sol
