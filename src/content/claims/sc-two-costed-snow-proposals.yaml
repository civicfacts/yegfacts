id: sc-two-costed-snow-proposals
question: Had City administration already put two snow-clearing proposals that need more spending before council?
story: snow-clearing
finding: Supported
answer: >-
  Yes. Administration had put at least two costed snow proposals on published council and committee agendas by August 27, 2026, though none states the existing snow budget it would add to.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.43"
review_run: reviews/snow-clearing/2026-10-02
plain_speech_read: reviews/snow-clearing/2026-10-02/plain-speech/gpt-1.md
topics: [transportation, bike-lanes]
evidence: [YF-EV-0304, YF-EV-0303, YF-EV-0299, YF-EV-0300, YF-EV-0302, YF-EV-0298, YF-EV-0294, YF-EV-0295, YF-EV-0296, YF-EV-0287, YF-EV-0288, YF-EV-0293, YF-EV-0289, YF-EV-0290, YF-EV-0308]
key_facts:
  - text: "Attachment 2 to report FCS03158, the Fall 2025 operating budget adjustment, is listed under item 7.2 of City Council's agenda for November 24, 2025. It holds an unfunded service package, Improved Accessibility - Active Pathway Snow Removal and Sidewalk Repair, which administration says it is \"putting forward ... for Council's consideration\". Its description says the package \"involves a $2.11 million one-time capital investment, an annual ongoing operating increase of $1.60 million to prioritize SNIC efforts in socially vulnerable areas, an annual increase of $1.64 million to enforcement services, as well as $4.59 million for proactive Sidewalk Maintenance repairs\". SNIC is the City's abbreviation for snow and ice control. The package's 2026 table shows $9,938,000 and 35.2 positions."
    sources: [YF-EV-0304, YF-EV-0299]
  - text: "The three operating components add to $7.83 million, which the package's description also states, while its table gives $9.938 million for 2026. The text does not reconcile the two. One reviewer's calculation is that the table total equals the components plus the one-time capital, so the two figures should not be added together."
    sources: [YF-EV-0304]
  - text: "The same attachment holds a second unfunded package, Parking Ban Enforcement Strategies and Resource Allocation: $100,000 a year to contract tow trucks during parking bans, which its text says \"improves service levels for snow and ice control\". It asks to continue towing the Community and Public Services Committee had funded once, from 2025 Council contingency, in June 2025."
    sources: [YF-EV-0304]
  - text: "Both Fall 2025 packages were prepared because a committee motion asked for them. The active-pathway package answers the Community and Public Services Committee's motion of August 11, 2025, moved by Councillor E. Rutherford, which asked administration to \"prepare an unfunded service package\" for the fall budget adjustment."
    sources: [YF-EV-0304, YF-EV-0298]
  - text: "Item 7.2 was an addition to the November 24, 2025 agenda, adopted at the start of the meeting, and no record fixes the day it was first published. The meeting date is used as the latest possible day. City Council heard administration's presentation on the fall budget items on November 25, 2025, met in private on them, and postponed them, 12 to 0, to its budget meeting of December 1."
    sources: [YF-EV-0299, YF-EV-0300]
  - text: "Report CO03513, Snow and Ice Control Policy and Program Review, and its Attachment 9 describe the Well Maintained City service package: \"approximately $23.6 million in ongoing operating investment and $11.5 million in one-time capital funding\", \"presented here for information ahead of formal presentation during 2027-2030 budget deliberations\". Its winter changes include an eight-day residential blading window and a crew for priority bike lanes and pathways. Attachment 9 also lists parts that are not winter work, among them structure inspections, summer sweep flushers, landscaping crews for festival venues and graffiti abatement. Neither document splits out a snow-only cost."
    sources: [YF-EV-0294, YF-EV-0295]
  - text: "The live agenda page for the committee's meeting of 2026-08-31 lists report CO03513, its thirteen attachments and an administration presentation under item 7.1. An Internet Archive capture dated 2026-08-22, five days before the comment, lists the report and Attachments 9 and 10 under the same titles and different document numbers. The Agenda Review Committee had the draft agendas for that meeting before it on 2026-08-18."
    sources: [YF-EV-0287, YF-EV-0288, YF-EV-0293]
  - text: "Attachment 10 to CO03513 lists 24 optional snow and ice enhancements, each with its own cost estimate, which the report says depend on the Well Maintained City package being approved. One is Calcium Chloride System Upgrades, at $2.5 million a year and $4.4 million one-time."
    sources: [YF-EV-0296, YF-EV-0294]
  - text: "On December 1 to 4, 2025, City Council approved the adjustments to the 2026 operating budget in revised Attachment 1 of FCS03158, 11 to 2. Report FCS03158 says unfunded service packages \"would require an approved Council amendment to add to the budget\". None of the operating budget amendments the minutes record names either snow package."
    sources: [YF-EV-0302, YF-EV-0303]
  - text: "Under item 7.1 on 2026-08-31, E. Rutherford's motion recommending policy C409L carried 5 to 0. A. Knack's motion that the Well Maintained City service package come to the September 8 Council meeting was restated and then withdrawn with the committee's consent. Motions by J. Morgan, on the Assisted Snow Removal Program, and J. Wright, on the Enhanced School Zone Clearing item in Attachment 10, each asked for an unfunded service package for the 2027-2030 budget deliberations and each carried 5 to 0."
    sources: [YF-EV-0289]
  - text: "On September 8, 2026, City Council approved policy C409L, 12 to 0, among reports not selected for debate. Report CO03513 says approving the policy needs no additional budget, and that the Well Maintained City package will come to Council during the 2027-2030 budget deliberations."
    sources: [YF-EV-0290, YF-EV-0294]
  - text: "No counted proposal states the approved snow and ice budget it would add to. The last figure administration gave was in report CO03079 of August 2025, before the period this check covers: \"The total budget for SNIC is $67 million/year\"."
    sources: [YF-EV-0304, YF-EV-0294, YF-EV-0295, YF-EV-0308]
aliases:
  - two-snow-proposals-before-council
  - snow-clearing-budget-proposals
register_claims: [two-snow-removal-proposals-need-more-money]
limitations:
  - "The answer depends on the timing rule. The rule used is that a proposal is put to a body once a published agenda of Council or a committee lists it. Under the alternative, a proposal counts only if the minutes of a meeting held by August 27, 2026 record its item as dealt with. The committee did not deal with CO03513 until August 31, so the Well Maintained City package is left out. Two proposals still count then, but only if the parking-ban towing package counts as a snow proposal. Without it, the finding on that rule would be Partially supported."
  - "The answer depends on how strictly \"need more spending\" is read. Under the stricter cost reading, a proposal's text must give the approved snow budget and its increase over it. No counted text does, so that reading counts none and the finding would be Contradicted. That reflects what the documents print, not whether new money was sought."
  - "The answer depends on whether \"2 different proposals\" means at least two or exactly two. The reviewers' final count is three, so if it means exactly two, the claim is only partly right."
  - "On the alternative body, City Council without its committees, the count is the two Fall 2025 packages, which again needs the towing package."
  - "Being put before council is not approval. City Council added neither Fall 2025 package to its budget by amendment, and the Well Maintained City package had not come to a funding decision by October 2, 2026."
  - "The Well Maintained City figures cover more than snow clearing, and the report gives no snow-only share. The active-pathway package's own figures do not reconcile, and they are reported as printed."
  - "The portal's calendar was closed to the reviewers' tools, so the count covers the meetings named in the brief and no others. A further proposal found later could only add to it."
  - "The reviewers got the reports, attachments and meeting pages from this site's archived copies, because the City's meeting portal refuses their tools. Attachment 2 to FCS03158, 144 pages, was given to them as 4 of its 36 sections, chosen by a published rule. Every reviewer read the same copies, so none retrieved these documents on its own."
  - "The Internet Archive's August 22 copy lists the committee's files under different document numbers from the live page. The archived files themselves were not read, so whether their contents differ from the live ones is not checked."
unknowns:
  - "Whether any other Council or committee meeting between November 2025 and August 2026 had a snow proposal from administration."
  - "The approved 2026 snow and ice control budget, which no counted proposal states."
  - "What the Well Maintained City package will look like, and cost, when it comes to Council in the 2027-2030 budget."
missing_evidence:
  - "A full search of the City's meeting calendar for snow and ice reports from November 2025 to August 2026 (City of Edmonton, Office of the City Clerk)."
  - "The approved 2026 snow and ice control operating budget, stated by administration (City of Edmonton, Financial and Corporate Services)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Opus 5.5
      verdict: Supported
      confidence: High
      key_findings:
        - "The active-pathway package and the Well Maintained City package alone make two, so the answer does not rest on the parking-ban towing package."
        - "Under the stricter cost reading the result would be Contradicted, which here means only that no text states a budget baseline, not that no new money was asked."
      changed_between_rounds: "Verdict unchanged. Its first count was four, treating Attachment 10's optional enhancements as a proposal of their own; in cross-review it counted three, and corrected its own reading of the active-pathway package's figures, which it had put side by side as if they added."
    - model: GPT-6 Sol
      verdict: Supported
      confidence: High
      key_findings:
        - "Three costed packages by the comment date, two of them on Council's Fall 2025 budget agenda."
        - "The stricter cost reading and the exactly-two count each change the result."
      changed_between_rounds: "No change in verdict or count. Its confidence went from high to moderate."
    - model: GPT-6 Luna
      verdict: Supported
      confidence: Moderate
      key_findings:
        - "The Well Maintained City package was on the committee's published agenda before the comment, but not dealt with until August 31."
        - "The package figures are proposed costs, not approvals, and the Well Maintained City total covers more than snow."
      changed_between_rounds: "The same verdict in both rounds. Its first count was two, because it missed the parking-ban towing package, which made the result only partly right if a proposal counts once a meeting has dealt with it. In cross-review it counted three, and its result under the stricter cost reading went from partly right to Contradicted."
