id: infra-hundred-million-vs-shortfall
question: Was the $100 million for Edmonton's bike lanes a serious share of the renewal shortfall the City itself reports?
story: infrastructure-deficit
finding: Partially supported
answer: >-
  Partly. The $100 million came to about a fifteenth of the renewal the City said it could
  not fund from 2023 to 2026, too much to dismiss and far short of a serious share.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.39"
review_run: reviews/infrastructure-deficit/2026-09-03
plain_speech_read: reviews/infrastructure-deficit/2026-09-03/plain-speech/gpt-1.md
evidence: [YF-EV-0201, YF-EV-0114, YF-EV-0208]
key_facts:
  - text: "The City's 2024 Financial Annual Report says the renewal investment shortfall in 2023-2026 is approximately $1.52 billion. $100 million is 6.6 per cent of that, a calculation made here."
    sources: [YF-EV-0201]
  - text: "When council adopted the 2023-2026 Capital Budget, the City put its ideal renewal investment for those four years at $3,575,584 thousand (about $3.58 billion) and the part of it funded at $1,945,673 thousand (about $1.95 billion), 54.4 per cent. It called the difference a \"renewal funding gap of $1.63 billion for 2023-2026\". $100 million is 6.1 per cent of that gap."
    sources: [YF-EV-0114]
  - text: "Renewal, in the City's words, is investment in existing infrastructure to restore it to an efficient operational condition and extend its service life. The shortfall is for the City's renewal program as a whole, not for roads alone."
    sources: [YF-EV-0201, YF-EV-0114]
  - text: "The same budget says that once programs with dedicated funding, such as neighbourhood renewal, are set aside, the rest of the renewal program was funded at about 31 per cent of its ideal. The 2024 annual report puts that remainder at 35.4 per cent."
    sources: [YF-EV-0114, YF-EV-0201]
  - text: "The $100 million was 1.39 per cent of the $7,192.5 million adopted capital budget for 2023 to 2026, and 4.56 per cent of the $2,194.9 million in renewal that budget funded."
    sources: [YF-EV-0114]
aliases:
  - bike-lanes-vs-infrastructure-deficit
  - 100-million-bike-lanes-infrastructure-gap
register_claims: [spending-100-million-despite-deficit]
limitations:
  - "Both lines were set in the brief ahead of any figure. A share of a quarter or more would have counted as serious, and under a twentieth as too small to count. Neither line comes from an existing standard, and no reviewer found a City benchmark for what share of its renewal need it should fund. The brief's alternative lines, 15 and 3 per cent, give the same result."
  - "Both City figures give the same answer. The finding would change only if the shortfall for these four years were $400 million or less, or more than $2 billion."
  - "The $1.52 billion is the City's own figure and it calls it approximate. It is the more recent of the two, which is why it carries the finding. The 2024 annual report's passage on renewal gives no ideal and funded amounts behind it, and does not break the shortfall down by asset class."
  - "One side is money council approved and the other is renewal the City says it left unfunded, both for 2023 to 2026. Neither is spending."
  - "No reviewer found a City figure for the shortfall on roads and alleys alone for 2023 to 2026, so the brief's narrower comparison could not be made."
  - "The City also reported a $4.8 billion gap over ten years, 2023 to 2032, in an outlook presented in June 2022. $100 million is 2.1 per cent of it. That covers different years and was not used for the finding."
  - "The City's 2025 annual report, published in 2026, looks forward instead. It puts the renewal investment shortfall for 2027 to 2030 at approximately $2.7 billion, and the ten-year gap for 2027 to 2036 at $10.0 billion. It gives no new figure for 2023 to 2026, so the finding stands on the 2024 report."
  - "No reviewer found a City cost per kilometre of road renewed or per neighbourhood completed, so this page does not say what $100 million would have bought in renewal."
  - "The size of the money says nothing about whether it could have been moved. That is the question of the claim beside this one."
unknowns:
  - "Whether the City updated its 2023-2026 shortfall after the 2024 annual report and before 2026-09-03 in a document the reviewers could reach."
  - "What part of the shortfall falls on roads and alleys."
missing_evidence:
  - "A City-published renewal requirement and funded amount for roads and alleys alone for 2023 to 2026 (City of Edmonton, Infrastructure Planning and Design and Financial and Corporate Services; moderate)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Opus 5.5
      verdict: Partially supported
      confidence: Moderate
      key_findings:
        - "Found City figures for 2023 to 2026 through search excerpts and put the shortfall between about $1.5 and $1.6 billion, so the $100 million is 6 to 7 per cent of it."
        - "Any shortfall between $400 million and $2 billion gives the same result."
      changed_between_rounds: "Kept its finding. Withdrew its own $1.61 billion estimate, built from rounded percentages, in favour of the City's stated $1.52 billion."
    - model: GPT-6 Sol
      verdict: Partially supported
      confidence: High
      key_findings:
        - "The City's 2024 annual report gives a 2023-2026 renewal investment shortfall of about $1.52 billion, so the $100 million is 6.58 per cent of it."
        - "The adopted budget's $1.63 billion renewal funding gap gives 6.13 per cent, the same result."
      changed_between_rounds: "No change."
    - model: GPT-6 Luna
      verdict: Partially supported
      confidence: High
      key_findings:
        - "The adopted budget calls the difference a renewal funding gap of $1.63 billion for 2023 to 2026, and $100 million is about 6.13 per cent of it."
      changed_between_rounds: "Kept its finding, lowered its confidence to Moderate, and noted the later $1.52 billion gives the same result."
