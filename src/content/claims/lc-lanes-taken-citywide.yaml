id: lc-lanes-taken-citywide
question: Has the City taken driving lanes for bike lanes all over Edmonton?
story: lanes-and-congestion
finding: Not established
answer: >-
  Nobody can tell from the records. Edmonton did take driving lanes for bike lanes on some
  streets, but the records we found cannot show whether it happened all over the city.
evidence_basis: Direct Edmonton evidence
panel_agreement: Unanimous
methodology_version: "1.40"
review_run: reviews/lanes-and-congestion/2026-09-16
plain_speech_read: reviews/lanes-and-congestion/2026-09-16/plain-speech/gpt-1.md
topics: [transportation, bike-lanes]
evidence: [YF-EV-0163, YF-EV-0164, YF-EV-0165, YF-EV-0166, YF-EV-0167, YF-EV-0168, YF-EV-0169, YF-EV-0170, YF-EV-0171, YF-EV-0172]
key_facts:
  - text: "The City's 2017 fact sheet for 102 Avenue says the stretch from 121 Street to 111 Street was a two-way road. To fit the protected bike lane, either the parking lane or one travel lane had to go, and the City's recommended plan called for removing the westbound travel lane."
    sources: [YF-EV-0163]
  - text: "The City's November 2017 guide to its new west-central bike routes reports the result, 102 Avenue one-way for traffic heading east from 121 Street to 111 Street, and marks the two-way protected bike lane there as new in 2017. Its map labels the neighbourhood along that stretch Oliver."
    sources: [YF-EV-0164]
  - text: "The City's route table says 96 Street from 119 to 124 Avenue, in Delton and Alberta Avenue, was converted to one-way southbound for vehicle traffic to accommodate a new protected contraflow bike lane, built in 2025 and open for use. Parking was also removed on the east side."
    sources: [YF-EV-0170]
  - text: "The same table says 100 Street from 76 to 83 Avenue was converted to one-way northbound to accommodate on-street two-way bike lanes, and lists the protected lane from 80 to 83 Avenue in Strathcona and Ritchie as open in 2025."
    sources: [YF-EV-0170]
  - text: "The City's final design for the Garneau renewal, updated in April 2021, calls for removing the southbound travel lane on 110 Street from 76 to 82 Avenue and adding a protected bike lane on the west side. The City's bike route inventory records a two-way protected lane on that stretch built in 2022. No as-built drawing is in hand."
    sources: [YF-EV-0165, YF-EV-0166]
  - text: "The City places Oliver in its Central district, Strathcona and Garneau in Scona, and Delton in North Central. That is 3 of the City's 15 districts in which this page can show, from the City's own records, driving space that gave way to a bike lane."
    sources: [YF-EV-0167, YF-EV-0163, YF-EV-0170]
  - text: "The City's on-street bike route inventory held 3,175 segments on 2026-09-23. It has fields for each segment's street and classification and a construction-year field that is blank for some segments, and no field for what the space was used for before, so it cannot show how many bike lanes replaced a driving lane."
    sources: [YF-EV-0166]
  - text: "On 102 Avenue east of 109 Street, the City says the road between 107 Street and 102 Street was cut to one eastbound lane to make room for the Valley Line West LRT. That page does not mention a bike lane."
    sources: [YF-EV-0168]
  - text: "For 132 Avenue, the City's draft design, put to the public in early 2022, proposed one driving lane in each direction, turning lanes near major intersections, traffic calming and off-street protected one-way bike paths."
    sources: [YF-EV-0169]
  - text: "The City's 2022 final-design answers say parts of the road had two lanes each way and the design keeps at least one lane each way, with turning lanes near major intersections. Its project page records new bike facilities completed section by section from 2023, first between 101 and 107 Street. Neither says which finished section's bike facility sits in former driving-lane space."
    sources: [YF-EV-0172, YF-EV-0171]
aliases:
  - city-removed-traffic-lanes-for-bike-lanes
  - edmonton-took-driving-lanes-for-bike-lanes
  - traffic-lanes-removed-all-throughout-the-city
register_claims: [city-removed-traffic-lanes]
limitations:
  - "This finding does not measure congestion. It says what the City built on some streets, and nothing about whether traffic on them got faster or slower."
  - "All throughout the city was fixed before the research as conversions in 8 or more districts, with 5 as an alternative bar. Both numbers are judgements rather than an outside standard. The records in hand reach 3 districts, and the true total is unknown."
  - "On 96 Street and 100 Street the City's record is a one-way conversion made to accommodate the bike lane, with parking removed as well. It shows that a direction of traffic gave way to the bike lane, not a drawing of which strip of pavement the lane now occupies."
  - "The reviewers did not all count the same streets. All three counted 102 Avenue from 121 to 111 Street. GPT-6 Sol also counted 110 Street in Garneau and 83 Avenue at 104 to 105 Street in Strathcona, both in Scona. The April 2015 City plan it cited for 83 Avenue returned a page-not-found page on 2026-09-24, and the City's 2017 project sheet for that route does not describe the lane change, so this page does not count 83 Avenue."
  - "The Claude seat counted 100 Street and named 96 Street and 132 Avenue, from a community league's notice and news reports. This page counts 100 Street and 96 Street from the City's own route table, found by the freshness audit, and leaves 132 Avenue out. 96 Street is the one district-adding street that no seat verified in round 1."
  - "GPT-6 Luna confirmed the 102 Avenue conversion from the City's record but could not place it in a district."
  - "The City's addresses for the 102 Avenue fact sheet and the Garneau design no longer load. This page relies on the Internet Archive's copies of the same addresses, and its registry entries say so."
  - "Reasons are reported, never judged. The 102 Avenue fact sheet says its recommended westbound-lane removal would make room for the protected bike lane, and the route table says the 96 Street and 100 Street one-way conversions were made to accommodate the bike lanes."
unknowns:
  - "How many of the City's on-street bike lanes replaced a driving lane. We found no published street-by-street record of what each bike lane replaced, and the inventory cannot say."
  - "Whether any finished section of 132 Avenue put a bike lane where a driving lane had been. The City expected the remaining work between 121 and 127 Street to finish in mid-October 2026, which makes it a corridor to recheck."
  - "Whether any stretch of 102 Avenue east of 109 Street lost a driving lane to a bike lane once the LRT change is set aside."
missing_evidence:
  - "A street-by-street record, for every on-street bike lane built by 2026-09-23, of what the space was before, such as before-and-after cross-sections or as-built drawings (City of Edmonton transportation and project records; critical)."
  - "As-built plans and completion dates for each section of 132 Avenue (City of Edmonton; high)."
review:
  agreement: Unanimous
  reviewers:
    - model: Claude Opus 5.5
      verdict: Not established
      confidence: Moderate
      key_findings:
        - "Confirmed the 102 Avenue conversion from 121 to 111 Street and placed it in the Central district."
        - "Counted 100 Street in Scona and named 96 Street in Delton and 132 Avenue, the last three from a community league's notice and news reports because the City's project pages returned errors that day, so it confirmed two districts and at most four."
        - "Found that the City's bike route inventory has no field recording what a segment was used for before, so a complete count cannot come from it."
      changed_between_rounds: "No change in verdict. In cross-review it took up 83 Avenue and, provisionally, 110 Street from GPT-6 Sol, and set 100 Street, 96 Street and 132 Avenue aside as leads without a City record in hand."
    - model: GPT-6 Sol
      verdict: Not established
      confidence: Moderate
      key_findings:
        - "Confirmed three conversions in two districts from City records, 102 Avenue in Central and 83 Avenue and 110 Street in Scona."
        - "Did not count 132 Avenue from a draft design, or 102 Avenue east of 109 Street, where the City attributes the lane reduction to the LRT."
        - "Could not reach the full inventory, so could not count how many bike lanes there are or how many have a record of what they replaced."
      changed_between_rounds: "No change in verdict. In cross-review it reported a third district, North Central, which is not counted here because the round-1 answers are the basis."
    - model: GPT-6 Luna
      verdict: Not established
      confidence: Moderate
      key_findings:
        - "Confirmed the 102 Avenue conversion from the City's 2017 fact sheet and route map."
        - "Could not place it in a district, and could not reach the inventory."
        - "Found that the City's 132 Avenue report describes renewal planning, not a finished conversion."
      changed_between_rounds: "No change in verdict. In cross-review it accepted 83 Avenue and 110 Street as plausible but said 110 Street still needed confirmation that it was built."
