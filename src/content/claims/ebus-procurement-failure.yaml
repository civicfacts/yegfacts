id: ebus-procurement-failure
question: Did Edmonton's Proterra electric buses substantially fail to deliver what the City contracted for?
story: electric-buses
finding: Partially supported
evidence_basis: Mostly Edmonton evidence
confidence: Moderate
methodology_version: "1.0"
review_run: reviews/electric-buses/2026-08-31
evidence: [YF-EV-0001, YF-EV-0002, YF-EV-0003, YF-EV-0004, YF-EV-0005, YF-EV-0006, YF-EV-0009]
key_facts:
  - text: "The City's February 2024 proof of claim says the contract specified 328 km of range, or 268 km in extreme cold, while the buses averaged about 165 km in winter — 38% below the cold-weather guarantee."
    sources: [YF-EV-0003]
  - text: "City court filings say the buses failed contract specifications for range, battery life, reliability and durability, with more than half the 60-bus fleet out of service at times roughly three years after the 2020 rollout."
    sources: [YF-EV-0004]
  - text: "Proterra entered Chapter 11 in August 2023, and one day before the January 2024 sale hearing Edmonton was removed from the list of contracts transferring to the buyer — leaving its warranty provisions unlikely to be honoured."
    sources: [YF-EV-0001, YF-EV-0003]
  - text: "Transit-union representatives independently described numerous mechanical issues, battery problems and missing parts across the fleet."
    sources: [YF-EV-0009]
  - text: "The City's own project page still lists 60 electric buses in the ETS fleet; the buses entered service in August 2020 and were reported still in daily service in early 2024."
    sources: [YF-EV-0005, YF-EV-0012, YF-EV-0003]
  - text: "Toronto's head-to-head evaluation measured its Proterra fleet at 95% availability by April 2022 and called Proterra's technical support excellent even as body-crack repairs hurt availability — the failure was not uniform across cities."
    sources: [YF-EV-0006]
aliases:
  - edmonton-ebus-disaster
  - ebuses-dont-work
limitations:
  - "The most precise shortfall figures (165 km winter average, availability claims) come from the City's own adversarial court filings, which are allegations, not independently audited measurements."
  - "The buses continued to deliver service throughout; 'failed to deliver contracted performance' is not the same as 'did not work at all.'"
  - "The union accounts in Global News and CBC quote the same ATU 569 officials — corroboration from one voice, not two."
unknowns:
  - "Independent (non-litigation) measurements of fleet availability and range by year."
  - "How much performance improved or degraded after Phoenix Motor reopened a parts channel in 2024."
missing_evidence:
  - "ETS per-year fleet availability, maintenance cost and range data for the Proterra fleet (holder: Edmonton Transit Service)."
review:
  agreement: Majority
  reviewers:
    - model: Claude Fable 5
      verdict: Supported
      confidence: Moderate
      key_findings:
        - "A 38% shortfall against the extreme-cold guarantee, sub-50% availability at times, and a collapse of vendor support meet the brief's bar of material shortfall against contracted specifications, even though buses ran daily."
        - "Weights the City's legal filings as the City's formal assessment, corroborated by union accounts and undisputed docket events."
      changed_between_rounds: "Held Supported; adopted the other reviewers' point as a corrective to the word 'disaster,' not to the normalized proposition."
    - model: GPT-5.6 Sol
      verdict: Partially supported
      confidence: Moderate
      key_findings:
        - "Material shortfalls are well-documented, but the precise figures rest on untested litigation claims, and the fleet remained in service."
    - model: Gemini 3.1 Pro
      verdict: Partially supported
      confidence: Moderate
      key_findings:
        - "Downgraded from Supported: the sharpest numbers rely solely on the City's untested court filings rather than independent audit, and the buses continue daily service, contradicting the absolute 'disaster' framing."
      changed_between_rounds: "Supported → Partially supported after cross-review."
