# Candidate register (methodology v1.12).
#
# Every claim the site has considered checking, whether or not it reached
# triage, with where the wording came from and what happened. The
# pre-registered launch slate (docs/DESIGN.md section 7) is not repeated
# here as a whole; a slate claim appears once it has been through triage
# or a framing check and did not go to a panel as registered. Everything
# else is here. A candidate that never reached triage says so.
#
# One entry per proposition, not per post. When a new suggestion makes a
# claim already on this list (the same thing asserted in other words, in
# other units, or as an example of the same pattern), it is added to that
# entry's intake record as another captured form, with its source, rather
# than registered again; the triage reader is not asked to de-duplicate.
# Two claims that answer different questions stay separate even when they
# come from the same argument, and may share a story.
#
# origin: captured (a post we hold with a URL or screenshot) |
#         supplied (wording passed to us by a person, provenance not
#         captured) | editor (a hypothesis the editor or founder proposed)
# outcome: GO | PARK | NO | not-triaged | pre-triage (checked before
#          v1.12 existed)
#
# reason:  one sentence, written for readers, saying why the outcome is what
#          it is. Required on PARK and NO — /considered publishes it, so a
#          declined claim never sits there unexplained. `note` stays as the
#          internal shorthand and is shown only when there is no reason.
# triage:  repo-relative path to the triage report behind the outcome, when
#          one exists. Validated to exist on disk; /considered links it.
# story:   slug of the story that carries the claim, when one does. Linked as
#          /facts/<slug> only if that story is published.

