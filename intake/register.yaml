    context: an Edmonton social-media thread on infill; platform, author and URL not captured; may be a composite paraphrase
    outcome: not-answered
    story: infill-prices
    reason: "Checked before triage existed, three runs, both claims Not established. A triage read then parked both: the price gap needs a decade-scale lot-by-lot linkage the run did not build, and no public record says what the housing that replaced particular demolished homes costs. The story is no longer a finding until one of those exists."
