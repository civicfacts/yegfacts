    ground: no-instrument
    reason: "We put this to the panel and cannot answer it. The only Edmonton source that records why people cycle is the 2015 regional household travel survey, and it surveyed weekdays between mid-September and mid-December — the least recreational stretch of the riding year. A measure taken there cannot carry a claim about who rides in general, and narrowing the claim to autumn weekdays would answer an easier question than the one people are arguing about. It reopens if a travel survey covering a representative period, and recording why each trip was made, is published for Edmonton."
