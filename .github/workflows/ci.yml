name: CI

# Spec §4: every PR — content or code — runs validation AND the full Astro
# build. An MDX error, a duplicate route or a broken import is a content
# failure too, so a green validator alone is not enough to merge.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The method-change rules below compare this branch against its base,
          # so the base commit has to be in the clone. The default depth-1
          # checkout has no merge base and `validate:diff` fails loudly rather
          # than passing on a history it cannot see.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Cross-file content rules (spec §8): evidence IDs resolve, claim/story
      # backlinks agree, public archives hash to what the registry says.
      - name: Validate content
        run: npm run validate

      # The half of validation that needs a base commit, which is why it never
      # ran until now: a change to prompts/, scripts/merge*, scripts/synthesize*
      # or methodology/ (audits and the changelog itself excepted) must bump the
      # methodology version, and a changed claim `finding` or `panel_agreement`
      # must come with an entry in its story's changelog. The changelog header
      # promised the first of these for weeks while nothing checked it.
      - name: Method-change rules
        env:
          VALIDATE_BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: npm run validate:diff

      # The repo is public, so everything tracked is published. The fail
      # classes — secrets, private-evidence leaks, unlicensed archives, local
      # paths — block the push; PII and long quotes warn and are dispositioned
      # in the periodic full-tree audit (methodology/exposure-audit.md).
      - name: Public-exposure audit
        run: npm run audit:exposure

      # The synthesis matrix: exhaustive over all 20 verdict multisets and
      # permutation-invariant over all 64 ordered triples (spec §5, §8).
      - name: Unit tests
        run: npm test

      # Astro's own type checker; a content or component change that breaks
      # the ImportMetaEnv contract or a prop type should fail here, not surface
      # as a runtime error on the deployed page.
      - name: Type check
        run: npx astro check

      - name: Build site
        run: npm run build

      # Scans the built dist/ output, so it has to run after the build: catches
      # in-page duplication (the same fact or quote appearing twice on one
      # page) that only shows up in the rendered HTML.
      - name: In-page duplication audit
        run: npm run audit:duplication

      # The sitemap is written by hand, so a new page can be added and left out
      # of it. This compares it against what the build actually produced, and
      # fails either way round: an indexable page nobody listed, or a listed URL
      # that no longer has a page.
      - name: Sitemap audit
        run: npm run audit:sitemap
