establishes: That on 2026-08-19 the YEG Bike Coalition publicly urged its readers to register to speak at the Infrastructure Committee's meeting of 2026-08-26 on item 7.6, in opposition to administration's proposed changes, and said Paths for People would host an online session on 2026-08-24 to help people prepare to speak. Establishes that these organizations encouraged and offered to prepare speakers; it does not establish who registered or spoke in response, or that anyone was paid.
