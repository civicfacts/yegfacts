establishes: "How the City describes its residential waste characterization studies: four-season studies in 2022 to 2023 of the composition of garbage, recycling, food scraps and yard waste collected from homes, a 2025-26 study in progress and another planned before 2030. Establishes that these studies measure what the collected material is made of; the roadmap reports no measure of cart fullness, set-out volume against cart capacity, or households with excess garbage."
