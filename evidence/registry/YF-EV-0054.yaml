establishes: The regulated conditions under which a 30-year amortization is available on an insured mortgage, in force from 2024-12-15 for newly built dwellings and first-time buyers. Establishes that the brief's 30-year sensitivity is regulated only for insured borrowing; above 20 percent down the term is lender policy, not regulation.
