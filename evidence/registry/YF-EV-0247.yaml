establishes: The City's record of the final design decisions for the 132 Avenue renewal, section by section from 127 Street to Fort Road, including raised one-way bike paths on both the north and south sides, the stated aim to maintain parking as much as possible, defined parking areas next to the driving lanes, parking moved from service roads to the avenue, and where the design states that parking is affected. Establishes what the City decided and said about parking in that design; it does not count stalls removed or establish what was built.
