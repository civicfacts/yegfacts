establishes: The City's own map of its bike network and the fields it publishes for each of the 10,417 segments, including the type field whose only two values are ON ROAD (3,160 segments) and OFF ROAD (7,257), the classification field whose values include Protected Bike Lane (495) and Painted Bike Lane (194), and the route_coming_soon flag that marks a segment as under construction or funded rather than built. It establishes the classification the panel joined counters to; it does not establish which segment any one counter sits on.
