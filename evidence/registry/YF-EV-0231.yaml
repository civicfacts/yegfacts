establishes: Item 7.1, the Spring 2024 Supplemental Capital Budget Adjustment, with every motion, mover and recorded vote. One amendment, moved by K. Principe and seconded by J. Rice, concerned new standalone profiles requesting funding (7.2-4, 7.2-5, 7.2-26, 7.2-30, 7.3-1) and was defeated 2 to 10; its minuted text does not name capital profile CM-20-0330 or the active transportation program, and no other motion on the item does. Establishes motions and votes, not debate.
