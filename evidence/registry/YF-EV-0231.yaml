kind: legal-audited
establishes: "The City Auditor's report on the Parks and Roads Services Branch's parking operations: the Branch oversees 6,000 parking spaces, 2,700 on-street stalls and 3,300 off-street paid stalls, and collected approximately 13 million dollars from paid parking in 2025; on-street parking is defined to include residential parking and paid curbside parking; the Branch has no Council-approved strategic vision or performance framework and no formal guidance on rates, complimentary passes, waived fees or residential restrictions; administration's response names the Transforming Edmonton's Curbside and Parking Program report (CO03347, Urban Planning Committee, June 2026) and guidance on complimentary and subsidized parking to be developed in 2027. Establishes what the Auditor found and what administration answered; it states no cost of providing unpaid on-street parking and no figure for parking removed by any project."
