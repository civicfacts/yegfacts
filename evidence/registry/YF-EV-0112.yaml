establishes: A City-commissioned consultant study of Edmonton's development economics, reporting for low-density infill that 'developers actively seek out properties that are undervalued relative to the surrounding neighbourhood' and that 'the differential between initial purchase price and the top quartile selling price in a neighbourhood is given far more weight than the neighbourhood itself'. Establishes a stated developer site-selection motive as consultants described it in 2019; it is interview-based commentary, not measurement, and reports no matched teardown-replacement prices or assessed values.
