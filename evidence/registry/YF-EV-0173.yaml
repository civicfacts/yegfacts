establishes: The City's evaluation of the adaptable measures installed on 40 Street and Hermitage Road, which include bike lanes. It reports traffic volumes and vehicle speeds collected before and after installation, bike counts, and queue observations at intersections in the peak hours, and what residents said. It measures speed compliance and volumes; it is not a travel-time or delay study built to attribute a change in delay to the bike lane.
