establishes: The City's own 2024 community GHG inventory (15.2 million tCO2e) set against its own 2024 target-trajectory value (12.2 million tCO2e or less), the 10.8 million tCO2e 2025 target, the corporate 2023-2026 carbon deficit, and the City's stated assessment that the 2025 target will not be met and the community carbon budget will be depleted in 2036; establishes the City's reported measurements and its own assessment and forecasts, not independent verification of either
