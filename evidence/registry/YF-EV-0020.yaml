excerpts:
  - The trend for this year indicates this target will not be met and there are no current initiatives or actions that will allow the necessary reductions to meet the target.
  - In 2024, Edmonton's community emissions were 15.2 million tCO2e (a three per cent increase from 2023) and 12.8 tonnes per person (a three per cent decrease from 2023).
  - The Carbon Budget continues to deplete at a rate consistent with prior projections, which is expected to hinder the City's ability to achieve established reduction targets.
