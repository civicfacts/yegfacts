establishes: "Items 10.3 and 10.4: the motion by J. Morgan, seconded by M. Elliott, that Administration, as part of the review of Council Policy C409K, include options, risk analysis, operationalization timelines and resource implications for different or innovative operational tactics, including but not limited to calcium chloride application to roadways, carried 11 to 0; and the motion by A. Paquette, seconded by E. Rutherford, that the same review include options, costs and implications for a Snow and Ice Control Surge Capacity strategy and options to support operations in communities with scheduled winter events, carried 10 to 0. Establishes what Council asked Administration to bring back and when the calcium chloride question was put on the review's agenda; the minutes record motions and votes, not debate."
