establishes: "Item 7.1 on City Operations report CO03513: who was present (J. Wright, J. Morgan, A. Knack, K. Principe, E. Rutherford), which files were before the committee, who presented and spoke, and every motion with its mover, the recorded vote and its outcome: the recommendation to City Council that Snow and Ice Control Policy C409L be approved (carried 5 to 0); a motion by A. Knack to bring the Winter and Year-round support service portions of the Well Maintained City Service Package to the 2026-09-08 City Council meeting, restated and withdrawn with unanimous consent; and two carried motions (5 to 0) for unfunded service packages for the 2027-2030 budget deliberations, one to continue the Assisted Snow Removal Program and one for the Enhanced School Zone Clearing package as outlined in Attachment 10. No motion on calcium chloride is recorded. The minutes record motions and votes, not debate. The page lists the same files under its own DocumentIds (305997 to 306011)."
