establishes: "What the City says about the program on its own page: that the 2023-2026 capital budget includes $100 million for the expansion, that it is about 2 per cent of approximately $5 billion in transportation projects including roads and bridges, that 35 kilometres of new connections were built through 2024 and 2025 with 33 more planned for 2026 and beyond, and that active transportation 'improves access, reduces vehicle trips and traffic congestion'. Establishes the City's statements and figures as published; it does not establish outcomes."
