id: YF-EV-0282
title: Snow Clearing Service Levels, City of Edmonton web page, as published 2026-10-02
publisher: City of Edmonton
url: https://www.edmonton.ca/transportation/on_your_streets/neighbourhood-roads-winter
retrieved_on: 2026-10-02
kind: city-webpage
establishes: "The City's public statement of its snow clearing priority hierarchy on the as-of date: roadway priorities 1 to 4 with completion standards of 1 day, 5 days, 6 days and, for residential roadways, 5 cm snowpack completed within 14 days once a residential blading cycle is initiated; active pathway priorities 1 to 4, with the winter priority bike loop at bare pavement within 1 day; the residential clearing approach; the windrow statements, including that the City does not remove windrows along standard residential roadways and that windrows may lead to less on-street parking; that protected bike lanes are cleared within the first 24 hours as part of the first priority and painted bike lanes with the adjacent road; the current uses of calcium chloride brine; and the documents the page links (Policy C409L, Procedure C409K, the service levels mailer). Establishes what the City told the public on that date; where it differs from the Procedure (14 days against 10 days for residential completion), both texts are archived."
