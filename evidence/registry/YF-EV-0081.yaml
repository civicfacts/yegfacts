id: YF-EV-0081
title: J. David Hulchanski, The Origins of Urban Land Use Planning in Alberta, 1900-1945 (Research Paper No. 119)
publisher: Centre for Urban and Community Studies, University of Toronto
url: https://utoronto.scholaris.ca/bitstream/1807/92488/1/Origins%20Land%20Use%20Planning%20Alberta_TSpace.pdf
published_on: 1981-01-01
retrieved_on: 2026-09-01
kind: analytical-report
establishes: "A scholarly account of Alberta land use regulation before 1945: that built housing in 1926 was sparse relative to subdivided land, that partial residential-protection instruments existed in 1926 under Bylaw 35 without a stated geography, that comprehensive zoning began in 1933, and that the 1933 one-family districting was use-separation applied largely to vacant subdivided land. It is a secondary history, not the bylaw texts."
