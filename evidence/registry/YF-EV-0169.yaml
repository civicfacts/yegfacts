establishes: The City's 132 Avenue renewal draft design, put to the public in early 2022, proposed one driving lane in each direction with turning lanes near intersections, together with traffic calming. It records what residents said about that draft. It is a draft design, not a record of what was built or of which finished sections replaced a driving lane with an on-street bike lane.
