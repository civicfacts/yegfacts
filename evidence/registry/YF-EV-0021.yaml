excerpts:
  - As outlined in the Community Energy Transition Strategy, the City of Edmonton's community emission reduction targets are 35 per cent by 2025, 50 per cent by 2030 (both from 2005 baseline levels) and becoming an emissions neutral community by 2050.
  - Current investments are not enough to achieve reduction targets and action is needed as the carbon deficit continues to grow under the current state.
