establishes: The adopted community emission reduction targets (35 per cent by 2025, 50 per cent by 2030 from 2005 levels, emissions neutral by 2050), the corporate 2040 neutrality target, the 176 million tonne CO2e community carbon budget for 2022-2050, and the City's own 2022 warning that current investments were not enough; establishes the benchmark the claim is measured against and a stated expectation, not any measured outcome
