excerpts:
  - The City will make its best efforts to plow and remove snow in bike lanes after the end of a snowfall.
  - Priority 1 is cleared in 24 hours Priority 2 is cleared in 3 days Priority 3 is cleared in 14 days
  - Priority 1 active pathways create a connected loop that is cleared within 24 hours for winter travel.
