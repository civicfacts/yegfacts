establishes: Edmonton's stated winter service targets for active pathways — Priority 1 cleared in 24 hours, Priority 2 in 3 days, Priority 3 in 14 days — and the connected Winter Priority Loop cleared within 24 hours, all on a best-efforts basis. Establishes the standard the City states, not whether it is met or what ridership follows.
