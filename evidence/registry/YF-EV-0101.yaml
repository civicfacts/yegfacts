establishes: The City's own account of 2024 infill activity in the redeveloping area, including 286 new single-detached houses built against 387 demolished, a net loss of 101, and its conclusion that other built forms are replacing demolished detached houses. Establishes that multi-unit replacement is material to the cohort; it contains no matched price or assessed-value comparison between a demolished dwelling and its replacement.
