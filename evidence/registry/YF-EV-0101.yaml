establishes: "The City's own account of 2024 infill activity in the redeveloping area, including a reported net loss of 294 single detached houses and its conclusion that other built forms are replacing demolished detached houses. Establishes that multi-unit replacement is material to the cohort; it contains no matched price or assessed-value comparison between a demolished dwelling and its replacement. It does not carry the 286 built, 387 demolished and net 101 figures this entry recorded before the 2026-09-01 drafting correction; a seat that extracted the archived PDF searched for all three and found none of them."
