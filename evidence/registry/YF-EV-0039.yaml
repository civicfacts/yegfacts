establishes: "What the Rental Market Survey measures and how: the universe, the collection method and the definition of the rents reported. Establishes that survey rents carry no heat-included status and cover structures of three or more units, so rental infill replacements fall outside the brief's ownership test; it establishes no Edmonton rent level."
