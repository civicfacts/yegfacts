establishes: "The administration's account of what Council was being asked to adopt: the District Policy as a statutory plan under the Municipal Government Act as amended by the City of Edmonton Charter 2018 Regulation, providing guidance for land use, mobility and growth management, and the City Plan targets it implements (50 per cent of trips by transit and active modes, 15-minute access to daily needs, 50 per cent of new units as infill). Establishes the instrument's legal character and the City's stated targets, not the effect of either"
