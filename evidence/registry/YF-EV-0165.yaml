establishes: The City's final design for the Garneau renewal lists a protected bike lane on the west side of 110 Street from 76 Avenue to Saskatchewan Drive and, for 110 Street from 76 to 82 Avenue, the southbound travel lane removed. It is a design, not a record of what was built. The City's own URL now returns HTTP 404; these bytes are the Internet Archive's capture of that URL taken 2023-05-24.
