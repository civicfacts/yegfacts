establishes: "The 86-page business case behind report CR_7173: that the 2019 curbside service collected garbage weekly in black bags with no limit on the number of bags; the options evaluated for each stream, including weekly and biweekly garbage collection, and the stated reasons for the recommended frequencies (odour and insects for kitchen organics, removal of organics making biweekly garbage feasible); pre-cart public engagement results on black cart size; the plan for the 8,000-home demonstration and its 4,000 and 4,000 split between 120 L and 240 L black carts; and the performance indicators planned after rollout. It reports no measure of how full carts are at collection, of garbage set out against cart capacity, of cart sufficiency by household size, or of bags set out per home before carts. The City address redirected to a not-found page on 2026-10-04; these bytes are the archive's raw-content endpoint (timestamp 20200412014834, five captures in 2020 and 2021 share this digest). A capture of 2021-06-24 under the same address has a different digest, is 1,048,576 bytes as downloaded (SHA-256 140d7f29a132de30fca82c12d2870cc26dedb0cf230c396dd475258876f97d35) and cannot be parsed as a complete PDF; it was not used. An earlier version of this entry gave 1,002,493 bytes, a number taken from the archive index rather than counted from the downloaded file."
