establishes: "The operating budgets council approved for 2019 to 2022 by branch and program. For Parks and Roads Services, the Program Summary for Snow and Ice Control (printed page 212) gives, in $000s, for the 2022 Budget column: Revenue and Transfers 13, Expenditure and Transfers 64,466, Total Net Operating Requirement 63,653; the Branch Summary by Program (printed page 205) gives Snow and Ice Control net expenditure and transfers of 63,666 for 2022. Establishes the approved 2022 budget as adopted in December 2018; it does not establish in-year amendments or actual spending."
