establishes: "The dataset landing page for the historical assessment rolls, including its field list: account, assessment year, address, legal description, coordinates, year built, lot size and total assessed value. Establishes the record the panel's matched-lot analysis was built from and, by its field list, what that record lacks — land and improvement components, dwelling counts within a title, and any separately-titled flag. The archived bytes are the portal page, not the roll data, and carry none of the panel's computed shares."
