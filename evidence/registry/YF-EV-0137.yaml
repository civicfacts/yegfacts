establishes: The City's annual infrastructure report for 2025, listing the Active Transportation Network Expansion at a $100 million budget with a target completion in 2027 and describing it as 2 per cent of approximately $5 billion in transportation projects including roads and bridges. Establishes the City's own dated statement of the program's size and share, a stronger record than the project web page that says the same.
