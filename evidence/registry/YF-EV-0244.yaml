id: YF-EV-0244
title: "Curbside Management Strategy: Redefining Edmonton's Curbside and Public Parking Space (2022)"
publisher: City of Edmonton
url: https://www.edmonton.ca/sites/default/files/public-files/assets/PDF/Curbside-Management-Strategy.pdf
retrieved_on: 2026-10-02
kind: policy-document
establishes: The City's 2022 strategy for curbside and public parking, presented to Urban Planning Committee on 2022-08-23. Action 2 states that public parking spaces, on-street and off-street, require resources to build, maintain and operate like all mobility infrastructure, that the City can charge user fees to offset these costs in whole or in part, and that pricing can decrease the subsidy on unpriced or underpriced parking; Action 5 states that curbside and off-street parking revenues are budgeted under the Parks and Roads Services Branch and reduce requirements for tax levy funding; Action 3 describes the Residential Parking Program, last updated in 1998. Establishes what the City's own strategy says about the cost and subsidy of unpriced parking and the policy direction it set; it gives no figure for what unpaid on-street parking costs the City and no count of unpaid stalls.
