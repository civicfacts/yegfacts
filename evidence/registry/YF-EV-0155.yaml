establishes: "How Edmonton commuters got to work in the 2021 Census reference week of 2 to 8 May 2021: of 380,315 people in the commuting universe, 3,355 cycled, 323,705 travelled by car, truck or van (298,320 as driver and 25,380 as passenger), 30,860 took public transit and 13,430 walked. The universe is employed people aged 15 and over with a usual workplace or no fixed workplace, so it excludes everyone who worked at home, and it counts journeys to work and no other kind of trip."
