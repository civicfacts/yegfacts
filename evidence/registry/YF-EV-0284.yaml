establishes: The City's public statements that roadways and active pathways have dedicated teams and equipment that do not compete; that on most roadways snow is placed in boulevards or left on roads, which may create windrows, while snow that cannot be placed at the sides is stacked and removed later by a separate team; which windrows the City collects (arterial and collector roads, Business Improvement Areas, bus routes, windrow-free zones, culs-de-sac when necessary) and that in neighbourhoods windrows are generally not removed; and the composition of the sand mix including calcium chloride brine. The page at /snow-faq redirects here.
