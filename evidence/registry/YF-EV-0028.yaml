establishes: "What Calgary counted on its centre-city cycle-track pilot corridors: four times as many daily winter bicycle trips comparing January 2015 with January 2016, and over 160,000 bicycle trips between November 2015 and the end of March 2016. Establishes corridor counts before and after the tracks opened, not a citywide winter mode share and not a controlled causal estimate of the infrastructure's effect."
