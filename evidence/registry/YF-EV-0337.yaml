establishes: The Curbside Collection page as it stood on 2026-09-19, nine days after the post, six days after the last comment under the collection-schedule question (2026-09-13), and three days after the last captured comment in the thread and the thread's capture (both 2026-09-16). It is a later restatement of the schedule, not a record of the page on 2026-09-10. The archive's capture of 2026-06-18 15:04 UTC returns byte-identical content (same SHA-256), so the page's text was the same on those two dates; two captures say nothing about whether the page changed between them, and no capture between them was examined. These bytes are the archive's raw-content endpoint (timestamp 20260919095422). States the published schedule on the capture date; not what was collected at any address.
