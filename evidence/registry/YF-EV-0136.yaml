establishes: "A second City series for Snow and Ice Control actual expenditure by account category: $51.750 million (2023), $64.749 million (2024) and $66.588 million (2025), which differ from the year-end operating updates' program actuals by $3 million to $10 million a year. Establishes that the City reports snow actuals on more than one basis; it does not say which basis the year-end tables use."
