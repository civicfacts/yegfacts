establishes: "The City's project page for the Active Transportation Network Expansion Program as it stood on 2026-08-31, five days after the Infrastructure Committee meeting and within a week of the captured comments: a table of every programme route with its neighbourhoods, facility type, year, status, operational changes and a 'Parking Change(s)' column stating, in the City's words, what on-street parking each route removes, leaves unchanged, or has yet to confirm. Establishes what the City published about each route's parking change on that date; it does not establish stall counts, which the page does not give, or what was built on the ground. These bytes are the Internet Archive's capture (timestamp 20260831170636) of the City's URL, fetched through the archive's raw-content endpoint; the hash matches the copy archived privately on 2026-09-25."
