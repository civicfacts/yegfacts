establishes: "The City's own monthly bicycle counts for every automated counter it publishes, as an aggregate of dataset tq23-qn4m taken on 2026-09-04. Any network total over a range of whole months is a sum of these rows: January to July 2026 is 1,291,714, the same window in 2025 is 1,611,749 and in 2024 is 1,547,532, calendar 2025 is 2,856,631 and July 2025 alone is 436,863. It establishes counted passages past fixed points and nothing about how many people or journeys they represent."
