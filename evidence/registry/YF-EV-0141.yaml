id: YF-EV-0141
title: "Bike and Pedestrian Counts (Eco Counter), dataset tq23-qn4m: monthly bicycle counts across the whole network, 2018-08 to 2026-09"
publisher: City of Edmonton
url: https://data.edmonton.ca/resource/tq23-qn4m.json?%24select=date_trunc_ym%28log_timestamp%29+AS+month%2C+sum%28total_cyclist_count%29+AS+bicycle_count%2C+count%28%2A%29+AS+records&%24group=month&%24order=month&%24limit=500
