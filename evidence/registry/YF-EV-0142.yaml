establishes: "One row per counter per day of 2025, with the counter's configuration and its bicycle count, as an aggregate of dataset tq23-qn4m taken on 2026-09-04. Every per-counter figure in the corridor claim is recomputable from it: the July 2025 medians, the January 2025 medians, the busiest single day, the calendar-year totals and how many days each counter published. It establishes counted passages at the counters the City chose to install, and nothing about lanes the City does not meter."
