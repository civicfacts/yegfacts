establishes: "The City's public statements on winter maintenance of bike lanes: active pathway priority levels 1 to 3 cleared in 24 hours, 3 days and 14 days; the Winter Priority Loop cleared within 24 hours; the answer to \"Why are the bike lanes cleared while the driving lanes aren't?\" (different staff and equipment, so clearing them does not slow down road clearing); and how bike lanes are cleared, including that snow in lanes of 3 metres or more may be blown into trucks and hauled away. Establishes what the City says; not what happened on any street."
