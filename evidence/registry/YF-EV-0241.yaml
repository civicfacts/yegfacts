establishes: The same City project page as retrieved live on 2026-10-01. The route table carries the same columns; since the 2026-08-31 capture, several routes moved from under construction to open for use, the Holyrood, Idylwylde, Bonnie Doon and Strathearn routes moved from 2026 to 2027 with a note that the Infrastructure Committee discussion of 2026-08-26 confirmed the planned routes proceed, and the 50 Street row split in two. Establishes what the City published about each route's parking change on that date, so a reviewer can report whether any route's classification changed between the two dates; it does not establish stall counts or what was built.
