establishes: That during the Fall 2024 Supplemental Capital Budget Adjustment, council defeated, 4 to 7, Capital Budget Amendment 2, which would have decreased capital profile CM-20-0330 by $33,650,000 in 2025 and $33,650,000 in 2026 'with funding from tax-supported debt' to defund the project. Establishes the motion, its wording and the vote; it does not record debate.
