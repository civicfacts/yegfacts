id: YF-EV-0346
title: Development Standards for Residential Waste Collection, revision 1.0 (March 2026)
publisher: City of Edmonton, Waste Services
url: https://www.edmonton.ca/sites/default/files/public-files/documents/development-standards-for-waste-collection.pdf
published_on: 2026-03-02
retrieved_on: 2026-10-04
kind: policy-document
establishes: "The City's design standard for residential waste collection, revision 1.0 dated 2026-03-02: for curbside collection, the containers and collection frequency allocated to each dwelling by stream, with the green cart's frequency by season; for communal collection, a garbage, food scraps and recycling volume allocated per dwelling per week, and the rule that the City sets each property's collection frequency within stated minimums and maximums. These are allocations for designing collection locations, not measures of the garbage households produce or of whether containers overflow."
