id: YF-EV-0055
title: Edmonton's $15M infill property tax dividend
publisher: Jacob Dawang
url: https://www.jacobdawang.com/blog/2026/property-tax-uplift/
published_on: 2026-08-01
retrieved_on: 2026-09-01
kind: analytical-report
establishes: "An independent 2026 analysis matching Edmonton building permits to assessment accounts: 1,242 distinct lots, 95 percent matched to both a 2024 baseline and a 2026 completed assessed value, a median gross assessed-value uplift of roughly $1.7 million per lot for 67 rowhouse lots, against a control group median appreciation of 1.19x. Establishes lot-level assessed-value change in one cohort and that permit-to-assessment matching is feasible on open data; it is assessed values and lot totals, not per-dwelling sale prices."
