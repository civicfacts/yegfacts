id: YF-EV-0251
title: Bylaw 18155, Council Procedures Bylaw, office consolidation of October 29, 2025
publisher: City of Edmonton
url: https://www.edmonton.ca/sites/default/files/public-files/assets/Bylaws/C18155.pdf
published_on: 2025-10-29
retrieved_on: 2026-10-02
kind: legal-audited
establishes: "The procedural rules in force for City Council, Standing Committee and Council Committee meetings on 2026-08-26: section 38(1), each approved speaker may speak for a maximum of 5 minutes; section 38(5), a Councillor at a Standing Committee may ask questions for a maximum of 5 minutes each time; section 38(6), a Councillor may speak to a motion or close debate for up to 5 minutes; section 4, Council or a Standing Committee may waive or modify any part of the bylaw by special resolution, defined in section 2 as two-thirds of all members voting in favour; section 1, the bylaw establishes procedures for the conduct of all meetings and excludes three named bodies, none a Standing Committee. Establishes the standing rule a meeting-specific motion departs from; it does not establish what any meeting did."
