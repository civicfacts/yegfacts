establishes: "The City's one-sheet public summary of service levels: essential roads and the core facilities and pathways network, including the Winter Bike Loop, completed within 1 day; arterial and collector roads within 5 days; industrial roads within 6 days; local and residential roads within 14 days as part of a Phase 2 parking ban; the two parking ban phases; and that centre windrows are picked up within 5 days of their priority level being completed. Establishes the public summary; the Procedure is the standard it summarises."
