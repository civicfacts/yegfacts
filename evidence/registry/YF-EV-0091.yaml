id: YF-EV-0091
title: Changes to publication of interest rate statistics
publisher: Bank of Canada
url: https://www.bankofcanada.ca/2019/08/changes-to-publication-interest-rate/
retrieved_on: 2026-09-02
kind: policy-document
establishes: The Bank of Canada discontinued its monthly chartered-bank interest-rate publication effective 2019-10-01, keeping the historical monthly five-year conventional mortgage series (V122521) and continuing weekly posted rates separately. Establishes that the brief's price-month mortgage rate is not published as a monthly Bank series after September 2019, so a stated rule is needed to derive a monthly value for later purchases; it supplies no rates itself.
