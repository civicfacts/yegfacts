establishes: "The same commuting variables for Edmonton five years earlier: of 466,230 commuters in 2016, 5,575 cycled and 367,225 travelled by car, truck or van (342,145 as driver and 25,080 as passenger); 23,160 of 490,665 employed Edmontonians worked at home. It establishes the 2016 figures for comparison and nothing about which year is the more typical one."
