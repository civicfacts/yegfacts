establishes: Every short-duration manual bicycle count the City published between 2009-09-16 and 2016-09-28, with the location, date, hours counted and two-way bicycle volume. It establishes what was counted on those streets on those days, including the only counts the City has ever published on 82 Avenue, and it establishes that no such count exists for 119 Avenue, 132 Avenue or the Hermitage lanes.
