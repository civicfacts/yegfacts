establishes: "The most recent Edmonton travel survey with published results: bicycles were 1.7 per cent of the 3,139,100 daily trips City of Edmonton residents made and 0.8 per cent of the 1,331,800 daily trips Region residents made, from about 21,000 households surveyed on weekdays between 2015-09-14 and 2015-12-11. It establishes a weekday trip share in the autumn of 2015 and nothing about any later year, about weekends, or about how many people ride."
