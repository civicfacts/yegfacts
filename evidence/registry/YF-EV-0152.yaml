excerpts:
  - Between September 14, 2015 and December 11, 2015, approximately 21,000 households in the Edmonton metropolitan area participated in a survey which collected information about the household, the residents of the household, and travel information for each member of the household for a 24 hour weekday period.
  - Walk trips represent 10.8% of City residents' trips and 6.4% of Region residents' trips. The corresponding cycling shares are 1.7% and 0.8% respectively.
  - Cycling has experienced by far the greatest growth, increasing 4.5 times among City residents and 14 times among Region residents since 1994. Mode share in 2015 was 1.7% in the City and 0.8% in the Region.
