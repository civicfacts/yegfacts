establishes: "Administration's own account, dated for the Utility Committee of 2022-02-04, of the Edmonton Cart Rollout: how many homes received carts and when, the demonstration phase, tonnes collected by stream from 2021-04-13 to 2021-12-31, what it says the rollout introduced (volume limits, cart-based collection), what it did and did not monitor in garbage carts, and the research it planned for 2022. The live portal file (DocumentId 126828) answers scripts with a browser check; these bytes are the archive's raw-content endpoint (timestamp 20220630130329). The report states no measure of how full garbage carts were."
