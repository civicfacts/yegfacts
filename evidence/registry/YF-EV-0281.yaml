id: YF-EV-0281
title: Snow and Ice Control Procedure under Policy C409K, approved by the City Manager 2025-10-15 (2025-2026 version)
publisher: City of Edmonton
url: https://www.edmonton.ca/sites/default/files/public-files/assets/PDF/Snow-Ice-Control-Procedure_C409K.pdf
published_on: 2025-10-15
retrieved_on: 2026-10-02
kind: policy-document
establishes: "The administrative procedure in force on the as-of date, as linked from the City's Snow Clearing Service Levels page on 2026-10-02: section 1 sets the priority hierarchy and completion standards for roadways (Priority 1 bare pavement within 24 hours; Priority 2 within 120 hours; Priority 3 within 144 hours; Priority 4 residential roadways to 5 cm snowpack within 240 hours once a residential blading cycle is initiated) and for active pathways (Priority 1, including the Winter Priority Bike Network of protected bike lanes, designated painted bike lanes and designated shared pathways, bare pavement within 24 hours; Priority 2 within 68 hours; Priority 3 within 14 days); section 2 sets when snow is removed from business districts, arterial and collector roadways (including the 3.2 metre driving-lane trigger), that snow is not removed from residential roadways unless to permit safe vehicular movement, what clearing and removing mean for active pathways, that painted bike lanes receive the adjacent roadway's service, the windrow encroachment rules for driveways, sidewalks and protected bike lanes, what is left clear of windrows, material application including the uses of calcium chloride, and the two-phase parking ban; section 3 defines the terms. Establishes the City's published standard; it does not establish what crews did on any street."
