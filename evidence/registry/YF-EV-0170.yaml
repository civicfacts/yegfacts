establishes: The City's table of its network-expansion routes with neighbourhoods, facility type, year and status. It lists 96 Street from 119 to 124 Avenue (Delton, Alberta Avenue) as a protected contraflow bike lane built in 2025 and open for use, with 96 Street converted to one-way southbound for vehicle traffic to accommodate that lane and parking removed on the east side. It lists 100 Street from 80 to 83 Avenue (Strathcona, Ritchie) as a protected two-way bike lane that opened in 2025, with 100 Street from 76 to 83 Avenue converted to one-way northbound to accommodate the bike lanes and a shared pathway. It does not record prior lane use for every route.
