establishes: "The capital budget council adopted for 2023-2026: Table 8 (page 56) gives the adopted budget by service, including one combined line, 'Active Pathways and Roads Service', 622.8 growth plus 1,171.2 renewal, 1,794.0 total in $ millions for 2023-2026; Appendix A (pages 96-105) lists every capital profile with its 2023-2026 amounts in $000s, including CM-20-0330 Active Transportation Implementation Acceleration - Approach 3 at 5,950 / 26,750 / 33,650 / 33,650, total 100,000; the profile sheets that follow carry each profile's Service Category label (for example Roads, Neighbourhood Renewal, Public Transit). Establishes approved amounts and the City's own classification of profiles; it does not establish what was spent."
