establishes: The full minutes of the December 2022 budget deliberations. For CM-20-0330 they record that amendments to Capital Budget Amendment 7 proposing other amounts or structures ($30,000,000 with $70,000,000 held in abeyance, $50,000,000 under Approach 1, $95,766,000, and $201,000,000 over 2023 to 2030), each with funding from Tax-Supported Debt, were withdrawn, and that the re-stated amendment approving CM-20-0330 for $100,000,000 with funding coming from Tax-Supported Debt carried 9 to 4. Establishes motions, dispositions and votes; the minutes do not record debate.
