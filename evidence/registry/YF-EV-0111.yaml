id: YF-EV-0111
title: "2025 Assessment Methodology: Residential Improved Properties (updated January 31, 2025)"
publisher: City of Edmonton
url: https://www.edmonton.ca/sites/default/files/public-files/2025_RES_Improved.pdf?cb=1737210374
published_on: 2025-01-31
retrieved_on: 2026-09-02
kind: policy-document
establishes: "The City's stated valuation rules for residential improved property on the 2025 roll: 'Valuation Date refers to the legislated date of July 1, 2024', and that an assessment estimates the fee simple value 'as the property existed on December 31, 2024' and 'as if the property had been sold on July 1, 2024', under the Municipal Government Act, R.S.A. 2000, c. M-26 and the Matters Relating to Assessment and Taxation Regulation, 2018, Alta Reg 203/17. Establishes what date an assessed value refers to, which is what lets a roll value stand in for a price; it is a methodology guide and carries no assessed value, sale price or teardown-replacement pair."
