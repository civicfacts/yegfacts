establishes: The City's own account of the 102 Avenue conversion. 102 Avenue from 121 Street to 111 Street was a two-way road. To fit the protected bike lane either the parking lane or one travel lane had to go, and the City's recommended plan removed the westbound travel lane, making the section one-way eastbound with parking kept on the south side. It is a plan written before the work was finished and does not by itself show the work was built. The City's own URL now returns a page-not-found page; these bytes are the Internet Archive's capture of that URL taken 2024-07-13.
