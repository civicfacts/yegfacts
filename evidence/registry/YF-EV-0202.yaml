establishes: The Arterial Road Renewal Program section says the assessed arterial network is compared to Council's overall target of fewer than 10 per cent of the arterial roads in D or F condition, and that arterial roads are assessed for surface distress and ride comfort every two years and for structural integrity every five. Elsewhere it says the City has 1,180 kilometres of alleys, two-thirds of them in poor condition, and describes an Alley Renewal Strategy, introduced in 2017, to eliminate alleys rated to be in very poor condition. Establishes that such a target and such an alley estimate were stated in the 2019-2022 budget cycle; it does not establish that the target was in force on 2026-09-03, that it applies to any asset beyond arterial roads, or what condition alleys were in at any later date.
