establishes: "How the City's curbside collection records work and how reliable they are: carts carry radio tags that record each tip; collectors press one of three buttons (spacing, not out, non-compliant) to record why a cart was not tipped; the auditor found the non-collection data incomplete and inaccurate, found no data assurance or control process for the application, and found collectors used the non-compliant button inconsistently, some counting an overflowing cart as non-compliant and others not. Establishes the records' existence and their stated limits; it reports no set-out rate, no fill measure and no count of overflowing carts that the auditor treats as reliable. Dating: the cover prints AUGUST 15, 2024, which is recorded as the report date; the PDF metadata gives a creation date of 2024-08-15 and a modification date of 2024-08-23, which is not the report date. The number 23515 appears in the file name only, not in the report."
