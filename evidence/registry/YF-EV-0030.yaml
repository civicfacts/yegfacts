excerpts:
  - In Montréal (Québec, Canada), the higher retention rate for cyclists in winter since 2012 was 13.6% for the 2020–2021 season
  - Retention rates were 9.09%, 6.96%, and 4.35% in Sherbrooke (semi-urban), Gatineau (semi-urban), and Saguenay (rural), respectively
