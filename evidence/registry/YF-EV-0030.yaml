id: YF-EV-0030
title: It's snowing? Keep on rolling! Individual determinants of winter cycling in Québec
publisher: Active Travel Studies
url: https://activetravelstudies.org/article/id/1384/
retrieved_on: 2026-09-01
kind: analytical-report
establishes: "Winter cyclist retention rates the paper reports for Québec, citing Québec sources: 13.6% in Montréal for the 2020–2021 season, and 9.09% in Sherbrooke, 6.96% in Gatineau and 4.35% in Saguenay. Establishes the share of cyclists who keep riding through winter as the paper reports it — not a bicycle share of all trips, and not which city characteristic produced the differences."
