establishes: The RF1 zone text as consolidated after amendments dated 2007 to 2021, permitting a detached house plus a secondary suite plus a garden suite on a 250.8 square metre lot. Establishes that the RF1 label's permissions changed within the Bylaw 12800 era, so instrument classification depends on the density threshold chosen; it is a web consolidation, not a dated office consolidation.
