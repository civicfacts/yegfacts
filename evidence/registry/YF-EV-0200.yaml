retrieved_on: 2026-09-24
kind: analytical-report
establishes: "The City's latest published condition ratings available by 2026-09-03, built from asset data collected as of December 31, 2024. The rating scale runs A (very good) to F (very poor), assessed on physical condition, and replacement value weights the shares. Appendix B (page 37) gives the Roads class, under Goods and People Movement, at a replacement value of $10,484,313,206: 70.8% Good (A and B), 16.2% Fair (C), 11.2% Poor (D and F) and 1.7% not rated. Its three nested rows are Paved Roads (12.5% D and F), Unpaved Roads (100% not rated) and Curbs (7.0% D and F), and the 2023 report's Roads row beside it is 11.4% D and F, without a Curbs row. The report says its methodology differs from previous years. Establishes the City's own citywide rating on that date; it does not establish the condition of any street or of the network after December 31, 2024."
