establishes: "That the bylaw in force (passed 2023-02-22, consolidated 2026-03-17, repealing Bylaw 18590) sets no collection frequency in its own text: section 20 authorizes the City Manager to determine the collection day and the frequency of collection for each waste stream and the number and types of carts assigned to a home. Also the 2026 monthly rates by cart size in Schedule 1."
