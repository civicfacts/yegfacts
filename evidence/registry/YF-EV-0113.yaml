establishes: "The text of section 814 of the repealed Zoning Bylaw 12800 as served from the City's webdocs consolidation, including '814.1 General Purpose' and '814.2 Area of Application: This Overlay applies to all Sites zoned RF1, RF2, RF3, RF4 and RF5 within the areas shown on the Appendix to this Overlay', with the latest amendment shown on the page being Charter Bylaw 18967, August 26, 2019. Establishes the site-zoning condition the mature-neighbourhood subset is defined by; the archived bytes carry no Appendix map, no parcel list and no statement about the bylaw's repeal, so no parcel can be classified from them."
