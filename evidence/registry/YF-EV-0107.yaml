establishes: Statistics Canada's household spending table, including the water, fuel and electricity category for the principal accommodation by province, with 2023 as the latest reference year released before the freeze date. Establishes the provincial average from which the fixed monthly utility allowance is derived; it is a provincial average, not a cost observed for any replacement dwelling, and could move cases near the threshold.
