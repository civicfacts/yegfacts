establishes: That the committee's 2026-08-31 agenda, with item 7.1 Snow and Ice Control Policy and Program Review, report CO03513 and its thirteen attachments including Attachment 11 Summary of Calcium Chloride Usage, was published on the City portal by 2026-08-22 16:26 UTC, five days before the first captured comment. The capture lists the files under DocumentIds 303379 to 303392 and no Administration presentation; the live page on 2026-10-02 (YF-EV-0287) lists the same titles under 304803 to 304816 and adds the presentation as 304817, so the files were re-posted under new ids between the two dates. These bytes are the archive's raw-content endpoint for the capture (timestamp 20260822162600). Establishes the agenda as it stood on that date; not the contents of any attached file.
