establishes: "Administration's nine-page cover report recommending the four-stream curbside set-out: the green cart weekly in spring, summer and fall and biweekly in winter, recycling weekly in unlimited blue bags, and garbage in a 120 L or 240 L black cart every two weeks; that the service then in place allowed unlimited garbage at the curb; and, on its page 8, a chart titled Black Cart Size Satisfaction - Post Delivery from follow-up canvassing in the demonstration neighbourhoods up to July 18 (2019), giving resident answers too large, too small, just right or don't know, separately for 120 L and 240 L neighbourhoods, with sample sizes 1,664 and 1,740. The chart is not broken down by household size and the report does not describe how the canvass was sampled. The City address (edmonton.ca/programs_services/documents/PDF/SingleUnitWasteSetOutBusinessCase_CR_7173.PDF) redirected to a not-found page on 2026-10-04; these bytes are the archive's raw-content endpoint (timestamp 20201010081445), whose SHA-1 matches the archive's recorded digest."
