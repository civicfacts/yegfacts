establishes: The City's own account of the existence, date and district structure of Edmonton zoning instruments from 1933 onward, and its characterization that most lots were zoned one-family. It is a secondary description of the bylaw text, does not state the minimum lot area for the B district, and its era labels do not map onto today's meaning of a low-density residential zone.
