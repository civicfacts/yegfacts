excerpts:
  - Edmonton's 2024 Community GHG Inventory shows that GHG emissions are not decreasing over time and are not on track to meet the 2025, 2030 and 2050 emissions targets.
  - Based on annual emission reduction targets to reach the 2025 goal, Edmonton's community emissions were targeted to be 12.2 million tCO2e or less in 2024; however, this 2024 target was not met.
