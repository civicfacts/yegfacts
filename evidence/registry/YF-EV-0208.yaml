establishes: In its financial statement discussion and analysis (page 53), the City states that the 2027-2036 Capital Investment Outlook presented to Council in January 2026 identified a $10.0 billion infrastructure gap, an ideal ten-year renewal investment of $17.6 billion against a forecast $7.6 billion, and that the renewal investment shortfall in 2027-2030 is approximately $2.7 billion. Establishes the City's forward renewal shortfall for the next budget cycle; it gives no figure for 2023-2026.
