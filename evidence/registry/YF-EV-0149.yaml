kind: observed-data
establishes: "The City's August 2014 bike ridership survey, how it was recruited and what its 816 respondents answered: 327 chose 'Never ride a bike' for spring, summer and fall, and 715 chose it for winter. It establishes what an opt-in panel of 646 Insight Community members plus 170 anonymous-link respondents said. It establishes nothing about the population of Edmonton, because the sample was self-selected."
