excerpts:
  - "At the time the survey was launched survey invitations were sent to 1029 Insight Community Members. 646 members completed the survey which represents a completion rate of 63%. A total of 816 respondents completed the survey: 646 Insight Community Members and 170 using the anonymous link which will have no demographic info."
  - "Question: How often do you ride a bike during the spring/summer/fall? || Possible Answers: Daily/4 or more times a week/2 to 3 times a week/Once a week/Once a month/Never ride a bike"
