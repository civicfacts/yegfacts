establishes: "That council carried, 9 to 4, Capital Budget Amendment 7 as re-stated: new capital profile CM-20-0330 approved for $100,000,000 ($5,950,000 in 2023, $26,750,000 in 2024, $33,650,000 in 2025, $33,650,000 in 2026), funded by tax-supported debt; and Operating Budget Amendment 18, funding the Enhanced Snow and Ice Control Service Standards package at 20 per cent ongoing from the tax levy, $3,768,000 for Parks and Roads Services and $274,600 for Community Standards and Neighbourhoods in 2023. Establishes what council approved and the votes recorded; the minutes record motions and votes, not debate speech."
