establishes: That the 102 Avenue conversion was built. The City's map and guide, issued after the 2017 construction, says 102 Avenue is now one-way for vehicle traffic heading east from 121 Street to 111 Street and marks the two-way protected bike lane on it as new in 2017. Its map labels the neighbourhood along that stretch Oliver. It does not itself say what the space was used for before.
