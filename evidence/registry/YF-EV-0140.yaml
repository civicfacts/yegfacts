establishes: "Administration's recommended modified approach: it would apply only to program routes not yet under construction; routes whose plans do not affect travel lanes or parking would continue (13 named projects); 14 named routes could be re-evaluated using alternate design approaches, with a report on trade-offs, options and remaining funding in Q1 2027. Establishes what administration proposed and which routes it named; it does not establish what the committee decided."
