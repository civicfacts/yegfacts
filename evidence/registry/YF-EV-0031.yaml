id: YF-EV-0031
title: "Built environment and seasonal variation in active transportation: A longitudinal, mixed-method study in the Helsinki Metropolitan Area"
publisher: Journal of Transport & Health (Aalto University repository copy)
url: https://acris.aalto.fi/ws/portalfiles/portal/90324267/1_s2.0_S2214140522001839_main.pdf
published_on: 2022-12-01
retrieved_on: 2026-09-01
kind: analytical-report
establishes: "What a longitudinal study of 384 Helsinki-area adults found about who keeps cycling in winter: residential density and travel-related urban form predicted retention, while the length of the pedestrian and cycling network and the winter maintenance of cycleways did not contribute significantly once density and urban form were accounted for. Establishes associations in one Finnish sample; it does not establish that maintenance has no effect, and says nothing directly about Edmonton."
