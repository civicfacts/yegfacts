establishes: The same City project page as captured by the Internet Archive on 2026-07-07 (timestamp 20260707130507), before the 2026-08-26 committee meeting. It carries the Grovenor routes (148 Street, 104 Avenue, 144 Street) as a local street bikeway starting construction in 2026 with the parking removals the City then planned, and the 50 Street route with parking to be removed on both sides from 101A Avenue to 109A Avenue; by 2026-08-31 the Grovenor row read N/A and deferred, with a note that the routes were cancelled over community and Council feedback about the loss of parking, and the 50 Street row read to be confirmed after Council's motion of 2026-07-07. Establishes what the City published on that date, for the routes it later cancelled or redesigned; it does not establish stall counts or what was built.
