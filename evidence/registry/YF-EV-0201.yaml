establishes: In its financial statement discussion and analysis (page 53), the City states that the renewal investment shortfall in 2023-2026 is approximately $1.52 billion; that, excluding renewal programs with constrained funding such as neighbourhood renewal and bridges, the remainder of the renewal program is funded at 35.4 per cent of its ideal investment; and that the 2023-2032 Capital Investment Outlook presented to Council in June 2022 identified a $4.8 billion infrastructure gap over ten years. Establishes the City's own later statement of the 2023-2026 renewal shortfall; the figure is stated as approximate and is not broken down by asset class.
