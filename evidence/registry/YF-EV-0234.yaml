establishes: "The City's page for the 132 Avenue Collector Renewal, Fort Road to 127 Street: construction updates by month, the 2023 to 2027 schedule, that the 2025 season completed the new active transportation network between 113A Street and 121 Street and between 66 Street and Delwood Road, and links to the final design plans, the What We Decided report and the FAQ. Establishes that the 132 Avenue bike lanes were built under the neighbourhood renewal programme and not under the Active Transportation Network Expansion Program, and where the design record for its parking changes is; the page itself states no parking removal."
