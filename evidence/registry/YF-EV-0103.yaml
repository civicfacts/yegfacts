establishes: "Administration's one-year review of Zoning Bylaw 20001: 16,511 dwelling units approved in 2024, a 30 percent increase, 40 percent of them in the redeveloping area, with a large share of multi-dwelling permits being eight-unit row housing in the RS zone. Establishes the City's description of the city-wide 2024 permit mix and product mix; it reports approvals only, and carries no matched teardown replacements, no prices and no assessed values."
