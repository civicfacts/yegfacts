establishes: Every meeting the registry records, with its date, the organization, who it lobbied on behalf of, who was met with and the subject. The export holds 758 rows dated from 2017-11-07 to 2021-09-15 and none later, so the registry records no meeting in the 2021-2025 or 2025-2029 Council terms. Establishes what the Mayor's Office registered for the 2017-2021 term; it establishes nothing about meetings after 2021-09-15 or about any office other than the Mayor's.
