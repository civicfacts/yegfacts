id: YF-EV-0252
title: Lobbyists Act, Statutes of Alberta 2007 chapter L-20.5, office consolidation current as of December 15, 2022
publisher: Alberta King's Printer
url: https://kings-printer.alberta.ca/documents/Acts/L20P5.pdf
published_on: 2022-12-15
retrieved_on: 2026-10-02
kind: legal-audited
establishes: "Whom Alberta's lobbyist registry covers: section 1(1)(k) defines a public office holder as a Member of the Legislative Assembly and the Member's staff, a member of the Executive Council, the Premier's and Ministers' staff, an appointee to a board, committee or council under the Government Organization Act, and an employee, officer, director or member of a department or prescribed Provincial entity; section 1(1)(f) defines lobbying as communicating with a public office holder to influence provincial legislative proposals, bills, regulations, policies, programs and contracts; section 3(1)(c) and (d) separately exempt municipal councillors, their staff and municipal officers and employees acting in their official capacity. Establishes that a registration under the Act records lobbying of provincial public office holders and not lobbying of a city council or its committees."
