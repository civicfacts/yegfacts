id: YF-EV-0345
title: 2023-2026 Proposed Waste Services Utility Budget and Plans (November 2022)
publisher: City of Edmonton, Waste Services
url: https://www.edmonton.ca/sites/default/files/public-files/2023-2026-Wastes-Services-Utility-Budget-and-Plans.pdf
retrieved_on: 2026-10-04
kind: policy-document
establishes: "A November 2022 City budget document, titled 2023-2026 Proposed Waste Services Utility Budget and Plans, that describes in retrospect the 2021 change to curbside collection and lists the service standards Waste Services set as part of that program: the frequency of blue-bag recycling, black-cart garbage and yard waste, and the green food scraps cart's frequency by named months of the year. Establishes what the City reported in November 2022 as the standards set in 2021. It does not establish that the proposed budget was adopted or that those standards were still in operation in 2026; a later change would not appear in it. Dating: the cover is dated November 2022; the PDF metadata gives a creation date of 2022-11-10 and a modification date of 2022-12-16; no publication date was observed, so none is recorded. States a published standard, not what was collected at any address."
