establishes: "The file City Council's agenda page for 2025-11-24 (YF-EV-0299) lists under item 7.2 as DocumentId 278877, titled 'Attachment 2 - FCS03158 - Operating Budget - Fall 2025 Supplemental Operating Budget Adjustment.pdf', 144 pages, as served on 2026-10-02. The City Council - Budget agenda page for 2025-12-01 (YF-EV-0301) lists the same attachment under item 5.2 as DocumentId 280346, titled '5.2 ADDENDUM Attachment 2 - FCS03158 - Operating Budget - Fall 2025 Supplemental Operating Budget Adjustment.pdf'; a person downloaded both in a browser on 2026-10-02 and the bytes are identical (the same SHA-256), so this one entry covers both DocumentIds. This entry records the document's identity and provenance. The review panel read the 4 of its 36 sections a published rule selected, and the snow-clearing question page quotes and reports figures from those sections. Establishes what Administration's attachment of that title says; it does not establish what Council decided."
