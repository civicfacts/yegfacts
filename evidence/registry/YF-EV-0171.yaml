establishes: The City's construction record for the 132 Avenue collector renewal. Work began in 2023; the 2023 season completed road reconstruction and the new active transportation network between 101 Street and 107 Street, later seasons did the same on further sections, and remaining work between 121 and 127 Street was expected to finish in mid-October 2026. It does not say which finished sections put a bike lane where a driving lane had been.
