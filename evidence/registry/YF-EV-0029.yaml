establishes: "Bicycle commute shares for the 50 largest U.S. cities on one common journey-to-work denominator: Minneapolis 4.1% in 2008–2012 (1.9% in 2000) against Houston 0.4%, Phoenix 0.7%, San Antonio 0.2% and Dallas 0.1%. Establishes annual commuting shares, not all-trip mode shares, not winter-specific behaviour, and not what causes the differences between cities."
