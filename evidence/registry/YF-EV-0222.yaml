establishes: Administration's recommended modified approach as first published, three pages. It would apply to routes not yet under construction and those planned for 2027; routes that affect travel lanes or parking would be removed from the program and could be reconsidered through future projects; 13 named projects would continue as planned; 14 named projects, under the heading 'Will be reevaluated for feasibility and subject to funding availability', would be removed from the program's scope for 2026 and 2027 if Council approved the change and might later be revisited using alternate designs. Establishes what administration proposed and in what words; it does not establish what the committee or Council decided.
