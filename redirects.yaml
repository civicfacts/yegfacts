# Redirects, as data (D-0029).
#
# Questions and claims got permanent addresses, and the pages that used to
# carry them did not. Every address the site has published stays reachable, so
# each one is listed here with where it goes now and why it moved.
#
# This file is the source of truth. `src/lib/redirects.ts` reads it and adds
# the ones that can be derived from the register — every question id and every
# claim id under `/considered/<id>` — so a question registered tomorrow keeps
# its old-style address without anyone editing this file. `npm run validate`
# checks both halves.
#
# Fields
# ------
#
#   from     the path as it was published, with no trailing slash.
#   to       where it goes now.
#   why      one sentence, for whoever reads this in a year.
#   pending  true while the target route does not exist yet. The validator
#            requires a non-pending target to resolve in the register, and
#            requires a pending one NOT to — so the flag cannot be left on
#            after the route lands.
#
# Fragments
# ---------
#
# A fragment never reaches the server: a request for `/facts/x#claim-1` arrives
# as `/facts/x`. The browser re-applies the fragment to the redirect target
# when the target carries none of its own. Verified in Chromium against a local
# 301 on 2026-09-03: the server logged `/facts/at`, and the browser finished at
# `/questions/at#claim-anchor-1`.
#
# So an old `/facts/<slug>#<claim-id>` link lands on `/questions/<id>` with the
# claim's anchor intact, and the question page carries an anchor per claim
# already. No client-side hop is needed for that case. One would only be needed
# to send a reader on from the question page to the claim's own page, which is
# a separate decision about where a claim anchor should land, not a technical
# necessity.
#
# Cloudflare Pages serves `public/_redirects` before static files. Whatever
# consumes this file — a generated `_redirects`, or an Astro route in the shape
# of `src/pages/[alias].astro` — the rule is the same: no wildcard may cover
# `/questions/*` or `/claims/*`, or it swallows the real pages.
#
# Also to be rewired against this file: `src/pages/[alias].astro`, which
# generates root-level alias redirects out of each published story's and each
# published claim's `aliases`. Those still point at `/facts/<slug>` and
# `/facts/<slug>#<claim-id>`; when the six stories become questions, they point
# at `/questions/<id>` and `/claims/<id>`.

redirects:
  # ---------------------------------------------------------------------------
  # The register's own pages
  # ---------------------------------------------------------------------------
  - from: /considered
    to: /questions
    why: "The register and the index are one page, and it is called what it lists."

  # `/considered/<id>` is not listed entry by entry: `src/lib/redirects.ts`
  # derives one per question and one per claim from the register, so a row
  # added tomorrow is covered without an edit here.

  - from: /stories
    to: /questions
    why: "The word story left the site; the findings are read off the questions."

  # `/claims` was the findings list before it was retired into `/search`, and
  # `public/_redirects` still carries that rule. It is now the claim namespace's
  # index path, so bouncing it to search would tell a reader that claims are a
  # search feature rather than the unit of judgement. It points at the register
  # instead. The rule matches this exact path only; nothing here may redirect
  # anything under `/claims/`, which the validator enforces.
  #
  # TO DO in the next batch, together: replace the `/claims /search 301` line in
  # `public/_redirects` with whatever is generated from this file. Until
  # `/questions` exists, the `_redirects` line is still the correct live rule
  # and is deliberately left alone.
  - from: /claims
    to: /questions
    why: "The old findings list is the register, and /claims/<id> is now one claim each."

  # ---------------------------------------------------------------------------
  # The rows the whole-source grouping superseded
  #
  # Each was registered by hand before the Yegscoop post was read end to end,
  # and each is now claims inside a question, grouped from the capture rather
  # than picked out of it. The row is gone from the register; the address is not.
  # ---------------------------------------------------------------------------
  - from: /considered/bike-lanes-nobody-rides
    to: /questions/cycling-volumes
    why: "Six claims about how much the lanes are used, grouped from the source."
  - from: /considered/at-congestion-reduced
    to: /questions/lanes-and-congestion
    why: "Both directions of the congestion argument are claims under one question."
  - from: /considered/at-100m-a-year
    to: /questions/hundred-million-approval
    why: "The $100 million figure is checked under the question about the approval."
  - from: /considered/bike-100m-one-percent-of-roads
    to: /questions/bike-vs-road-spending
    why: "The share-of-the-roads-budget comparison is a claim under that question."
  - from: /considered/fifty-street-181m-600m
    to: /questions/bike-vs-road-spending
    why: "The 50 Street comparison is a second claim under the same question."
  - from: /considered/rice-50m-motions-and-review
    to: /questions/council-pause-vote
    why: "The motions and the route review are three claims under one question."
  - from: /considered/lanes-removed-citywide
    to: /claims/city-removed-traffic-lanes
    why: "Registered on its own, then merged into the claim grouped from the source."
  - from: /considered/fifteen-minute-city-agreement
    to: /claims/15-minute-city-agreement
    why: "Registered on its own, then merged into the claim grouped from the source."

  # ---------------------------------------------------------------------------
  # The six published stories
  #
  # Each becomes a question keeping the slug it was published under, so the
  # move is one hop and an old claim anchor rides along with it. Pending until
  # those questions are in the register.
  # ---------------------------------------------------------------------------
  - from: /facts/active-transportation
    to: /questions/active-transportation
    why: "The published story becomes the question it always answered."
    pending: true
  - from: /facts/climate-targets
    to: /questions/climate-targets
    why: "The published story becomes the question it always answered."
    pending: true
  - from: /facts/electric-buses
    to: /questions/electric-buses
    why: "The published story becomes the question it always answered."
    pending: true
  - from: /facts/fifteen-minute-districts
    to: /questions/fifteen-minute-districts
    why: "The published story becomes the question it always answered."
    pending: true
  - from: /facts/infill-prices
    to: /questions/infill-prices
    why: "The published story becomes the question it always answered."
    pending: true
  # The one story whose slug is already taken: `winter-cycling` is the Yegscoop
  # question "Can people cycle through an Edmonton winter, and do they?", which
  # is a different question from the published story's, and ids are permanent.
  # Sending the old address to that question would answer a reader with the
  # wrong page, so until the story's question has an id of its own this lands on
  # the register. Whoever gives it one repoints this line; the id is a decision
  # about a permanent address and is not made here.
  - from: /facts/winter-cycling
    to: /questions
    why: "Its slug already names a different question, so the address waits on the register."
